# Harbor CI — build + test the whole solution.
#
# Structure:
#   build    — Release build of Harbor.slnx (zero-warning gate, documentation
#              warnings included since #701, + the embedded
#              HarborArchitectureGate) and a CLI smoke run.
#   test     — shard matrix: explicit test-project lists per shard, run
#              SEQUENTIALLY inside each shard (cross-module parallelism
#              amplifies the known Avalonia-headless and perf-ceiling flakes
#              that reproduce under a solution-wide `dotnet test`).
#   test-os  — windows-latest + macOS-latest matrix for the portable core
#              suites (TUI headless + IPC included).
#   coverage — report-only coverage collection (issue #99): core + platform
#              suites under the MTP CodeCoverage extension, per-project line
#              rates in the job summary + raw cobertura.xml artifacts.
#              NEVER gates (no thresholds, exit 0 by design).
#   aot-publish — NativeAOT publish of Harbor.App.Cli (issue #413): the tree is
#              published with HarborWithAot=true, the trim/AOT diagnostics are
#              compared against .github/aot-warning-baseline.txt, and the
#              PUBLISHED BINARY is executed (--version/--help/--providers). The
#              pass criterion is NOT "zero IL2026 warnings" — it is publish
#              green + inventory matches the committed rows + the artifact runs.
#              See docs/AOT_PUBLISH.md.
#   publish  — self-contained single-file Harbor.App.Cli (linux-x64) upload.
#
# NOTE on running tests: do NOT use `dotnet test` in this repo. The
# `dotnet test` → Microsoft.Testing.Platform bridge discovers ZERO tests
# (MTP host exits 5 with one silent discovery error; verified on SDK 10.0.302
# for every tests/*.Tests project) while the same assemblies run green via
# direct host execution. So every job below runs test projects as plain
# executables: `dotnet run --project tests/<Name> -- <mtp-args>`.
# MTP args forward after `--`: --minimum-expected-tests N (zero-test guard),
# --treenode-filter (TUnit selection), --output Detailed (per-test console).
#
# On test measurements (issue #618): neither the console log nor `--output
# Detailed` is where a test's `Console.WriteLine` belongs — the log prints
# per-assembly counts and nothing per-test, and Detailed would bury the one
# `failed <TestName>` line under a line per green test. Instead both test jobs
# keep `--report-trx` (TUnit already files each test's stdout under that test)
# and hand the TRX to `tools/test-measurements.py`, which renders a
# `Class.Method -> measurement` table into the job summary. Read-only, never a
# gate: the script exits 0 on a missing or corrupt TRX set.
name: ci

on:
  push:
    branches: [dev, master]
    paths-ignore: ['**.md', 'docs/**', 'evals/tasks/**', 'assets/demo/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'evals/tasks/**', 'assets/demo/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NUGET_CERT_REVOCATION_MODE: offline
  MSBuildEnableWorkloadResolver: false
  DOTNET_gcServer: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - 'apps/**'
              - 'contrib/**'
              - 'Directory.*'
              - 'Harbor.slnx'
              - 'global.json'
              - '.github/workflows/ci.yml'
              # Runs INSIDE the test/test-os jobs below. Without this line an
              # edit to the script alone would set dotnet=false, skip the very
              # job that executes it, and land unvalidated (issue #618).
              - 'tools/test-measurements.py'
              # The pack-validation gate's instrument (#429). Same #618
              # argument: editing the validator must run the build job that
              # executes it, or the edit lands unvalidated.
              - 'tools/pack-validate.py'
              # The AOT gate's instrument and its committed inventory (#413).
              # The same argument as the line above, one step further: editing
              # the BASELINE is the ordinary way to answer a red AOT job, and
              # if the baseline were not in the filter then the edit that
              # silences the gate would also be the edit that stops the gate
              # from running — unvalidated, which is the #618 defect again with
              # a different payload. Editing the tool has the same problem.
              - 'tools/aot-publish-gate.py'
              - '.github/aot-warning-baseline.txt'
            ui:
              - 'src/Harbor.Tui*/**'
              - 'src/Harbor.Ui.Framework*/**'
              - 'src/Harbor.Terminal.*/**'
              - 'src/Harbor.DesignSystem/**'
              - 'src/Harbor.App.Avalonia/**'
              - 'apps/Harbor.App.Avalonia/**'
              - 'tests/Harbor.Tui*/**'
              - 'tests/Harbor.Ui.Framework*/**'
              - 'tests/Harbor.Terminal.*/**'
              - 'tests/Harbor.DesignSystem.Tests/**'
              - 'tests/Harbor.App.Avalonia.Tests/**'

  build:
    needs: changes
    if: (needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      # Release build == zero-warning gate. Building Harbor.Architecture.Tests
      # also re-runs the 47-rule architecture gate embedded in
      # Directory.Build.props (HarborArchGate) — any layering regression
      # fails the build itself.
      #
      # #701 — the master/dev fork is GONE, and the reason it existed was not
      # the reason it looks like it existed. It was added in 40fef5b3 with the
      # justification "250 legacy S*** warnings still triaged", pointing at
      # Directory.Build.props NoWarn. Neither half holds:
      #
      #   * Directory.Build.props has carried TreatWarningsAsErrors=true since
      #     the initial commit. So BOTH arms of the old `if` were already
      #     warnings-as-errors, and the `--warnaserror` on the master arm was a
      #     no-op for every shipped project. The fork was never lenient about
      #     warnings; it only ever suppressed the ones that need a documentation
      #     file, by passing GenerateDocumentationFile=false.
      #   * The NoWarn list it cited is ten codes (CS1591, NU1603, CS1570,
      #     CS1571, CS1574, CS0419, S6444, S4036, S2245, S3267) — ten, not 250,
      #     and not one of them an S*** diagnostic.
      #
      # What the fork actually did: turned off GenerateDocumentationFile, and
      # with it the whole doc-warning family — CS1573 (a <param> missing while
      # its siblings are tagged), CS1572, CS1587, RCS1139. Five CS1573 and one
      # RCS1139 landed on green PRs that way, and CS1573 has a hole shaped like
      # the way parameters are added: tag one new parameter and it fires, remove
      # ALL tags and it never fires again.
      #
      # So this is a deletion, not a new gate: one build line for every ref,
      # documentation on, and the doc rules are errors because
      # Directory.Build.props already says so — the same "strictness as a build
      # step" shape as HarborArchGate, not a second job.
      #
      # `--warnaserror` is deliberately NOT on this line. As a CLI global
      # property it overrides tests/Directory.Build.props, which sets
      # TreatWarningsAsErrors=false on purpose (RS0030 and CFE0001 there are
      # documented false positives that would "train people to ignore the
      # analyzer"). The props own the policy; the command line no longer
      # second-guesses it. Test projects also set GenerateDocumentationFile=false
      # there, so the doc gate covers src/ + apps/ + tools/, which is the
      # shipped surface.
      - name: Build solution (Release, zero warnings, docs, deterministic)
        run: dotnet build Harbor.slnx -c Release -p:ContinuousIntegrationBuild=true

      - name: Smoke — CLI binary runs
        run: dotnet exec apps/Harbor.App.Cli/bin/Release/net10.0/Harbor.App.Cli.dll --version

      # NuGet pack + validation (issue #429). Steps, not a new job: no new
      # matrix axis, same Release outputs built above. Pack warnings fail
      # the job because Directory.Build.props sets TreatWarningsAsErrors.
      # Publishing to nuget.org is deliberately NOT here — pack must stay
      # green on every PR long before any release feed is configured.
      - name: Pack NuGet libraries (Release, deterministic)
        run: dotnet pack Harbor.slnx -c Release --no-build -p:ContinuousIntegrationBuild=true -o out/packages

      - name: Validate NuGet packages (metadata, README, lib)
        run: python3 tools/pack-validate.py out/packages

      # Payload determinism across two packs. NuGet stamps zip entry
      # timestamps with pack wall-clock time, so two `dotnet pack` runs are
      # never byte-identical files even under ContinuousIntegrationBuild
      # (measured: identical sizes and CRCs, only date_time differs). The
      # property CI pins is that every entry's bytes are identical — which
      # still catches nondeterministic build inputs (timestamps or dates
      # baked into dlls, generated code, nuspecs).
      - name: Determinism — identical payloads across two packs
        run: |
          dotnet pack Harbor.slnx -c Release --no-build -p:ContinuousIntegrationBuild=true -o out/packages2
          python3 - <<'EOF'
          import sys
          import zipfile
          from pathlib import Path
          first, second = Path("out/packages"), Path("out/packages2")
          bad = []
          for pkg in sorted(first.glob("*.nupkg")):
              other = second / pkg.name
              if not other.exists():
                  bad.append(f"{pkg.name}: missing from second pack")
                  continue
              with zipfile.ZipFile(pkg) as za, zipfile.ZipFile(other) as zb:
                  na = {i.filename: i for i in za.infolist()}
                  nb = {i.filename: i for i in zb.infolist()}
                  if set(na) != set(nb):
                      bad.append(f"{pkg.name}: entry lists differ")
                      continue
                  for name, ia in na.items():
                      ib = nb[name]
                      if ia.file_size != ib.file_size or ia.CRC != ib.CRC or za.read(name) != zb.read(name):
                          bad.append(f"{pkg.name}: entry {name} differs")
          if bad:
              print(f"{len(bad)} nondeterministic entr(y/ies):")
              print("\n".join(f"  - {b}" for b in bad))
              sys.exit(1)
          print("deterministic: identical payloads across two packs")
          EOF

      # Clean-room proof that the dependency graph resolves: throwaway
      # project, local feed for Harbor.* + nuget.org for transitives.
      - name: Smoke-install Harbor.Abstractions + one provider
        run: |
          VER=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2)
          rm -rf /tmp/packsmoke && dotnet new console -n packsmoke -o /tmp/packsmoke --no-restore
          cd /tmp/packsmoke
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/out/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet add package Harbor.Abstractions --version "$VER"
          dotnet add package Harbor.Providers.OpenAiCompatible --version "$VER"
          dotnet build -c Release --nologo

      - name: Upload NuGet packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: out/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      # Advisory report only: surfaces `dotnet list package --vulnerable`
      # output (NU190x advisories) on every PR without failing the build.
      # continue-on-error is intentional — see "Dependency & advisory policy"
      # in docs/DEVELOPMENT.md. Failing on advisories is deferred (issue #25).
      - name: Report vulnerable packages (non-blocking)
        continue-on-error: true
        run: dotnet list Harbor.slnx package --vulnerable --include-transitive

      - name: Upload architecture-gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-gate-log
          path: tests/Harbor.Architecture.Tests/obj/Release/net10.0/harbor-arch-gate.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stash build outputs
        uses: actions/upload-artifact@v7
        with:
          name: solution-binaries
          path: |
            apps/**/bin/Release/net10.0/*.dll
            apps/**/bin/Release/net10.0/*.json
            apps/**/bin/Release/net10.0/*.so
            apps/**/bin/Release/net10.0/Harbor.App.Cli
            src/**/bin/Release/net10.0/*.dll
            src/**/bin/Release/net10.0/*.json
            src/**/bin/Release/net10.0/runtimes/linux-x64/native/*
            tests/**/bin/Release/net10.0/*.dll
            tests/**/bin/Release/net10.0/*.json
            tests/**/bin/Release/net10.0/runtimes/linux-x64/native/*
            # Satellite resource assemblies (#434: UiStrings.<locale>.resx builds
            # into <culture>/*.resources.dll). The top-level *.dll globs above do
            # not cross the culture directory, so without these lines localized
            # lookups silently fall back to en in every job that reuses this
            # artifact while passing locally.
            apps/**/bin/Release/net10.0/*/*.resources.dll
            src/**/bin/Release/net10.0/*/*.resources.dll
            tests/**/bin/Release/net10.0/*/*.resources.dll
            **/obj/project.assets.json
            **/obj/project.nuget.cache
            !**/*.pdb
            !**/*.xml
            !apps/Harbor.App.Avalonia/**
          retention-days: 1
          if-no-files-found: error

  test:
    needs: [changes, build]
    if: (needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        shard: [core, platform, ui, e2e]
        include:
          - shard: core
            # MinimumExpectedTests guard: a silent zero-test regression must
            # fail loudly (MTP exit code 8), never pass as "green".
            guard: true
            projects: >-
              Harbor.Abstractions.Tests
              Harbor.Config.Tests
              Harbor.Domain.Tests
              Harbor.Application.Tests
              Harbor.Core.Tests
              Harbor.Registries.Tests
              Harbor.Hosting.Tests
              Harbor.Architecture.Tests
              Harbor.Lsp.Tests
              Harbor.Terminal.Pty.Tests
              Harbor.Telemetry.Tests
          - shard: platform
            guard: true
            projects: >-
              Harbor.Tools.Builtin.Tests
              Harbor.Storage.Tests
              Harbor.Storage.Jsonl.Tests
              Harbor.Providers.Tests
              Harbor.Transport.Remote.Tests
              Harbor.Plugins.Abstractions.Tests
              Harbor.Plugins.Runtime.Tests
              Harbor.Plugins.Host.Tests
              Harbor.Ipc.Tests
          - shard: ui
            guard: true
            # PerfTests live in renderer-perf-gate.yml — do not duplicate.
            projects: >-
              Harbor.Tui.Tests
              Harbor.Tui.RendererTests
              Harbor.Tui.CellForge.Tests
              Harbor.Ui.Framework.Tests
              Harbor.DesignSystem.Tests
              Harbor.Tui.CellForge.PtyTests
              Harbor.Terminal.Abstractions.Tests
              Harbor.App.Avalonia.Tests
          - shard: e2e
            # Same guard as the three above, and it was OFF here with nothing
            # recorded next to it (#977). The counts made this free: e2e's five
            # projects measured 36 / 104 / 39 / 272 / 28 tests on run
            # 36849021180, so none is near the zero the flag exists to catch.
            # Without it a suite that discovered nothing exits 0 and this shard
            # reports green — and e2e is the ONLY home of those 479 tests:
            # neither test-os's 9-project list nor coverage's 19 contains any of
            # them, and fail-on-empty: false never notices an empty TRX.
            guard: true
            projects: >-
              Harbor.E2E.Cli
              Harbor.E2E.App.Avalonia
              Harbor.Tui.E2E.Tests
              Harbor.App.Cli.Tests
              Harbor.LoadTests
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: solution-binaries

      # ubuntu-latest does not ship ripgrep — without it the RipGrepTool
      # integration tests self-skip and the platform shard silently runs
      # three fewer real tests.
      - name: Ensure ripgrep installed
        if: matrix.shard == 'platform'
        run: |
          if ! command -v rg &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          fi
          rg --version | head -1

      - name: Run shard ${{ matrix.shard }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          guard=""
          if [ "${{ matrix.guard }}" = "true" ]; then
            guard="--minimum-expected-tests 1"
          fi
          trx_dir="TestResults/${{ matrix.shard }}"
          mkdir -p "$trx_dir"
          summary="$GITHUB_STEP_SUMMARY"
          echo "| project | result | duration |" >> "$summary"
          echo "|---|---|---|" >> "$summary"
          rc=0
          for p in ${{ matrix.projects }}; do
            echo "::group::dotnet exec $p"
            start=$(date +%s)
            dll="tests/$p/bin/Release/net10.0/$p.dll"
            if [ ! -f "$dll" ]; then
              echo "Missing $dll — did build artifact download fail?"
              status="FAIL"
              rc=1
            elif dotnet exec "$dll" $guard --report-trx --results-directory "$trx_dir" --report-trx-filename "$p.trx"; then
              status="pass"
            else
              status="FAIL"
              rc=1
            fi
            end=$(date +%s)
            echo "::endgroup::"
            echo "| $p | $status | $((end - start))s |" >> "$summary"
          done
          exit $rc

      # Issue #618 — per-test measurements in the JOB SUMMARY, never in the log.
      # The shard loop above prints per-ASSEMBLY counts only ("Test run summary:
      # Passed! - <dll>", total/failed/succeeded/skipped/duration) and never a
      # test name, so a value a test printed with Console.WriteLine (allocation
      # per turn, fast-path publish fraction, ...) was reachable only by
      # downloading the 7-day test-results-* artifact, unzipping it and grepping
      # XML. Nobody does that mid-incident, so the measurement was invisible.
      #
      # The data is already there: `--report-trx` is passed above, and TUnit
      # writes each test's stdout into THAT test's own <Output><StdOut>. This
      # step only reads it and renders a table keyed by Class.Method, so a
      # measurement can never float free of the test that produced it.
      #
      # Why the summary and not `--output Detailed` in the log: the raw log is
      # read while debugging a failure, and every extra line competes with the
      # compile error and with the one `failed <TestName>` line being scrolled
      # toward. Detailed adds one line per green test — thousands, burying the
      # failure. The summary is a separate panel and cannot compete at all.
      #
      # `if: always()` is load-bearing: the loop exits non-zero on a failed
      # shard, which skips every following step without it — i.e. exactly when
      # the measurement is most wanted. Reporting only, never a gate: the
      # script exits 0 on a missing or corrupt TRX set.
      # `shell: bash` is explicit because test-os reuses this step on
      # windows-latest, where the default shell is pwsh and a trailing `\` is
      # a ParserError, not a line continuation.
      - name: Report test measurements (issue #618)
        if: always()
        shell: bash
        run: |
          python3 tools/test-measurements.py "TestResults/${{ matrix.shard }}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results (${{ matrix.shard }})
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

      - name: Upload TRX test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: "TestResults/**/*.trx"
          if-no-files-found: ignore
          retention-days: 7

  # Task: coverage collection — REPORT-ONLY (issue #99). Runs the fast unit
  # suites (core + platform shard lists) under the MTP CodeCoverage extension
  # (Microsoft.Testing.Extensions.CodeCoverage ships transitively with
  # Microsoft.NET.Test.Sdk — no new packages) and publishes per-project line
  # coverage to the job summary + raw cobertura.xml artifacts (30-day
  # retention feeds the "month of green reports" baseline for a future
  # diff-threshold).
  #
  # Report-only contract (do NOT "fix" into a gate):
  #   - NO thresholds, NO fail-on-numbers. A global percentage gate is
  #     explicitly deferred (legacy areas would fail day one — see #99).
  #   - Per-project test failures are RECORDED, never fatal: the `test` job
  #     stays the gate. Instrumentation must not block PRs on flakes.
  # Excluded suites: ui (Avalonia-headless flakes amplify under
  # instrumentation), e2e/load (slow, need display). Scope is stated in the
  # summary so numbers are never misread as whole-repo coverage.
  coverage:
    needs: [changes, build]
    if: (needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: solution-binaries

      # ubuntu-latest does not ship ripgrep — without it the RipGrepTool
      # integration tests self-skip (same note as in the `test` job).
      - name: Ensure ripgrep installed
        run: |
          if ! command -v rg &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          fi
          rg --version | head -1

      # Per-project failures are recorded in Coverage/status.tsv, never fatal
      # (final `exit 0` is intentional — report-only, see job comment).
      - name: Collect coverage (core + platform unit suites)
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p Coverage
          : > Coverage/status.tsv
          for p in \
            Harbor.Abstractions.Tests \
            Harbor.Config.Tests \
            Harbor.Domain.Tests \
            Harbor.Application.Tests \
            Harbor.Core.Tests \
            Harbor.Registries.Tests \
            Harbor.Hosting.Tests \
            Harbor.Architecture.Tests \
            Harbor.Lsp.Tests \
            Harbor.Telemetry.Tests \
            Harbor.Tools.Builtin.Tests \
            Harbor.Storage.Tests \
            Harbor.Storage.Jsonl.Tests \
            Harbor.Providers.Tests \
            Harbor.Transport.Remote.Tests \
            Harbor.Plugins.Abstractions.Tests \
            Harbor.Plugins.Runtime.Tests \
            Harbor.Plugins.Host.Tests \
            Harbor.Ipc.Tests; do
            echo "::group::coverage $p"
            dll="tests/$p/bin/Release/net10.0/$p.dll"
            if [ ! -f "$dll" ]; then
              echo "Missing $dll — did build artifact download fail?"
              printf '%s\tmissing\n' "$p" >> Coverage/status.tsv
            elif dotnet exec "$dll" --minimum-expected-tests 1 \
                --coverage \
                --coverage-output "$GITHUB_WORKSPACE/Coverage/$p.cobertura.xml" \
                --coverage-output-format cobertura; then
              printf '%s\tpass\n' "$p" >> Coverage/status.tsv
            else
              printf '%s\tFAIL\n' "$p" >> Coverage/status.tsv
            fi
            echo "::endgroup::"
          done
          exit 0

      # Summarize whatever cobertura files exist (explicit outputs + fallback
      # sweep of TestResults in case the extension places files elsewhere).
      # Pure stdlib python — no ReportGenerator/coverlet dependency.
      # No thresholds here: numbers are informational only (issue #99).
      - name: Publish coverage summary (report-only, no thresholds)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          cov_dir = os.path.join(os.environ["GITHUB_WORKSPACE"], "Coverage")
          files = {os.path.basename(f): f for f in glob.glob(os.path.join(cov_dir, "*.cobertura.xml"))}
          for f in glob.glob(os.path.join(os.environ["GITHUB_WORKSPACE"], "TestResults", "**", "*.cobertura.xml"), recursive=True):
              files.setdefault("TestResults/" + os.path.basename(f), f)

          status = {}
          try:
              with open(os.path.join(cov_dir, "status.tsv")) as fh:
                  for line in fh:
                      name, _, st = line.rstrip("\n").partition("\t")
                      status[name.strip()] = st.strip()
          except OSError:
              pass

          lines = ["## Coverage (report-only, issue #99)", "",
                   "_No thresholds — informational only. Scope: core + platform unit",
                   "suites (ui/e2e excluded, see `coverage` job). Per-suite columns",
                   "overlap on shared `src/` assemblies, so the TOTAL is indicative,",
                   "not whole-repo coverage._", "",
                   "| suite | tests | line coverage | lines |", "|---|---|---|---|"]
          total_valid = total_covered = 0
          for name in sorted(files):
              try:
                  root = ET.parse(files[name]).getroot()
                  valid = int(float(root.get("lines-valid", 0)))
                  covered = int(float(root.get("lines-covered", 0)))
                  rate = float(root.get("line-rate", 0.0)) * 100.0
                  cell = f"{rate:.1f}%"
                  detail = f"{covered}/{valid}"
                  total_valid += valid
                  total_covered += covered
              except Exception as ex:
                  cell = "n/a (unparsable)"
                  detail = str(ex)[:60]
              st = status.get(name.removesuffix(".cobertura.xml"), "?")
              short = name.removesuffix(".cobertura.xml")
              lines.append(f"| {short} | {st} | {cell} | {detail} |")
          if total_valid:
              lines += ["",
                        f"**TOTAL (indicative): {100.0 * total_covered / total_valid:.1f}% "
                        f"({total_covered}/{total_valid} lines)**"]
          else:
              lines += ["", "**No cobertura files produced — check the collect step log.**"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload cobertura reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cobertura
          path: "Coverage/*.cobertura.xml"
          if-no-files-found: warn
          retention-days: 30

  # Task: matrix builds. Portable suites only — the bash tool, PTY and
  # SpectreTUI suites are Linux-bound; the heavy Avalonia E2E stays on ubuntu.
  test-os:
    needs: [changes, build]
    # Dependabot action-bump PRs cannot break OS-specific behavior — the
    # slowest matrix is skipped, linux shards still verify correctness.
    if: (needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      # Documentation stays OFF here on purpose (#701): doc diagnostics are
      # platform-independent, so the doc gate has exactly one home — the
      # ubuntu `build` job, which builds the same Harbor.slnx. Re-enabling the
      # doc file on the matrix would double the cost of a signal that cannot
      # differ by OS. This job exists for OS coverage, not for warnings.
      - name: Build for ${{ matrix.os }} (local, no Linux artifact)
        run: dotnet build Harbor.slnx -c Release -p:ContinuousIntegrationBuild=true -p:GenerateDocumentationFile=false

      - name: Test critical suites on ${{ matrix.os }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $projects = @(
            'Harbor.Abstractions.Tests',
            'Harbor.Config.Tests',
            'Harbor.Domain.Tests',
            'Harbor.Application.Tests',
            'Harbor.Core.Tests',
            'Harbor.Storage.Tests',
            'Harbor.Storage.Jsonl.Tests',
            'Harbor.Tui.Tests',
            'Harbor.Tui.CellForge.Tests',
            'Harbor.Ipc.Tests'
          )
          $failed = @()
          # --report-trx (issue #618): this job produced no TRX at all, so a
          # measurement a test printed was unrecoverable here. TRX is written to
          # the runner's disk and consumed by the next step — nothing is
          # uploaded, so this adds no artifact and no retention cost.
          $trxDir = "TestResults/${{ matrix.os }}"
          New-Item -ItemType Directory -Force -Path $trxDir | Out-Null
          foreach ($p in $projects) {
            Write-Host "::group::dotnet exec $p"
            $dll = "tests/$p/bin/Release/net10.0/$p.dll"
            dotnet exec $dll --minimum-expected-tests 1 --report-trx `
              --results-directory $trxDir --report-trx-filename "$p.trx"
            if ($LASTEXITCODE -ne 0) { $failed += $p }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Host "Failed on ${{ matrix.os }}: $($failed -join ', ')"
            exit 1
          }

      # Same rationale as the `test` job — see the long comment there. Worth
      # the extra plumbing here because these are the platform-sensitive
      # measurements (bytes per agent turn, event-bus publish allocations): the
      # question a reader otherwise has to ask by hand is precisely "does this
      # number differ on windows/macOS?", and `test-os` is the only place that
      # can be answered. `if: always()` so a failing OS still reports.
      # `shell: bash` — the windows-latest default shell is pwsh, where the
      # trailing `\` in the command below is a ParserError, not a continuation.
      - name: Report test measurements (issue #618)
        if: always()
        shell: bash
        run: |
          python3 tools/test-measurements.py "TestResults/${{ matrix.os }}" \
            --summary "$GITHUB_STEP_SUMMARY"

  # Task: artifact publishing — self-contained single-file CLI.
  # ── aot-publish (issue #413) ───────────────────────────────────────────────
  #
  # THE HOLE THIS CLOSES
  # --------------------
  # The repo's AOT story is a DECLARATION and nothing has ever evaluated it.
  # `IsAotCompatible=true` sits on four projects (Harbor.DesignSystem,
  # Harbor.Ui.Framework.Rendering, Harbor.Tui.CellForge,
  # Harbor.Tui.CellForge.Engine), and `apps/Harbor.App.Cli` — the one project
  # with a real NativeAOT block — is not among them. Until this job, no workflow
  # anywhere in the repo set `HarborWithAot` or `HARBOR_MINIMAL`, so that block
  # was never evaluated by any build and "AOT analysis passes cleanly" was not
  # merely unverified, it was UNFALSIFIABLE: there was no process whose output
  # could contradict it. Issue #48 scoped the fix and named "zero IL2026" as the
  # wrong gate; this job is that fix.
  #
  # WHAT PASSES, AND WHY IT IS NOT "ZERO IL2xxx"
  # -------------------------------------------
  # Two things, both of which have to hold:
  #
  #   1. The publish's OUTCOME and its trim/AOT diagnostics match
  #      `.github/aot-warning-baseline.txt` exactly — same recorded outcome, no
  #      new id, no changed count, no new first-party site, and no row left
  #      behind for a warning that stopped. tools/aot-publish-gate.py owns that
  #      comparison and prints the id list, the occurrence count and the
  #      error-severity total on every run, so "found 0" can never be a bare,
  #      unreadable number.
  #   2. The published artifact RUNS: --version, --help, --providers, each
  #      asserted on content, not just on exit code.
  #
  # WHY THIS IS A RATCHET AND NOT "THE PUBLISH IS GREEN"
  # ---------------------------------------------------
  # MEASURED, and the measurement is the whole reason the gate looks like this.
  # Since #1055s3 the full-tree publish completes (the Roslyn/plugin-pipeline
  # errors left with the in-process compile path); the stripped profile below
  # still does not compile, and the four remaining warning ids are concessions
  # the baseline argues for one by one:
  #
  #   recipe 2, `-p:HarborWithAot=true` (full tree) — reaches ILC and publishes.
  #     ILC runs warnings-as-errors because IlcTreatWarningsAsErrors defaults
  #     to the repo's TreatWarningsAsErrors; the four demoted ids
  #     (IL2026/IL3050/IL2104/IL3053) print as warnings and do not fail it.
  #     Full inventory in `.github/aot-warning-baseline.txt`, longer account in
  #     docs/AOT_PUBLISH.md.
  #
  #   recipe 1, `HARBOR_MINIMAL=true` (the stripped profile the csproj calls the
  #     real AOT path) — does not compile. PluginReloadService.cs is entirely
  #     inside `#if HARBOR_WITH_PLUGINS` and 11 call sites in apps/Harbor.App.Cli
  #     reference it unguarded, so CS0234 x11. Unevaluated by this gate,
  #     unchanged by the publish flipping to green.
  #
  # A gate that can only be red is not a gate, and one that ignores the publish
  # is worse than none. So the publish step is `continue-on-error` and the gate
  # step immediately after decides: the committed record says "this publish
  # publishes, like this", and the gate passes ONLY on that. If the build
  # starts failing the gate goes RED and says the AOT state moved and the
  # record must be updated — the transition is acknowledged by a human instead
  # of being absorbed. If it starts failing differently, it also goes red.
  #
  # `continue-on-error` is safe here precisely because the next step is a real
  # check against a committed expectation; it is not a way to make a failure
  # quiet. If the publish step dies before writing its marker at all, the gate
  # reports exit 2 and the upload step fails on if-no-files-found.
  #
  # Why the artifact still has to run: a NativeAOT binary is a different program
  # from the JIT one, and "the publish failed" says nothing about whether the
  # steps around it are honest. Step 2 is what would catch a regression in the
  # publish recipe itself — e.g. a dropped env var silently producing a
  # different program than the one the record describes.
  #
  # WHY `-p:HarborWithAot=true` AND NOT `HARBOR_MINIMAL=true`
  # -------------------------------------------------------
  # The full tree, for two reasons that only became clear by running both.
  # First, the stripped profile does not compile, so gating it would mean gating
  # a configuration that cannot be evaluated at all. Second, the full tree is
  # the one whose failures are informative: every id that fails the publish
  # sits in Harbor.Plugins.Compilation or Harbor.Plugins.Instantiation, which is
  # exactly the surface #48/S4 has to decide about. The stripped profile would
  # have hidden all of it behind an absence.
  #
  # Whether the plugin path can be made AOT-clean is #48/S4's decision, not this
  # gate's: the Roslyn IL3000 in particular is not fixable from our code, and
  # #413's own criteria forbid buying green with blanket suppression.
  #
  # WHERE THE INVENTORY LIVES, AND WHY NOT IN THE LOG
  # --------------------------------------------------
  # In `.github/aot-warning-baseline.txt`, committed and diffed in review, and
  # validated by the tool. A gate that only counted warnings in a log nobody
  # reads is a gate whose threshold nobody chose. The csproj's own demotion list
  # and this file are cross-checked against each other by
  # tests/Harbor.Architecture.Tests/AotBlockDemotionRules.cs.
  #
  # WHY THIS IS A SEPARATE JOB AND NOT A STEP IN `build`
  # ---------------------------------------------------
  # #555 freezes new extension axes, so this is a gate added to an existing
  # workflow rather than a new workflow file. It is a separate job because it
  # needs its own `PublishAot` build of the whole tree (~10-20 min, its own
  # ILC pass) and must not consume the `build` job's 15-minute budget; the
  # `build` job would go red on timeout and take the whole solution build with
  # it. It `needs: build` so it starts from a tree already known to compile,
  # and it is NOT in the required-gate list on day one — see the PR body for
  # the measured duration and the sharding decision.
  #
  # ON WALL-CLOCK TIME
  # -----------------
  # There is deliberately NO time threshold on this publish. #998 measured a
  # 1.43x spread on a single-commit job (2.167s..3.088s over six green runs),
  # and a NativeAOT publish is far longer and far more variable than that. An
  # absolute wall-clock threshold on this step would fire on a slow runner and
  # be ignored on a fast one. `timeout-minutes` is the only time bound here and
  # it is a hang detector, not a performance gate; ILC time is reported to the
  # log so the trend is visible without being a pass criterion.
  aot-publish:
    needs: [changes, build]
    if: (needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Generous, because it must not be the thing that goes red: see "ON
    # WALL-CLOCK TIME" above. This is a hang detector.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      # The gate tool's own failure path, run FIRST and separately from any
      # publish. A checker that has quietly stopped finding anything is still
      # green on every PR, and the only defence is testing the failure path on
      # every run — the same argument as docs.yml's `selftest` job (#509). These
      # are synthetic fixtures where a hit is guaranteed (planted extra id,
      # planted extra occurrence, planted first-party site, missing sentinel,
      # truncated log, absent log), so a matcher that matches nothing cannot
      # pass them. No publish, no network, ~1s.
      - name: Self-test the gate tool (synthetic, guaranteed-hit fixtures)
        run: python3 tools/aot-publish-gate.py --selftest

      - name: Publish Harbor.App.Cli (NativeAOT, linux-x64, full tree)
        id: publish
        # continue-on-error IS the design, not a fudge: the publish is expected
        # to fail today (see the job header), and the gate step below decides
        # whether it failed the way the committed record says it does. What this
        # must never become is a quiet failure — the marker written at the end of
        # this step is what the gate reads, and a step that dies before writing
        # it leaves the gate with no evidence and exit 2.
        continue-on-error: true
        env:
          RID: linux-x64
          RECIPE: fulltree
        run: |
          # `set +e` is load-bearing, and it has to be EXPLICIT. GitHub runs
          # `run:` blocks as `bash -e {0}`, so errexit is already on when this
          # script starts, and `set -uo pipefail` only ADDS -u and pipefail — it
          # does not turn -e off. With errexit on, a failing
          # `dotnet publish | tee` aborts the script AT the pipeline, so
          # PIPESTATUS is never read and the outcome marker is never written.
          # That is exactly what happened twice: the smoke step reported "no
          # publish marker in publish/aot-publish.log" on runs where the publish
          # had in fact executed and failed as recorded. A gate whose evidence
          # line is unreachable on failure is a gate that only ever has evidence
          # when things are fine. Every non-zero condition below is therefore
          # checked explicitly.
          set +e
          set -uo pipefail
          # AOT needs the native toolchain. ubuntu-latest already ships most of
          # it, but naming it explicitly is what makes this step portable to a
          # runner image that does not. `objcopy` is NOT a package: it lives in
          # binutils, and the first version of this step asked apt for
          # `objcopy` and died with "E: Unable to locate package objcopy"
          # before `dotnet publish` ever ran.
          sudo apt-get update -qq || { echo "::error::apt-get update failed"; exit 1; }
          sudo apt-get install -y -qq clang lld binutils zlib1g-dev \
            || { echo "::error::installing the AOT toolchain failed"; exit 1; }
          mkdir -p publish
          # --self-contained true is passed EXPLICITLY even though
          # Harbor.App.Cli.csproj now sets it in the AOT block, so this job does
          # not silently depend on that file: Directory.Build.props sets
          # SelfContained=false repo-wide and NETSDK1102 is the first thing a
          # reshaped AOT block would hit.
          # The log is the gate's evidence, so it is captured in full rather
          # than relying on the step's own console scrollback.
          dotnet publish apps/Harbor.App.Cli \
            -c Release -r "$RID" \
            --self-contained true \
            -p:HarborWithAot=true \
            -p:ContinuousIntegrationBuild=true \
            -o publish/aot 2>&1 | tee publish/aot-publish.log
          status=${PIPESTATUS[0]}
          # The marker names the OUTCOME, not just success. It is written
          # whatever the publish did, because "the publish failed" is a fact this
          # gate has to be able to read; what it must never do is read nothing.
          # `recipe=` is in it because the two AOT recipes build different
          # programs, so an inventory from one must not be accepted as evidence
          # about the other.
          if [ "$status" -eq 0 ]; then
            outcome=published
          else
            outcome=failed
          fi
          echo "HARBOR_AOT_PUBLISH_DONE rid=$RID recipe=$RECIPE status=$outcome exit=$status" \
            >> publish/aot-publish.log
          exit "$status"

      # The half that would prove EXECUTABILITY, and which today asserts the
      # opposite fact — honestly, and with both branches reachable.
      #
      # A failing ILC publish emits no binary. That was measured, not assumed:
      # an earlier run of this job reached `no executable at
      # publish/aot/Harbor.App.Cli`. So while the recorded state is "the publish
      # fails", there is no artifact to run, and a step that demanded one would be
      # permanently red for a reason that is the record being true.
      #
      # What this step does instead is check the record's claim in BOTH
      # directions, which keeps it a real assertion rather than a skip:
      #
      #   publish reported `failed`  -> an artifact must NOT exist. If one does,
      #       the world moved and this step says so.
      #   publish reported `published` -> the artifact MUST exist and MUST run
      #       --version / --help / --providers on content.
      #
      # The transition is recorded by the NEXT step, whose --expect-status is
      # `published` since #1055s3 moved the plugin compile pipeline out of the
      # CLI process: the publish completes, the record says so, and this branch
      # is the live one. If the publish starts failing again, that step goes
      # red and the record is updated. Nothing here has to be remembered or
      # noticed for that to happen.
      - name: Smoke — the published AOT artifact
        run: |
          set -euo pipefail
          bin=publish/aot/Harbor.App.Cli
          log=publish/aot-publish.log

          # Which branch applies is decided by the publish's own reported outcome,
          # not by a hardcoded expectation in this file.
          outcome=$(sed -n 's/.*HARBOR_AOT_PUBLISH_DONE .*status=\([a-z]*\).*/\1/p' "$log" | tail -1)
          test -n "$outcome" || { echo "::error::no publish marker in $log — nothing to smoke"; exit 1; }

          if [ "$outcome" != "published" ]; then
            echo "smoke: publish reported status=$outcome, so no artifact is expected."
            if [ -e "$bin" ]; then
              echo "::error::$bin exists even though the publish reported $outcome — the AOT state moved; the comparison step will say so, and the record needs updating"
              exit 1
            fi
            echo "smoke: confirmed no artifact at $bin, which is what a failed ILC publish produces."
            echo "smoke: the 'run the published binary' half of this gate is therefore INACTIVE while the publish fails. It activates on its own the moment the publish succeeds."
            exit 0
          fi

          echo "smoke: publish reported status=published — the artifact must exist and must run."
          test -x "$bin" || { echo "::error::publish reported success but there is no executable at $bin"; exit 1; }

          v=$("$bin" --version)
          echo "version: $v"
          test -n "$v" || { echo "::error::--version printed nothing"; exit 1; }

          "$bin" --help > publish/help.txt 2>&1
          test -s publish/help.txt || { echo "::error::--help printed nothing"; exit 1; }
          grep -q -i -e 'ask' -e 'usage' publish/help.txt \
            || { echo "::error::--help output has no usage section"; cat publish/help.txt; exit 1; }

          "$bin" --providers > publish/providers.txt 2>&1
          test -s publish/providers.txt || { echo "::error::--providers printed nothing"; exit 1; }
          # Asserted on CONTENT, not on "some output exists", because
          # ProviderVerbs.RunListProvidersAsync always returns 0: an AOT binary
          # that registered nothing at all would exit 0 and print an empty list.
          #
          # Three ids: the native baseline plus two JSON-catalogue entries. The
          # native Anthropic/OpenAI factories are deliberately NOT in this set:
          # they sit behind HARBOR_WITH_ALL_PROVIDERS, whose `true` default
          # lives in Harbor.App.Cli.csproj as a project-level property and
          # therefore never reaches Harbor.Hosting (only global -p properties
          # flow to ProjectReferences), so no `dotnet`-built CLI — JIT or AOT —
          # registers them. JsonProviderDiscovery skips their JSON files for
          # the same reason (they are served by the factories). Only a NUKE
          # build, which sets the flag globally, carries them. First measured
          # on the #1055 slice-3 branch (11 ids, no anthropic/openai); asserting
          # them here would gate on a build this recipe cannot produce.
          # Under the stripped recipe even ollama would legitimately disappear —
          # the recipe note in the job header says which recipe this is and why.
          #
          # What `kilocode` actually proves (stated precisely, because the obvious
          # explanation is wrong): the providers are NOT read from embedded
          # resources. JsonProviderDiscovery.LoadEmbeddedProviders() enumerates
          # typeof(JsonProviderDiscovery).Assembly — Harbor.Hosting — but
          # EmbedProviders is set on Harbor.Application and App.Cli, so that
          # enumeration is empty and the catalogue reaches the registry through
          # ProviderPresetCatalog.FindProvidersDirectories(), walking up to 8
          # ancestors of AppContext.BaseDirectory. From publish/aot/ that lands on
          # the repo's providers/*.json. So this asserts the AOT binary can read,
          # parse and register the bundled JSON catalogue — the System.Text.Json
          # and provider-construction paths both work under NativeAOT. The dead
          # embedded path is a separate pre-existing finding, recorded in
          # docs/AOT_PUBLISH.md, not fixed here.
          for p in ollama kilocode openrouter; do
            grep -q -i "$p" publish/providers.txt \
              || { echo "::error::--providers is missing '$p' — the provider catalogue did not survive the publish"; cat publish/providers.txt; exit 1; }
          done
          echo "smoke: version/help/providers all ran on the published AOT binary"
          echo "smoke: version/help/providers all ran on the published AOT binary"

      - name: Compare the publish against the committed record
        run: |
          python3 tools/aot-publish-gate.py \
            --log publish/aot-publish.log \
            --baseline .github/aot-warning-baseline.txt \
            --expect-rid linux-x64 \
            --expect-recipe fulltree \
            --expect-status published

      - name: Upload AOT publish log and inventory report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aot-publish-log
          path: |
            publish/aot-publish.log
            publish/help.txt
            publish/providers.txt
          retention-days: 14
          # warn, not error: help.txt and providers.txt are only produced by the
          # LIVE branch of the smoke step, and today the publish fails so they do
          # not exist. if-no-files-found: error was already earned once — it is
          # what caught the first version of this job dying in apt-get before
          # writing a log at all — but applying it to those two files would make
          # it fire on a correct run. The publish log itself is the evidence and
          # it must exist.
          if-no-files-found: warn

  publish:
    needs: [changes, build]
    if: (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Publish Harbor.App.Cli (self-contained, single-file, linux-x64)
        run: >-
          dotnet publish apps/Harbor.App.Cli -c Release -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:ContinuousIntegrationBuild=true
          -o publish/linux-x64

      - name: Smoke — published binary runs
        run: ./publish/linux-x64/Harbor.App.Cli --version

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: harbor-cli-linux-x64
          path: publish/linux-x64/
          retention-days: 14

  perf-gate:
    needs: [changes, build]
    if: (needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HARBOR_PERF_REPORT: ${{ github.workspace }}/renderer-perf-report.txt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"
      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: solution-binaries
      - name: Run renderer performance gate
        run: |
          sudo systemctl stop snapd.service snapd.socket || true
          taskset -c 1 dotnet exec tests/Harbor.Tui.PerfTests/bin/Release/net10.0/Harbor.Tui.PerfTests.dll --output Detailed
      - name: Enforce relative 5% regression rule (strict mode only)
        if: env.HARBOR_PERF_BASELINE_STRICT == '1'
        run: |
          python3 - <<'PY'
          import os, sys
          baseline = {}
          for line in open("tests/Harbor.Tui.PerfTests/baseline.csv"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              b, _, eps, p99, mem = line.split(";")
              baseline[b] = (float(eps), float(p99), float(mem))
          failed = False
          for line in open(os.environ["HARBOR_PERF_REPORT"]):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              b, _, eps, p99, mem = line.split(";")
              eps, p99, mem = float(eps), float(p99), float(mem)
              b0 = baseline.get(b)
              if not b0:
                  print(f"{b}: no baseline entry — add one to baseline.csv"); failed = True; continue
              if eps < b0[0] * 0.95:
                  print(f"{b}: throughput regression {eps:F0} < 95% of {b0[0]:F0}"); failed = True
              if p99 > b0[1] * 1.05:
                  print(f"{b}: p99 regression {p99:F3} > 105% of {b0[1]:F3}"); failed = True
              if mem > b0[2] * 1.05:
                  print(f"{b}: allocation regression {mem:F4} > 105% of {b0[2]:F4}"); failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-perf-report
          path: renderer-perf-report.txt
          if-no-files-found: warn
          retention-days: 7
