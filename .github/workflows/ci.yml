# Harbor CI — build + test the whole solution.
#
# Structure:
#   build    — Release build of Harbor.slnx (zero-warning gate, documentation
#              warnings included since #701, + the embedded
#              HarborArchitectureGate) and a CLI smoke run.
#   test     — shard matrix: explicit test-project lists per shard, run
#              SEQUENTIALLY inside each shard (cross-module parallelism
#              amplifies the known Avalonia-headless and perf-ceiling flakes
#              that reproduce under a solution-wide `dotnet test`).
#   coverage — report-only coverage collection (issue #99): core + platform
#              suites under the MTP CodeCoverage extension, per-project line
#              rates in the job summary + raw cobertura.xml artifacts.
#              NEVER gates (no thresholds, exit 0 by design).
#   aot-publish — NativeAOT publish of Harbor.App.Cli (issue #413): the tree is
#              published with HarborWithAot=true, the trim/AOT diagnostics are
#              compared against .github/aot-warning-baseline.txt, and the
#              PUBLISHED BINARY is executed (--version/--help/--providers). The
#              pass criterion is NOT "zero IL2026 warnings" — it is publish
#              green + inventory matches the committed rows + the artifact runs.
#              See docs/AOT_PUBLISH.md.
#   publish  — self-contained single-file Harbor.App.Cli (linux-x64) upload.
#
# The windows/macOS matrix that used to live here as the `test-os` job is now
# its own workflow, `.github/workflows/test-os.yml` (issue #1787). GitHub
# triggers are workflow-level, so a job cannot be moved off `pull_request`
# from inside this file — and the owner's intent is that the OS signal is a
# RELEASE guarantee («релиз — это влитие в мастер и гарантия, что везде это
# работает»), produced on merges into dev/master, on the PR that merges into
# master, on a 2-hourly deduplicated schedule, and on demand — not on every
# pull request into dev.
#
# NOTE on running tests: do NOT use `dotnet test` in this repo. The
# `dotnet test` → Microsoft.Testing.Platform bridge rejects the VSTest-era
# options (`--logger`, `--filter`) our old commands passed: that is the
# platform's *invalid command-line arguments* exit code 5, whereas a run
# that genuinely discovers no tests exits 8. So "exits 5" was never evidence
# of zero discovery (CHANGELOG.md, sprint *ci-cd-maturity*, records that
# deleting one `--logger` turned renderer-perf-gate.yml green).
# `Microsoft.NET.Test.Sdk` is gone from every project (#1893): TUnit
# documents it as stopping test discovery, and the MTP pieces this tree
# needs arrive transitively through TUnit.
# So every job below runs test projects as plain executables:
# `dotnet run --project tests/<Name> -- <mtp-args>`.
# MTP args forward after `--`: --minimum-expected-tests N (zero-test guard),
# --treenode-filter (TUnit selection), --output Detailed (per-test console).
#
# On test measurements (issue #618): neither the console log nor `--output
# Detailed` is where a test's `Console.WriteLine` belongs — the log prints
# per-assembly counts and nothing per-test, and Detailed would bury the one
# `failed <TestName>` line under a line per green test. Instead the test job
# keeps `--report-trx` (TUnit already files each test's stdout under that test)
# and hands the TRX to `tools/test-measurements.py`, which renders a
# `Class.Method -> measurement` table into the job summary. Read-only, never a
# gate: the script exits 0 on a missing or corrupt TRX set. The OS matrix in
# `test-os.yml` does the same for the platform-sensitive numbers.
name: ci

on:
  push:
    branches: [dev, master]
    paths-ignore: ['**.md', 'docs/**', 'evals/tasks/**', 'assets/demo/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'evals/tasks/**', 'assets/demo/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NUGET_CERT_REVOCATION_MODE: offline
  MSBuildEnableWorkloadResolver: false
  DOTNET_gcServer: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      ui: ${{ steps.filter.outputs.ui }}
      packages: ${{ steps.filter.outputs.packages }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      # No `submodules: recursive`: the vendored ConsoleEx submodule left the
      # product (ADR-019); nothing in this workflow builds contrib/external/.
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - 'apps/**'
              - 'contrib/**'
              - 'Directory.*'
              - 'Harbor.slnx'
              - 'global.json'
              - '.github/workflows/ci.yml'
              # The OS matrix is its own workflow since #1787
              # (.github/workflows/test-os.yml). Same #618 argument as the
              # line above, one file over: editing the workflow that runs the
              # OS suites must set dotnet=true, or the edit lands unvalidated.
              - '.github/workflows/test-os.yml'
              # Runs INSIDE the test job below. Without this line an
              # edit to the script alone would set dotnet=false, skip the very
              # job that executes it, and land unvalidated (issue #618).
              - 'tools/test-measurements.py'
              # The pack-validation gate's instrument (#429). Same #618
              # argument: editing the validator must run the build job that
              # executes it, or the edit lands unvalidated.
              - 'tools/pack-validate.py'
              # The gate that keeps the build job's per-consumer artifacts in
              # step with the test job's shard lists. Same #618 argument:
              # editing it must run the build job that executes it.
              - 'tools/ci-shard-slices.py'
              # The build-output cache's mtime normalisation (issue #1927).
              # It runs INSIDE the build job, and it decides whether MSBuild
              # may skip a project — so an edit to it must set dotnet=true,
              # or the edit lands unvalidated (issue #618's argument again,
              # with a sharper payload: an edit that makes the tool skip the
              # wrong files builds stale binaries, and a stale build is not
              # a red build).
              - 'tools/normalize-mtimes.py'
              # The instrument that reads the MSBuild performance summary
              # (issue #1919). It runs in its own workflow, on demand, and
              # its own self-test runs in the build job — but editing it
              # must still run the build job, so the tree it parses is
              # validated by the same commit.
              - 'tools/msbuild-evaluation-cost.py'
              - '.github/workflows/evaluation-cost.yml'
              # The AOT gate's instrument and its committed inventory (#413).
              # The same argument as the line above, one step further: editing
              # the BASELINE is the ordinary way to answer a red AOT job, and
              # if the baseline were not in the filter then the edit that
              # silences the gate would also be the edit that stops the gate
              # from running — unvalidated, which is the #618 defect again with
              # a different payload. Editing the tool has the same problem.
              - 'tools/aot-publish-gate.py'
              - '.github/aot-warning-baseline.txt'
              # The TUnit analyzer gate's instrument (#1836). The same #618
              # argument as the lines above: editing the tool that proves the
              # gate must run the job that executes it, or the edit lands
              # unvalidated. The canary's own source is under tests/, which the
              # dotnet filter already covers.
              - 'tools/check-tunit-analyzer-gate.py'
              # NUKE build code, the installer and the native-packaging
              # scripts. Same #618 argument: without these lines an edit to
              # the build tool would set dotnet=false, skip the build job
              # that compiles it (via ./build.sh), and land unvalidated.
              - 'build/**'
              - 'dist/**'
              - 'packaging/**'
              # Harbor.Evals is a real csproj inside Harbor.slnx — the `build`
              # job compiles it like everything else. It lives under tools/,
              # so without this line a code change to the evals runner would
              # set dotnet=false, skip the very build/test jobs that compile
              # the tree it ships in, and land unvalidated — issue #618's
              # defect with the same payload again (#1565 batch-4 hit this).
              - 'tools/Harbor.Evals/**'
            # #1853. The unused-reference gate (#1853) and its baseline. The
            # same #618 argument as the lines above: the ordinary way to
            # answer a red unused-reference job is to edit the BASELINE, and
            # if the baseline were not in this filter then the edit that
            # silences the gate would also be the edit that stops the gate
            # from running — unvalidated. Editing the tool has the same
            # problem.
              - 'tools/check-reference-trimmer.py'
              - 'tools/reference-trimmer-baseline.txt'
              # The skipped-test report (issue #1795) — same #618 argument:
              # an edit to the script alone must not skip the job that
              # executes it.
              - 'tools/test-skips.py'
            # #1882. The package set of the test and sample projects can only
            # change through one of these: a project's own .csproj, the props
            # that inject a PackageReference into every project, the version
            # catalogue, the banned-symbols input the gate reads its ban set
            # from, or the gate and its allow-list. The filter is the gate's
            # own trigger, so the job that enforces it runs exactly when the
            # thing it enforces could have moved - and, by the same argument
            # the `dotnet` filter makes above for the other instruments,
            # editing the gate itself runs the gate.
            packages:
              - 'tests/**/*.csproj'
              - 'samples/**/*.csproj'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'BannedSymbols.txt'
              - 'tools/check-test-packages.py'
              - 'tools/test-package-exceptions.txt'
            ui:
              - 'src/Harbor.Tui*/**'
              - 'src/Harbor.Ui.Framework*/**'
              - 'src/Harbor.Terminal.*/**'
              - 'src/Harbor.DesignSystem/**'
              - 'src/Harbor.App.Avalonia/**'
              - 'apps/Harbor.App.Avalonia/**'
              - 'tests/Harbor.Tui*/**'
              - 'tests/Harbor.Ui.Framework*/**'
              - 'tests/Harbor.Terminal.*/**'
              - 'tests/Harbor.DesignSystem.Tests/**'
              - 'tests/Harbor.App.Avalonia.Tests/**'
            # The dependency graph, and nothing else. `dotnet package list
            # --vulnerable` reads the RESTORED graph, so its answer can only
            # change when the graph changes: a version bump in
            # Directory.Packages.props (central package management) or a
            # PackageReference added/removed/updated in Directory.Build.props
            # (the analyzer gate lives there). A code change cannot move a
            # single advisory, so on every PR that touches neither file the
            # 42-second scan is skipped instead of re-reporting the same
            # answer (measured on run 39389070999: 42 s of which 3.6 s is the
            # restore and 36.5 s is the NuGet advisory API round trip).
            deps:
              - 'Directory.Packages.props'
              - 'Directory.Build.props'

  # #428 / #1845. The public-API freeze of the two frozen assemblies.
  #
  # The freeze itself is a COMPILE-time gate now, not a job:
  # Microsoft.CodeAnalysis.PublicApiAnalyzers is referenced by
  # Harbor.Abstractions and Harbor.Abstractions.Contracts and by nothing
  # else, so RS0016 (a public symbol that is not in the declared API) and
  # RS0017 (a declared API symbol that is not in the code) fail the build
  # of the `build` job above. No runner, no python, no second copy of the
  # surface: the compiler already has the symbol table.
  #
  # What the analyzer cannot see is WHICH COMMIT carried a change, so the
  # re-signing half of the freeze lives here: a commit that edits the
  # frozen baseline must edit the assembly's sources with it, and a commit
  # that changes a public declaration must re-sign the baseline with it.
  # tools/check-public-api-resign.py reads the PR's commit range and says
  # so. Its --self-test is the non-vacuity proof of the python half, and it
  # runs in the docs.yml `selftest` job.
  #
  # The second step is the non-vacuity proof of the COMPILE-time half, and
  # it is here because it needs an SDK: a throwaway project with one public
  # member and an empty baseline must FAIL the build with `error RS0016`,
  # must PASS once the analyzer's own requested row is added, and must FAIL
  # again with `error RS0017` when the member is deleted while the baseline
  # still names it. A gate that stopped firing is indistinguishable from a
  # surface nobody changed, and this job is what tells the two apart.
  public-api:
    name: public-api freeze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # The floors are ratchets on the ROWS of the frozen baselines: 1896 for
      # the contract assembly, 1269 for the facade. They are set AT the
      # measured values, not below — a floor with slack cannot tell "the
      # baseline was truncated" from "the surface got smaller". The numbers
      # are not comparable with the python gate's (491 / 413): the analyzer
      # counts implicit constructors, property accessors and the members the
      # compiler synthesises for a record, none of which have a `public`
      # keyword in the source for a line scan to find.
      - name: "Re-signing gate: every change to the frozen surface is re-signed with it"
        run: |
          set -eu
          base="$(git merge-base HEAD origin/dev 2>/dev/null || true)"
          if [ -z "$base" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$base" ]; then
            echo "::error::cannot resolve the base commit of this range" >&2
            exit 1
          fi
          python3 tools/check-public-api-resign.py --base "$base" \
            --min-rows src/Harbor.Abstractions.Contracts=1896 \
            --min-rows src/Harbor.Abstractions=1269

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: "Non-vacuity: an unreviewed public member fails the build, a re-signed one passes"
        run: bash tools/public-api-nonvacuity.sh

  # #1882. Package-set gate for the test and sample projects.
  #
  # Nothing in the repository gated the package set of a test project.
  # Measured on dev@69fb5c80, before this gate existed:
  #
  #   BannedSymbols.txt (`N:Newtonsoft.Json`)  an RS0030 analyzer input. It
  #                                           covers SOURCE CODE only, and
  #                                           RS0030 is switched off for
  #                                           tests/ and samples/ in
  #                                           Directory.Build.props, so it
  #                                           does not reach the test tree
  #                                           as a diagnostic either.
  #   tools/check-abstractions-contract.py     four src/ projects.
  #   tools/aot-publish-gate.py                src/ + apps/.
  #   AGENTS.md §"What NOT to do" #2           prose.
  #
  # So a TRANSITIVE dependency could put a banned package into any test
  # project's bin/ and nothing would notice. The concrete case is not
  # hypothetical: TngTech.ArchUnitNET 0.13.4 (proposed in #1841) declares
  # Newtonsoft.Json 13.0.4 for every target framework it supports.
  #
  # The gate reads the resolved package graph NuGet writes during RESTORE
  # (obj/project.assets.json) plus each .csproj: which packages a test
  # project may reference, directly or transitively, and whether any of them
  # is banned. No build and no network - the restore below is the only
  # reason this job needs the SDK, the gate itself is stdlib python.
  #
  # The floors are a ratchet: 49 projects in scope, 50 declared references
  # (61 before #1893 removed `Microsoft.NET.Test.Sdk` from eleven of them) and
  # ~1950 resolved package entries on the tree this landed on. A scan
  # that silently narrowed goes red instead of green, and a project whose
  # resolved graph is missing is reported rather than passed.
  #
  # The non-vacuity proof is the gate's own --self-test (a banned package
  # declared by a .csproj, one that arrives transitively, and one sitting
  # in an output directory each fail, naming it), run as the first step.
  test-packages:
    name: test/sample package set
    needs: changes
    if: (needs.changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # No `submodules: recursive`: the vendored ConsoleEx submodule left the
      # product (ADR-019); nothing in this workflow builds contrib/external/.
      - uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"
      - name: Restore the solution (the resolved package graph, no build)
        run: |
          dotnet restore Harbor.slnx
          # The one scope project outside Harbor.slnx. Harbor.Samples.slnx is
          # NOT restored as a whole: it also lists the contrib/ sample apps,
          # which need workloads this job does not have.
          dotnet restore samples/designsystem-consumer/Harbor.Samples.DesignSystemConsumer.csproj
          # The TUnit analyzer canary (#1836). It is a scope project — it
          # lives under tests/ and is tracked — so the package gate below has
          # to see its resolved graph like every other one. It is not a row
          # of Harbor.slnx because its planted offender is an ERROR by
          # design: the build of that project is expected to fail, and one
          # job (the build job) builds it on purpose to prove the gate.
          dotnet restore tests/TUnitAnalyzerCanary/TUnitAnalyzerCanary.csproj
      - name: Package-set gate fails on an injected banned package
        run: python3 tools/check-test-packages.py --self-test
      - name: Check the resolved package set of every test and sample project
        run: python3 tools/check-test-packages.py --min-projects 43 --min-declared 50 --min-packages 1400

  # #1893. The VSTest test host must not come back.
  #
  # `Microsoft.NET.Test.Sdk` was declared in 16 .csproj files (11 under
  # tests/, 5 under contrib/tests/) and pinned once in
  # Directory.Packages.props. TUnit's installation docs name the package as
  # the thing that stops test discovery:
  #
  #   "This should NOT be used with TUnit. It'll stop test discovery from
  #    working properly." — https://tunit.dev/docs/getting-started/installation
  #
  # The package brought the VSTest host and Microsoft.CodeCoverage into the
  # output of every test project, and this repository uses none of it: it
  # runs on Microsoft.Testing.Platform (global.json selects the MTP runner)
  # and every job executes a test project as a plain executable. The MTP
  # pieces the tree actually needs — Microsoft.Testing.Platform.MSBuild,
  # Microsoft.Testing.Extensions.CodeCoverage, Microsoft.Testing.Extensions.
  # TrxReport — arrive TRANSITIVELY through TUnit, so the removal needed no
  # replacement package.
  #
  # Nothing in the tree would have complained if the package came back: the
  # build stays green and the tests still run. This job is what makes the
  # removal irreversible.
  #
  # It ALWAYS runs (no `needs:`), because a gate that only runs when the
  # paths it watches change is a gate that a rename can switch off. Stdlib
  # python only, no dotnet, no restore — a few seconds.
  test-sdk-absent:
    name: no VSTest SDK in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # No `submodules: recursive`: the vendored ConsoleEx submodule left the
      # product (ADR-019), and the gate excludes contrib/external/ anyway.
      - uses: actions/checkout@v7
      - name: No-VSTest-SDK gate fails on an injected reference
        run: python3 tools/check-no-test-sdk.py --self-test
      - name: Check that no project file declares Microsoft.NET.Test.Sdk
        run: python3 tools/check-no-test-sdk.py --min-files 150

  # #1853. Unused-reference detection over the whole solution.
  #
  # ReferenceTrimmer 3.5.13 (MIT) is a build-time analyzer: it asks Roslyn
  # which assemblies the compiled code actually uses and reports the declared
  # references that none of them reach (RT0001 bare reference, RT0002 project
  # reference, RT0003 package reference).
  #
  # It is a separate job and not a build step, for three reasons.
  #
  #   COST. GetUsedAssemblyReferences is a real semantic analysis of every
  #   compilation. Running it on every PR would tax every PR for a signal
  #   that changes only when a dependency changes.
  #
  #   BLAST RADIUS. The findings are warnings, and this repository sets
  #   TreatWarningsAsErrors=true, so the package would break the build the
  #   day it was added. The job turns warnings-as-errors off FOR ITSELF and
  #   compares the findings with a baseline instead. The property is a global
  #   property, so it overrides the props files that set it.
  #
  #   SCOPE. The tool sees SOURCE. It cannot see reflection, DI registration
  #   by convention, or a plugin loaded by name. This repository forbids
  #   dynamic code outside src/Harbor.Plugins.* (#626), so the blind spot is
  #   small — but a candidate still needs a human read before anything is
  #   removed, and the baseline is where that read is recorded.
  #
  # Two properties make the run measure the whole tree rather than a part of
  # it:
  #
  #   GenerateDocumentationFile=true — tests/Directory.Build.props turns the
  #   doc file off, and the tool says itself (RT0000) that without one its
  #   "used references" answer is less accurate. A weaker instrument that is
  #   allowed to under-report is not a measurement, so the job turns the doc
  #   file on everywhere; the gate treats an RT0000 as a failure.
  #
  #   HarborArchGate=false — the architecture suite that runs inside the
  #   Release build is the `core` test shard's job on the PR path, and running
  #   it here as well would compile the same assembly twice for one answer.
  #
  # The raw log is uploaded as an artifact so that a reader can check the
  # tool's answer without re-running it.
  reference-trimmer:
    name: unused references (ReferenceTrimmer)
    needs: changes
    if: (needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # No `submodules: recursive`: the vendored ConsoleEx submodule left the
      # product (ADR-019); nothing in this workflow builds contrib/external/.
      - uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"
          cache: true
          cache-dependency-path: "Directory.Packages.props"
      # The restore has to run with the property too: the package has to be in
      # the assets file before the compiler can load the analyzer, and a
      # restore without the property would write an assets file the build
      # then does not agree with.
      - name: Restore the solution with the ReferenceTrimmer analyzer
        run: dotnet restore Harbor.slnx -p:HarborReferenceTrimmer=true
      - name: Build the solution and collect the analyzer's findings
        run: |
          dotnet build Harbor.slnx -c Release --no-restore \
            -p:HarborReferenceTrimmer=true \
            -p:TreatWarningsAsErrors=false \
            -p:GenerateDocumentationFile=true \
            -p:HarborArchGate=false \
            -p:MaxCpuCount=0 \
            -flp:"logfile=rt-warnings.log;warningsonly" \
            -flp2:"logfile=rt-errors.log;errorsonly"
      # The coverage list is the answer to "how many projects did the analyzer
      # actually run in". The analyzer writes its declared-reference table
      # into each project's intermediate directory, so the table's own file
      # names are the evidence — and the gate checks the count against a
      # floor, because a scan that silently narrowed must go red, not quiet.
      - name: Coverage — the projects the analyzer actually ran in
        run: |
          find . -name '_ReferenceTrimmer_DeclaredReferences.tsv' \
                   -not -path './.git/*' -not -path './external/*' \
            | sed 's|/obj/.*||' | sed 's|^\./||' | sort -u > rt-coverage.txt
          echo "the analyzer ran in $(wc -l < rt-coverage.txt) project(s)"
      - name: Upload the findings artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-trimmer-findings
          path: |
            rt-warnings.log
            rt-coverage.txt
          if-no-files-found: warn
          retention-days: 7
      - name: The gate is red when the tool is not allowed to answer
        if: always()
        run: python3 tools/check-reference-trimmer.py --self-test
      - name: Gate — no unused reference outside the baseline
        if: always()
        run: python3 tools/check-reference-trimmer.py --findings rt-warnings.log --coverage rt-coverage.txt --min-projects 100

  build:
    needs: changes
    if: (needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    # Pinned, not `ubuntu-latest`. The label moves: ubuntu-latest switches to
    # Ubuntu 26.04 in November 2026 (runner-images ubuntu24/20261018.339,
    # 2026-10-19), and every timing number this repo records — the 549 s
    # build job, the 62.7 s architecture suite, the 42 s advisory scan — was
    # taken on 24.04. A label that moves turns a measured baseline into a
    # guess. This job is x64 and depends on nothing about the image, so the
    # pin is free. The OTHER jobs in this file are still on `ubuntu-latest`:
    # they belong to the job-graph work, and moving them is a one-line change
    # each (see the PR body).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The build-output cache (#1927) is WRITTEN by this job on a push to
      # dev/master and on a manual dispatch. The cache service is reached
      # through the runner's own runtime token, but the job is granted the
      # narrow scope that covers cache management so that the grant and the
      # capability agree.
      actions: write
    env:
      # ── The architecture gate, off the PR path only ──────────────────────
      #
      # HarborArchitectureGate (Directory.Build.props) runs the WHOLE
      # Harbor.Architecture.Tests assembly with `dotnet exec` after
      # Harbor.Architecture.Tests builds: 68.0 s of work measured on run
      # 39389070999 (the [arch-gate] message at +309.70 s, the suite's own
      # summary at +377.71 s, the compile's last project at +387.83 s).
      #
      # It is a good gate and it stays a gate: on a push to dev/master (and
      # on every non-pull_request event, which includes the nightly lane and
      # workflow_dispatch) a layering regression still fails the BUILD
      # itself. What changes is the PR lane, where the same suite runs
      # THREE times for one result: once as this gate, once in the `core`
      # test shard (65.8 s) and once in `coverage`.
      #
      # The ASSEMBLY is still built here — the `core` shard needs the DLL —
      # only the EXECUTION moves to the shard. The property is read by
      # MSBuild, and an environment variable of the same name IS an MSBuild
      # property (Directory.Build.props only defaults it when it is empty),
      # so it reaches the `dotnet build` that NUKE runs without touching
      # build/_build. To put the gate back on the PR path, delete this env
      # block: the value is the only thing that turns it off.
      HarborArchGate: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
      # The NuGet global-packages folder is PINNED (#1927). The restored
      # obj/*.csproj.nuget.g.props and obj/project.assets.json carry
      # ABSOLUTE paths into it, so a cached build is only valid for the
      # folder it was built against. The value IS the runner default
      # (/home/runner/.nuget/packages), written down explicitly so that the
      # cache key and the restore agree by construction — and it is part of
      # the key, so a runner that moves the folder gets a cold build
      # instead of a wrong one.
      NUGET_PACKAGES: /home/runner/.nuget/packages
    steps:
      # No `submodules: recursive`: the vendored ConsoleEx submodule left the
      # product (ADR-019); nothing in this workflow builds contrib/external/.
      - uses: actions/checkout@v7
        with:
          # The FULL history, not the default depth-1 (#1927). The cache
          # entry is keyed by the commit its outputs were built from, and
          # the mtime normalisation below needs that commit's TREE to know
          # which files differ from the cached base — a depth-1 clone does
          # not have it. This repository's whole history is 25 MiB, and the
          # cost is paid by ONE job (this one), not by the shards.
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          # Pinned to the exact SDK, not "10.0.x". global.json asks for
          # 10.0.402 with rollForward=latestPatch, which forbids the SDK
          # from leaving the 10.0.4xx feature band — so a job that installs
          # "10.0.x" would break the moment the band moves (10.0.5xx) and
          # global.json cannot resolve it. Asking for the exact version
          # makes this job's SDK independent of what the runner image
          # happens to ship. 10.0.402 is the SDK the runners already use
          # (dotnet/release-metadata/10.0: latest-sdk 10.0.402, released
          # 2026-10-13).
          dotnet-version: "10.0.402"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      # ── The build-output cache (issue #1927) ──────────────────────────────
      #
      # MSBuild is ALREADY incremental: CoreCompile skips a project whose
      # output is newer than its inputs. CI is cold only because obj/ and
      # bin/ are absent, so every pull request recompiles all 104 projects.
      # These three steps restore those two directories and let MSBuild
      # decide the fine-grained work; the rest of the build is unchanged.
      #
      # The key is deliberately COARSE — it names the TOOLCHAIN, not the
      # source tree:
      #
      #   msbuild-v1-<os>-<arch>-sdk<sdk>-nuget<packages path>-<props hash>-<sha>
      #
      #   * <os>-<arch>      the runner family (this job is pinned to
      #                      ubuntu-24.04: a label that moves would move the
      #                      compiler with it)
      #   * sdk<sdk>         the RESOLVED SDK version, because a different
      #                      compiler writes different bytes into the same obj/
      #   * nuget<packages>  the NuGet global-packages folder, because the
      #                      restored obj/*.nuget.g.props and
      #                      obj/project.assets.json carry absolute paths
      #                      into it (see NUGET_PACKAGES above)
      #   * <props hash>     Directory.Packages.props, Directory.Build.props,
      #                      Directory.Build.targets and global.json — the
      #                      inputs that move the package graph, the
      #                      compiler flags and the SDK
      #   * <sha>            the commit the outputs are built from. It rolls
      #                      the entry forward, and it is also how the mtime
      #                      step below learns which commit the restored
      #                      outputs belong to.
      #
      # restore-keys holds the same prefix WITHOUT the sha, so a run that
      # finds no entry for its own commit restores the most recent entry
      # built from the same toolchain — the base branch's cache.
      - name: Compute the build-output cache key
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          props="${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', 'global.json') }}"
          # The RESOLVED version, not the requested one: global.json decides
          # which SDK actually runs, and the outputs are that SDK's bytes.
          sdk="$(dotnet --version | tail -n 1 | tr -d '[:space:]')"
          prefix="msbuild-v1-${{ runner.os }}-${{ runner.arch }}-sdk${sdk}-nuget${NUGET_PACKAGES}-${props}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "cache prefix: ${prefix}"
          echo "cache key:    ${prefix}-${{ github.sha }}"

      - name: Restore the build outputs (obj/ + bin/)
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            **/obj
            **/bin
            # The runtime assets (the native libraries of every RID) and the
            # satellite assemblies are COPIES of what the NuGet folder already
            # holds: nothing in MSBuild's up-to-date check reads them, and the
            # build re-copies them from the packages. They are the bulk of the
            # payload, and the repository's 10 GB cache budget cannot hold
            # them — the first version of this cache (1,921 MiB per entry)
            # was evicted within minutes of being written, because the NuGet
            # caches already fill the budget. The debug symbols go for the
            # same reason: the artifacts do not carry them either.
            !**/runtimes/**
            !**/*.resources.dll
            !**/*.pdb
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-

      # The checkout gave every source file the CURRENT clock, so every
      # restored output looks stale and MSBuild would rebuild the whole
      # solution — the trap #1927 names. This step puts the mtimes back
      # where the truth is:
      #
      #   * a file that DIFFERS from the commit the cache was built from
      #     gets "now"      -> MSBuild rebuilds it, and through the project
      #                         graph its dependents;
      #   * a file that is IDENTICAL to it gets that commit's time, which
      #     is older than the restored outputs -> MSBuild skips it.
      #
      # The base commit is the last field of the cache key that MATCHED
      # (the key ends in the commit the outputs were built from).
      - name: Normalise the source mtimes (so MSBuild can skip the unchanged)
        if: steps.cache-restore.outputs.cache-matched-key != ''
        shell: bash
        run: |
          set -uo pipefail
          key="${{ steps.cache-restore.outputs.cache-matched-key }}"
          base="${key##*-}"
          echo "restored cache entry: ${key} (built from ${base})"
          rc=0
          python3 tools/normalize-mtimes.py --repo "$GITHUB_WORKSPACE" --base "$base" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::the cached base ${base} could not be resolved, so the changed set is unknown: the restored outputs cannot be told apart from stale ones. They are discarded and the tree is rebuilt from scratch."
            find . -type d \( -name obj -o -name bin \) -prune -exec rm -rf {} +
            exit 0
          fi
          exit "$rc"

      # Release build == zero-warning gate. Building Harbor.Architecture.Tests
      # also re-runs the 47-rule architecture gate embedded in
      # Directory.Build.props (HarborArchGate) — any layering regression
      # fails the build itself.
      #
      # On the PR path that EXECUTION is switched off by the job-level
      # HarborArchGate env var above (the suite still runs in the `core`
      # shard); on a push to dev/master the gate runs exactly as before.
      # The suite is still COMPILED here — the shard needs the DLL.
      #
      # #701 — the master/dev fork is GONE, and the reason it existed was not
      # the reason it looks like it existed. It was added in 40fef5b3 with the
      # justification "250 legacy S*** warnings still triaged", pointing at
      # Directory.Build.props NoWarn. Neither half holds:
      #
      #   * Directory.Build.props has carried TreatWarningsAsErrors=true since
      #     the initial commit. So BOTH arms of the old `if` were already
      #     warnings-as-errors, and the `--warnaserror` on the master arm was a
      #     no-op for every shipped project. The fork was never lenient about
      #     warnings; it only ever suppressed the ones that need a documentation
      #     file, by passing GenerateDocumentationFile=false.
      #   * The NoWarn list it cited is ten codes (CS1591, NU1603, CS1570,
      #     CS1571, CS1574, CS0419, S6444, S4036, S2245, S3267) — ten, not 250,
      #     and not one of them an S*** diagnostic.
      #
      # What the fork actually did: turned off GenerateDocumentationFile, and
      # with it the whole doc-warning family — CS1573 (a <param> missing while
      # its siblings are tagged), CS1572, CS1587, RCS1139. Five CS1573 and one
      # RCS1139 landed on green PRs that way, and CS1573 has a hole shaped like
      # the way parameters are added: tag one new parameter and it fires, remove
      # ALL tags and it never fires again.
      #
      # So this is a deletion, not a new gate: one build line for every ref,
      # documentation on, and the doc rules are errors because
      # Directory.Build.props already says so — the same "strictness as a build
      # step" shape as HarborArchGate, not a second job.
      #
      # `--warnaserror` is deliberately NOT on this line. As a CLI global
      # property it overrides tests/Directory.Build.props, which sets
      # TreatWarningsAsErrors=false on purpose (RS0030 and CFE0001 there are
      # documented false positives that would "train people to ignore the
      # analyzer"). The props own the policy; the command line no longer
      # second-guesses it. Test projects also set GenerateDocumentationFile=false
      # there, so the doc gate covers src/ + apps/ + tools/, which is the
      # shipped surface.
      # Issue #1144 slice B.3 (CI+local parity): this step runs the same
      # NUKE Compile target developers run locally — same solution, same
      # configuration, same ContinuousIntegrationBuild property
      # (CompileTarget carries it). The bootstrap also compiles
      # build/_build.csproj, so NUKE build-code edits validate here too.
      - name: Build solution via NUKE (Release, zero warnings, docs, deterministic)
        run: bash build/build.sh Compile --configuration Release

      # The zero-test guard is only a guard if it can go red (#1795). This
      # step proves it: it runs one suite with a filter that matches NO test
      # and requires the runner to exit with one of MTP's "nothing ran"
      # verdicts (8 = zero tests, 9 = fewer than --minimum-expected-tests).
      # Without it, a guard that had been neutered — an option renamed, a
      # policy that stopped applying, a filter that silently matched nothing
      # — would keep every job green while checking nothing.
      #
      # It lives in the BUILD job, not in the `test` job, for a reason that
      # is not about runners: the test-project completeness gate reads
      # "--treenode-filter" as "this list applies a partition to the projects
      # it runs", and a filter in the `test` job would make it believe that
      # the Avalonia E2E project's own shard partition is wired — a finding
      # that is TRUE today (CI runs that project once, without a filter) and
      # that #1946 closes. The check is a property of the test platform, not
      # of the image, so proving it here proves it for the test job too.

      - name: The zero-test guard can go red (issue #1795)
        shell: bash
        run: |
          set -uo pipefail
          dll="tests/Harbor.Abstractions.Tests/bin/Release/net10.0/Harbor.Abstractions.Tests.dll"
          if [ ! -f "$dll" ]; then
            echo "::error::missing $dll — the guard check would be vacuous"
            exit 1
          fi
          set +e
          dotnet exec "$dll" --minimum-expected-tests 1 --zero-tests-policy strict \
            --treenode-filter "/*/*/NoSuchClassForTheGuardCheck/*" > /dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 8 ] && [ "$rc" -ne 9 ]; then
            echo "::error::the zero-test guard is vacuous: a run that discovered no test exited $rc (expected 8 or 9)"
            exit 1
          fi
          echo "the zero-test guard is not vacuous: an empty run exits $rc"

      # #1882. The issue's question, asked of the tree that was just built:
      # is a banned assembly in the OUTPUT DIRECTORY of a test or sample
      # project? The `test/sample package set` job below answers the same
      # question from the resolved package graph, without a build; this step
      # answers it from the output the build actually produced, which is
      # where a banned package really lands. The two are separate
      # mechanisms: a file can reach an output directory without being a
      # package in the graph.

      # #1882. The issue's question, asked of the tree that was just built:
      # is a banned assembly in the OUTPUT DIRECTORY of a test or sample
      # project? The `test/sample package set` job below answers the same
      # question from the resolved package graph, without a build; this step
      # answers it from the output the build actually produced, which is
      # where a banned package really lands. The two are separate
      # mechanisms: a file can reach an output directory without being a
      # package in the graph.
      - name: No banned assembly in any test/sample output directory
        run: python3 tools/check-test-packages.py --output-only --min-projects 43 --min-output-dirs 40

      # #1836 — the TUnit analyzer gate, proved rather than assumed.
      #
      # TUnit's own analyzers report TUnitAssertions0005 (an Assert.That on a
      # constant) and TUnitAssertions0015 (IsEqualTo(true) where IsTrue()
      # belongs), and tests/Directory.Build.props promotes both to errors for
      # every test project. A promotion nobody watches is a decoration: if the
      # analyzer stopped shipping, the build would go quietly green and the
      # gate would protect nothing.
      #
      # So the gate is proved by a PLANTED OFFENDER. tests/TUnitAnalyzerCanary
      # is not a row of Harbor.slnx — it is not built by the step above,
      # because its planted offender is an ERROR by design. This step builds
      # it on purpose and asserts that the build failed with
      # TUnitAssertions0005 at the planted line, and that the planted WAIVED
      # offender was not reported: a waiver that grew past its own site would
      # fail here.
      #
      # The self-test runs first, over synthetic logs, because a checker that
      # cannot fail is not a checker: it proves the analysis REJECTS a log
      # with no diagnostic, with the waived site reported, and with the
      # diagnostic on the wrong line.
      - name: The TUnit analyzer gate is armed (planted offender, waived site)
        run: |
          python3 tools/check-tunit-analyzer-gate.py --selftest
          python3 tools/check-tunit-analyzer-gate.py

      - name: Smoke — CLI binary runs
        run: dotnet exec apps/Harbor.App.Cli/bin/Release/net10.0/Harbor.App.Cli.dll --version

      # Slice B.1/B.2 proof without new jobs: shell syntax of the installer
      # + .deb builder, and the NUKE target catalog still 1:1 with
      # reflection (TargetCatalog.Verify fails the list run on drift).
      - name: Validate installer scripts + build catalog
        run: |
          bash -n dist/install.sh
          bash -n packaging/deb/build-deb.sh
          bash build/build.sh list --format json > /dev/null

      # NuGet pack + validation (issue #429). Steps, not a new job: no new
      # matrix axis, same Release outputs built above. Pack warnings fail
      # the job because Directory.Build.props sets TreatWarningsAsErrors.
      # Publishing to nuget.org is deliberately NOT here — pack must stay
      # green on every PR long before any release feed is configured.
      - name: Pack NuGet libraries (Release, deterministic)
        run: dotnet pack Harbor.slnx -c Release --no-build -p:ContinuousIntegrationBuild=true -o out/packages

      - name: Validate NuGet packages (metadata, README, lib)
        run: python3 tools/pack-validate.py out/packages

      # Payload determinism across two packs. NuGet stamps zip entry
      # timestamps with pack wall-clock time, so two `dotnet pack` runs are
      # never byte-identical files even under ContinuousIntegrationBuild
      # (measured: identical sizes and CRCs, only date_time differs). The
      # property CI pins is that every entry's bytes are identical — which
      # still catches nondeterministic build inputs (timestamps or dates
      # baked into dlls, generated code, nuspecs).
      - name: Determinism — identical payloads across two packs
        run: |
          dotnet pack Harbor.slnx -c Release --no-build -p:ContinuousIntegrationBuild=true -o out/packages2
          python3 - <<'EOF'
          import sys
          import zipfile
          from pathlib import Path
          first, second = Path("out/packages"), Path("out/packages2")
          bad = []
          for pkg in sorted(first.glob("*.nupkg")):
              other = second / pkg.name
              if not other.exists():
                  bad.append(f"{pkg.name}: missing from second pack")
                  continue
              with zipfile.ZipFile(pkg) as za, zipfile.ZipFile(other) as zb:
                  na = {i.filename: i for i in za.infolist()}
                  nb = {i.filename: i for i in zb.infolist()}
                  if set(na) != set(nb):
                      bad.append(f"{pkg.name}: entry lists differ")
                      continue
                  for name, ia in na.items():
                      ib = nb[name]
                      if ia.file_size != ib.file_size or ia.CRC != ib.CRC or za.read(name) != zb.read(name):
                          bad.append(f"{pkg.name}: entry {name} differs")
          if bad:
              print(f"{len(bad)} nondeterministic entr(y/ies):")
              print("\n".join(f"  - {b}" for b in bad))
              sys.exit(1)
          print("deterministic: identical payloads across two packs")
          EOF

      # Clean-room proof that the dependency graph resolves: throwaway
      # project, local feed for Harbor.* + nuget.org for transitives.
      - name: Smoke-install Harbor.Abstractions + one provider
        run: |
          VER=$(grep -o '<Version>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2)
          rm -rf /tmp/packsmoke && dotnet new console -n packsmoke -o /tmp/packsmoke --no-restore
          cd /tmp/packsmoke
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/out/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet add package Harbor.Abstractions --version "$VER"
          dotnet add package Harbor.Providers.OpenAiCompatible --version "$VER"
          dotnet build -c Release --nologo

      - name: Upload NuGet packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: out/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      # Advisory report only: surfaces `dotnet package list --vulnerable`
      # output (NU190x advisories) on every PR without failing the build.
      # continue-on-error is intentional — see "Dependency & advisory policy"
      # in docs/DEVELOPMENT.md. Failing on advisories is deferred (issue #25).
      #
      # Three changes, each with its measured size (run 39389070999, job
      # 118518321386, step "Report vulnerable packages (non-blocking)" = 42 s):
      #
      #   * `--no-restore` — the noun-first `dotnet package list` RESTORES
      #     first as of .NET 10 (learn.microsoft.com/en-us/dotnet/core/
      #     compatibility/sdk/10.0/dotnet-package-list-restore). The restore
      #     was 3.6 s of the 42 s ("All projects are up-to-date for
      #     restore") and the assets it produces are already on disk: the
      #     NUKE Compile target restored the solution 370 s earlier.
      #   * the path filter — the scan is SKIPPED unless the dependency graph
      #     changed (needs.changes.outputs.deps). The remaining 36.5 s is
      #     not the restore: it is the NuGet advisory API round trip, which
      #     is the price of the report, not of the plumbing. A code-only PR
      #     cannot change one advisory, so it does not pay the 36.5 s.
      #   * the guard — a report-only step that prints nothing is
      #     indistinguishable from a clean scan. The check below fails the
      #     STEP (the job still continues: continue-on-error) when the scan
      #     did not complete or produced no per-project result.
      #
      # The noun-first spelling is the .NET 10 form; `dotnet list package`
      # is the verb-first alias of the same command and is deprecated in
      # favour of it. The solution is passed with --project: the noun-first
      # command takes NO positional argument (`dotnet package list [options]`
      # in `dotnet package list --help`), and the repo root holds two
      # solutions, so the implicit search would fail anyway.
      - name: Report vulnerable packages (non-blocking)
        if: needs.changes.outputs.deps == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -uo pipefail
          out="$(dotnet package list --project Harbor.slnx --vulnerable --include-transitive --no-restore 2>&1)"
          status=$?
          printf '%s\n' "$out"
          # Guard. Both markers are locale-independent ON PURPOSE: the CLI
          # localises its prose (the runner is en_US today, a guard that
          # depends on that is a guard that breaks). A project name in
          # backticks is what a per-project result line looks like, and it
          # is what proves the scan listed something.
          if [ "$status" -ne 0 ]; then
            echo "::error::the advisory scan exited $status — the report above is not a complete scan"
            exit 1
          fi
          if ! grep -q '`Harbor\.' <<<"$out"; then
            echo "::error::the advisory report contains no per-project result — the report is EMPTY, not clean"
            exit 1
          fi

      - name: Upload architecture-gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-gate-log
          path: tests/Harbor.Architecture.Tests/obj/Release/net10.0/harbor-arch-gate.log
          if-no-files-found: ignore
          retention-days: 7

      # The build job uploads one artifact per consumer, and each shard's
      # artifact carries only that shard's projects. The shard's project
      # list and the slice's project list are the same list written twice
      # (the `test` job's matrix and the upload steps below), so this
      # checks that they still agree — a project added to a shard without
      # being added to the slice fails here, with the project's name, instead
      # of failing in the shard with a "Missing …dll" that points at the
      # download.
      - name: The build-output slices match the test shards
        run: python3 tools/ci-shard-slices.py

      # The evaluation-cost instrument's own failure path (issue #1919).
      # Same argument as the aot gate's self-test below and docs.yml's
      # `selftest` job: a parser edited until it matches nothing is
      # indistinguishable from a parser that found nothing, so the
      # fixture has numbers this asserts, not just rows.
      - name: Self-test the evaluation-cost instrument
        run: python3 tools/msbuild-evaluation-cost.py --self-test

      # ── Build outputs: one artifact PER CONSUMER ──────────────────────────
      #
      # Measured on run 39389070999 (artifact 12249049956): ONE artifact,
      # 8,106 files, 1,254.2 MiB raw / 446.1 MiB zipped, uploaded in 50.5 s
      # and then downloaded IN FULL by six jobs — the four test shards,
      # coverage and perf-gate: 10 + 17 + 60 + 9 + 11 + 10 = 117 s of runner
      # time to hand 2,676 MiB to consumers that each need a quarter of it.
      #
      # Two changes, one artefact set:
      #
      # 1. THE PAYLOAD IS TRIMMED. Of the 8,106 files, 4,004 are satellite
      #    localisation assemblies and 218 are NuGet's restore files. Only 28
      #    of the satellites are ours (ru/Harbor.Ui.Framework.Abstractions.
      #    resources.dll, issue #434); the other 3,949 belong to NuGet
      #    packages (Microsoft.Testing.*, Roslyn, TestPlatform) and are read
      #    by nobody — a missing satellite falls back to the neutral
      #    assembly. The restore files (obj/project.assets.json and
      #    obj/project.nuget.cache) are inputs to MSBuild and never to the
      #    runtime: a test project resolves from its own <Project>.deps.json
      #    + <Project>.runtimeconfig.json, both in the same output
      #    directory, and NEITHER mentions project.assets.json (checked in
      #    the artifact itself). The per-project globs below therefore name
      #    the satellite file explicitly (`*/Harbor.*.resources.dll`) instead
      #    of globbing the culture directories and excluding afterwards.
      #
      # 2. IT IS SPLIT PER CONSUMER. A test project's output directory is
      #    self-contained: the project's own DLL, every project reference
      #    copied local, its deps/runtimeconfig JSON, and the native assets
      #    under runtimes/linux-x64/native/ (libSkiaSharp.so, libe_sqlite3.so
      #    — the Avalonia and SQLite native libraries, 89 .so files here, all
      #    kept). So a shard needs only its own projects' directories. The
      #    one cross-directory dependency in the whole repo is CliDriver
      #    (tests/Harbor.E2E.Framework/CliDriver.cs), which spawns
      #    apps/Harbor.App.Cli/bin/Release/net10.0/Harbor.App.Cli.dll — so
      #    the e2e slice carries the CLI's own output directory too.
      #
      # Two mechanics of the upload action, both measured on a first attempt
      # that got both of them wrong (the artifact came out 4x too big and
      # rooted one directory too high):
      #
      #   * `*.*` DOES NOT MEAN "every file in the directory". @actions/glob
      #     adds an implicit `/**` to a pattern that does not end in `**`, so
      #     a pattern that matches a DIRECTORY drags in everything under it.
      #     `tests/<P>/bin/Release/net10.0/*` therefore pulled in EVERY
      #     runtime's native assets (win-arm64, osx-x64, android-arm64,
      #     browser-wasm, …: 533 files, 555 MiB raw) — dead weight on a
      #     linux-x64 runner. The globs below name the three file kinds
      #     explicitly instead: the top-level files, the linux-x64 natives,
      #     and Harbor's own satellite.
      #   * THE ARTIFACT ROOT IS THE LEAST COMMON ANCESTOR of the glob
      #     search paths (upload-artifact v7, src/shared/search.ts). A slice
      #     that only lists tests/** is therefore rooted at tests/, and the
      #     shard would extract its files to <workspace>/<Project>/… instead
      #     of <workspace>/tests/<Project>/… — the DLLs would not be where
      #     the shard looks for them. `Harbor.slnx` in every slice's list
      #     pins the root at the workspace root: it is the file this repo
      #     already uses as its root marker (HarborAppLocator, the
      #     architecture rules), and one root-level path is enough to move
      #     the LCA up to the workspace.
      #
      # `solution-binaries` is KEPT as the combined artifact the `coverage`
      # job downloads (core + platform — the two shard lists coverage runs).
      # It is duplicated on purpose: the coverage job belongs to the
      # job-graph work, and this change must not depend on that edit landing
      # first. When coverage switches to the two slices, this upload can be
      # deleted — it is 135.1 MiB of the 448.1 MiB below.
      #
      # The upload total is FLAT: 448.1 MiB zipped across six artifacts
      # versus 446.1 MiB in one, and 4,329 files instead of 8,106 (fewer
      # blobs to push). The saving is on the DOWNLOAD side: ~18 s across
      # the six consumers instead of 117 s, and the platform shard's 60 s
      # download becomes ~7.5 s.
      #
      # One line of context for the artifact-storage budget: the single
      # artifact was 469,943,655 bytes = 448.0 MiB, i.e. 89.6% of the
      # GitHub Free plan's entire 500 MB artifact storage limit before the
      # run's other artifacts are counted. The split keeps the total flat
      # instead of growing it, and the trimmed payload is what keeps it
      # flat.
