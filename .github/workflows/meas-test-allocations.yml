# The allocation measurement harness (issue #2136).
#
# WHAT THIS MEASURES
# ------------------
# The BYTES the test tree spends, and where. The architecture suite was
# measured by TIME (#1791) and the layer under the rules was fixed; the byte
# side was never asked: which constructs in `tests/**` allocate, how many of
# them there are, what one of them costs, and what the rewrite of a hot one
# saves.
#
# The instrument is `tests/Harbor.Architecture.Tests/TestTreeAllocationCensus.cs`
# (the census: the sites and the measured cost of one call of each), and the
# per-mechanism measurements live next to the code they measure
# (`Harbor.TestKit.Tests`, `Harbor.E2E.Framework.Tests`). What this workflow
# does is RUN them and put their numbers where a human reads them.
#
# WHY A WORKFLOW OF ITS OWN
# --------------------------
# The `ci` lane is a GATE: it fails a pull request, and it reports into the
# job summary of the shard that ran the suite. A measurement wants the other
# thing — a lane that runs the suites, prints their numbers, and gates
# NOTHING. The same shape as `meas-analyzer-cost.yml`, `meas-build-vcpu.yml`
# and `meas-jit-aot.yml`: it is triggered by a push to a measurement branch or
# by a manual dispatch, it uploads its artefacts, and it decides nothing.
#
# It also answers a question the `ci` lane cannot: the "before" side. The
# dispatch input `ref` says WHICH tree to measure, so the same harness can be
# run twice — once on the branch with the rewrites, once on the tree without
# them — and the two runs are comparable because the harness is the same.
#
# THE PROJECTS, AND WHY EACH ONE IS HERE
# --------------------------------------
#   Harbor.Architecture.Tests  — the census: the sites, the measured cost of
#                                 one call of each mechanism, the ranking.
#   Harbor.E2E.Framework.Tests — the terminal-grid searches: the oracle
#                                 (the old implementation) against the new
#                                 one, with the bytes each one allocates.
#   Harbor.TestKit.Tests       — the art dump: the same shape.
#   Harbor.Tui.CellForge.Tests — the biggest CONSUMER of the art dump, so the
#                                 ui shard's own duration is measured here too.
#   Harbor.Tui.CellForge.PtyTests — the PTY scenarios: the poll loop of
#                                 `TuiDriver.WaitForTextAsync` is the biggest
#                                 consumer of the terminal-grid searches, and
#                                 this suite is long enough for its wall to be
#                                 a number and not a rounding.
#   Harbor.App.Cli.Tests       — the second consumer of the art dump.
#
# THE OUTPUT
# ----------
# Every suite writes a TRX, and `tools/test-measurements.py` renders the
# measurements a test PRINTED into the job summary — the `[alloc-cost]` and
# `[alloc-rank]` lines, with the test that produced them. The TRX files are
# uploaded, so the full census (one line per site) is downloadable and not
# only the rows the summary table keeps.

name: meas-test-allocations

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Which tree to measure (a branch, a tag or a commit)"
        required: false
        default: ""
      note:
        description: "What this dispatch measures (free text)"
        required: false
        default: ""
  push:
    # The measurement branch. A push to it measures that tree and nothing
    # else; a pull request is measured by the `ci` lane's own shards.
    branches: [ci/meas-test-allocations]

permissions:
  contents: read

jobs:
  measure:
    name: allocation census
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The FULL history, and the tree the dispatch asked for: the
          # measurement is about ONE tree, and the "before" side of a
          # comparison is a different one.
          fetch-depth: 0
          ref: ${{ inputs.ref || '' }}

      - name: Record the environment
        run: |
          {
            echo "nproc=$(nproc)"
            echo "runner_image=${ImageOS:-unknown}"
            echo "kernel=$(uname -sr)"
            echo "dotnet_sdk=$(dotnet --version 2>/dev/null || echo unknown)"
            echo "utc=$(date -u +%FT%TZ)"
            echo "tree=$(git rev-parse HEAD)"
          } | tee runner-diag.txt

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.402"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Restore
        run: dotnet restore Harbor.slnx

      - name: Build (Release)
        run: dotnet build Harbor.slnx -c Release --no-restore -p:MaxCpuCount=0

      - name: Run the suites that carry the measurements
        run: |
          set -uo pipefail
          mkdir -p TestResults
          : > status.tsv
          for p in \
            Harbor.Architecture.Tests \
            Harbor.E2E.Framework.Tests \
            Harbor.TestKit.Tests \
            Harbor.Tui.CellForge.Tests \
            Harbor.Tui.CellForge.PtyTests \
            Harbor.App.Cli.Tests; do
            dll="tests/$p/bin/Release/net10.0/$p.dll"
            echo "::group::measure $p"
            if [ ! -f "$dll" ]; then
              echo "Missing $dll — did the build produce it?"
              printf '%s\tmissing\n' "$p" >> status.tsv
            else
              start=$(date +%s)
              if dotnet exec "$dll" --minimum-expected-tests 1 \
                  --report-trx \
                  --results-directory "$GITHUB_WORKSPACE/TestResults/$p"; then
                printf '%s\tpass\t%s\n' "$p" "$(( $(date +%s) - start ))" >> status.tsv
              else
                printf '%s\tFAIL\t%s\n' "$p" "$(( $(date +%s) - start ))" >> status.tsv
              fi
            fi
            echo "::endgroup::"
          done
          cat status.tsv
          # A suite that failed is a FAILED MEASUREMENT, not a failed gate:
          # the numbers this lane prints are worth less than a red line, so
          # the red line is the honest answer. The lane still finishes, so the
          # artefacts and the summary are uploaded.
          exit 0

      - name: The measurements, in the job summary
        if: always()
        run: |
          python3 tools/test-measurements.py TestResults --summary "$GITHUB_STEP_SUMMARY" --max-rows 500
          {
            echo ""
            echo "### The per-suite wall (seconds)"
            echo ""
            echo "| project | outcome | seconds |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r project outcome seconds; do
              [ -n "${project:-}" ] || continue
              echo "| $project | $outcome | ${seconds:-} |"
            done < status.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-allocations-${{ github.run_id }}
          path: |
            TestResults/
            status.tsv
            runner-diag.txt
          retention-days: 30
          if-no-files-found: warn
