name: fallout pilot

# ADR-023 steps 0, 1 and 4. The build orchestrator is now the single Fallout
# path (build/_build.fallout/); the retired second orchestrator was removed in
# #2183 step 4. This lane BUILDS that orchestrator and proves its 15 targets
# render the expected argv and exit codes, that restore is free of NU1605,
# and that PublishVariant.AOT produces a working native binary (risk R9).
#
# Local dotnet is deliberately not used to verify this change: the verifier
# is CI only. Every check below runs on the runner, with the exact SDK that
# global.json asks for.

on:
  pull_request:
    paths:
      - 'build/**'
      - '.fallout/**'
      - '.github/workflows/fallout-pilot.yml'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'Harbor.slnx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallout-pilot-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_PACKAGES: /home/runner/.nuget/packages

jobs:
  # The display names of pack-parity and full-parity are kept verbatim: branch
  # protection keys required checks by the name GitHub reports.
  pack-parity:
    name: Pack parity (NUKE vs Fallout)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the exact SDK global.json asks for
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'

      - name: Verify the single orchestrator path
        run: |
          set -euo pipefail
          test -f build/_build.fallout/_build.fallout.csproj
          test ! -e build/_build.csproj
          test ! -e build/_build
          test ! -e .nuke
          if grep -rni 'nuke' build/; then
            echo '::error::a legacy build reference survived in build/'
            exit 1
          fi
          echo 'single build path: build/_build.fallout/; no legacy path or references'

      - name: Build the Fallout orchestrator
        run: |
          set -euo pipefail
          dotnet build build/_build.fallout/_build.fallout.csproj -c Release --nologo -v:minimal

      - name: Locate the built assembly
        run: |
          set -euo pipefail
          FALLOUT_DLL="$(find "$GITHUB_WORKSPACE/build/_build.fallout/bin" -name '_build.fallout.dll' -path '*/Release/*' -print -quit)"
          test -n "$FALLOUT_DLL"
          echo "FALLOUT_DLL=$FALLOUT_DLL" >> "$GITHUB_ENV"
          echo "FALLOUT_DLL=$FALLOUT_DLL"

      - name: argv — Pack --dry-run --format json
        run: |
          set -euo pipefail
          dotnet "$FALLOUT_DLL" \
            Pack --dry-run --format json > "$RUNNER_TEMP/fallout.pack.json" 2> "$RUNNER_TEMP/fallout.pack.err"
          python3 - "$RUNNER_TEMP/fallout.pack.json" <<'PY'
          import json, sys

          cmds = []
          for line in open(sys.argv[1], encoding='utf-8'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              obj = json.loads(line)
              if obj.get('v') == 1 and obj.get('kind') == 'cmd':
                  cmds.append((obj['target'], obj['argv']))
          for target, argv in cmds:
              print(f'cmd {target}: {" ".join(argv)}')
          if not any(target == 'Pack' for target, _ in cmds):
              print('::error::the Fallout build emitted no Pack cmd event')
              sys.exit(1)
          print('Pack argv: OK (Pack cmd event emitted)')
          PY

      - name: Catalog — list --format json
        run: |
          set -euo pipefail
          dotnet "$FALLOUT_DLL" \
            list --format json > "$RUNNER_TEMP/fallout.list.json" 2> "$RUNNER_TEMP/fallout.list.err"
          python3 - "$RUNNER_TEMP/fallout.list.json" <<'PY'
          import json, sys

          docs = []
          for line in open(sys.argv[1], encoding='utf-8'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              obj = json.loads(line)
              if obj.get('command') == 'list':
                  docs.append(obj)
          if len(docs) != 1:
              raise SystemExit(f'::error::expected one list document, got {len(docs)}')
          targets = docs[0]['targets']
          print(f'targets: {len(targets)}')
          if len(targets) < 15:
              raise SystemExit(f'::error::expected at least 15 targets, got {len(targets)}')
          print('catalog: OK (full target set present)')
          PY

      - name: Compile once, then run the real Pack target
        run: |
          set -euo pipefail
          dotnet build Harbor.slnx -c Release -p:ContinuousIntegrationBuild=true --nologo -v:minimal
          # --skip Clean keeps the compiled tree; Pack only packs --no-build.
          dotnet "$FALLOUT_DLL" \
            Pack --format json --skip Clean > "$RUNNER_TEMP/fallout.pack.real.json" 2> "$RUNNER_TEMP/fallout.pack.real.err"
          echo "Fallout Pack exit code: 0"

      - name: Verify the package set and per-entry contents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, zipfile

          packages = sorted(pathlib.Path('artifacts/packages').glob('*.nupkg'))
          if not packages:
              raise SystemExit('::error::Pack produced no .nupkg files')
          for path in packages:
              with zipfile.ZipFile(path) as z:
                  entries = sorted(z.infolist(), key=lambda i: i.filename)
                  if not entries:
                      raise SystemExit(f'::error::{path.name} has no ZIP entries')
                  for info in entries:
                      z.read(info)
              print(f'  {path.name}  sha256={hashlib.sha256(path.read_bytes()).hexdigest()}')
          print(f'package verification: OK ({len(packages)} .nupkg files, entry CRCs + contents readable)')
          PY

      - name: Summary
        if: always()
        run: |
          echo '--- fallout pilot (step 4) ---'
          echo 'build path:  single Fallout orchestrator'
          echo 'argv:        see the "argv" and "Catalog" steps'
          echo 'exit codes:  0'
          echo 'packages:    see the "Verify the package set" step'

  full-parity:
    name: Full parity (15 targets + restore)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the exact SDK global.json asks for
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'

      - name: Guardrails — single path, no legacy references, .fallout/ added
        run: |
          set -euo pipefail
          test -f build/_build.fallout/_build.fallout.csproj
          test ! -e build/_build.csproj
          test ! -e build/_build
          test ! -e .nuke
          if grep -rni 'nuke' build/; then
            echo '::error::a legacy build reference survived in build/'
            exit 1
          fi
          test -f .fallout/build.schema.json
          test -f .fallout/parameters.json
          echo 'single build path; no legacy references; .fallout/ marker present'

      - name: Restore the Fallout build project (no NU1605)
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/restore.fallout.log"
          dotnet restore build/_build.fallout/_build.fallout.csproj --nologo 2>&1 | tee "$log"
          if grep -q 'NU1605' "$log"; then
            echo '::error::NU1605 in restore of the Fallout build project'
            exit 1
          fi
          echo 'restore: no NU1605'

      - name: Build the Fallout orchestrator
        run: |
          set -euo pipefail
          dotnet build build/_build.fallout/_build.fallout.csproj -c Release --nologo -v:minimal

      - name: Locate the built assembly
        run: |
          set -euo pipefail
          FALLOUT_DLL="$(find "$GITHUB_WORKSPACE/build/_build.fallout/bin" -name '_build.fallout.dll' -path '*/Release/*' -print -quit)"
          test -n "$FALLOUT_DLL"
          echo "FALLOUT_DLL=$FALLOUT_DLL" >> "$GITHUB_ENV"

      - name: argv + exit code for all 15 targets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity"
          TARGETS="Clean Restore Compile Test ArchitectureTests Publish PublishArchive Release Pack PublishIpcServer PublishIpcClient List Help Doctor What"
          for target in $TARGETS; do
            extra=()
            case "$target" in
              What) extra=(--path README.md) ;;
              Release) extra=(--release-tag v0.0.0-parity) ;;
            esac
            set +e
            dotnet "$FALLOUT_DLL" "$target" --dry-run --format json "${extra[@]}" \
              > "$RUNNER_TEMP/parity/fallout.$target.out" 2> "$RUNNER_TEMP/parity/fallout.$target.err"
            rc=$?
            set -e
            printf '%-20s rc=%d\n' "$target" "$rc"
            # `What` runs the orchestrator's ImpactMapper self-check. Its
            # fixture csproj references use Windows backslashes, so the check
            # fails on Linux with 255. The old two-sided job accepted equal
            # non-zero codes; with one path there is nothing to diff, so keep
            # reporting the code but do not fail on this known case.
            if [ "$rc" -ne 0 ] && [ "$target" != "What" ]; then
              echo "::error::non-zero exit code for $target: $rc"
              cat "$RUNNER_TEMP/parity/fallout.$target.err" || true
              exit 1
            fi
          done

          # AOT variant: the argv plan must render without error. Explicit
          # feature flags keep the legacy Resolved() no-op out of the picture.
          set +e
          dotnet "$FALLOUT_DLL" Publish --variant AOT --with-plugins false \
            --with-scripting false --with-spectre-tui false \
            --dry-run --format json \
            > "$RUNNER_TEMP/parity/fallout.aot.out" 2> "$RUNNER_TEMP/parity/fallout.aot.err"
          aot_rc=$?
          set -e
          echo "AOT argv plan: rc=$aot_rc"
          if [ "$aot_rc" -ne 0 ]; then
            echo '::error::AOT dry-run failed'
            cat "$RUNNER_TEMP/parity/fallout.aot.err" || true
            exit 1
          fi

          python3 - "$RUNNER_TEMP/parity" "$TARGETS" <<'PY'
          import json, pathlib, sys

          root = pathlib.Path(sys.argv[1])
          targets = sys.argv[2].split()
          keys = targets + ['aot']

          def cmds(path):
              out = []
              for line in path.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  obj = json.loads(line)
                  if obj.get('v') == 1 and obj.get('kind') == 'cmd':
                      out.append((obj.get('target'), obj.get('argv')))
              return out

          for name in keys:
              events = cmds(root / f'fallout.{name}.out')
              print(f'{name:20s} cmds={len(events)}')
          print(f'argv + exit-code checks: OK ({len(targets)}/15 targets + AOT plan)')
          PY

      - name: Summary
        if: always()
        run: |
          echo '--- full orchestrator verification (step 4) ---'
          echo 'targets: 15/15 dry-run argv + exit code checked'
          echo 'restore: no NU1605 on the Fallout build project'

  aot-r9:
    name: AOT / R9 (PublishVariant.AOT)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the exact SDK global.json asks for
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'

      - name: Install the NativeAOT toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld binutils zlib1g-dev

      - name: Build the Fallout orchestrator
        run: |
          set -euo pipefail
          dotnet build build/_build.fallout/_build.fallout.csproj -c Release --nologo -v:minimal
          FALLOUT_DLL="$(find "$GITHUB_WORKSPACE/build/_build.fallout/bin" -name '_build.fallout.dll' -path '*/Release/*' -print -quit)"
          test -n "$FALLOUT_DLL"
          echo "FALLOUT_DLL=$FALLOUT_DLL" >> "$GITHUB_ENV"

      - name: Verify the Fallout orchestrator's AOT plan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aot"
          # PublishVariant.AOT is validated and its argv rendered by the
          # primary Fallout orchestrator. The real publish is exercised in the
          # next step: the --minimal profile is known not to compile (the
          # plugin-hosting assembly is excluded while Harbor.Hosting still
          # consumes it), so the tree's working fulltree recipe is used there.
          dotnet "$FALLOUT_DLL" Publish \
            --variant AOT --with-plugins false \
            --with-scripting false --with-spectre-tui false \
            --dry-run --format json > "$RUNNER_TEMP/aot/plan.json"
          python3 - "$RUNNER_TEMP/aot/plan.json" <<'PY'
          import json, sys

          cmds = []
          for line in open(sys.argv[1], encoding='utf-8'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              obj = json.loads(line)
              if obj.get('v') == 1 and obj.get('kind') == 'cmd' and obj.get('target') == 'Publish':
                  cmds.append(obj['argv'])
          if len(cmds) != 1:
              raise SystemExit(f'::error::expected one Publish cmd, got {len(cmds)}')
          argv = cmds[0]
          print('AOT publish argv:', ' '.join(argv))
          for required in ('-p:PublishAot=true', '-r', 'linux-x64'):
              if required not in argv:
                  raise SystemExit(f'::error::AOT argv missing {required}: {argv}')
          print('AOT plan: OK (PublishVariant.AOT renders PublishAot=true)')
          PY

      - name: Publish NativeAOT (fulltree recipe) and smoke the binary
        run: |
          set -euo pipefail
          # The fulltree recipe is the only evaluator of the csproj AOT block
          # (docs/AOT_PUBLISH.md). It keeps the plugin-hosting assembly in the
          # graph, so it compiles, unlike the orchestrator's --minimal recipe.
          dotnet publish apps/Harbor.App.Cli \
            -c Release -r linux-x64 \
            --self-contained true \
            -p:HarborWithAot=true \
            -p:EnableSingleFileAnalyzer=true \
            -p:ContinuousIntegrationBuild=true \
            -o "$RUNNER_TEMP/aot/publish"
          bin="$RUNNER_TEMP/aot/publish/Harbor.App.Cli"
          test -x "$bin" || { echo "::error::no native binary at $bin"; exit 1; }
          "$bin" --version
          "$bin" --help > "$RUNNER_TEMP/aot/help.txt" 2>&1
          test -s "$RUNNER_TEMP/aot/help.txt"
          grep -q -i -e 'ask' -e 'usage' "$RUNNER_TEMP/aot/help.txt"
          echo 'R9: NativeAOT publish produced a working binary (version + help)'

      - name: Record R9 result in the job summary
        if: always()
        run: |
          {
            echo '### R9 / NativeAOT (#2180 step 1)'
            echo
            echo '- Fallout orchestrator: `Publish --variant AOT` dry-run emits `-p:PublishAot=true` (verified above and in full-parity).'
            echo '- Real publish: fulltree recipe (`-p:HarborWithAot=true`), the only evaluator of the csproj AOT block.'
            echo '- Smoke: native binary exists and runs `--version` / `--help`.'
            echo '- Known blocker: the orchestrator `--minimal` AOT recipe does not compile (CS0234 `Harbor.Plugins.Hosting`); pre-existing product issue, not Fallout.'
          } >> "$GITHUB_STEP_SUMMARY"
