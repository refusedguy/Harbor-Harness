# Renderer performance gate (renderer-unification sprint Phase 6.1).
#
# Fails when any renderer backend misses its DECLARED contract ceilings
# (throughput / p99 latency / allocations — RendererPerformanceContract.Defaults)
# or when the markdown render contract is violated. These absolute ceilings are
# deterministic enough for shared CI runners.
#
# The relative >5%-regression check against the committed baseline runs too,
# but only ENFORCES when HARBOR_PERF_BASELINE_STRICT=1 — shared runners have
# ±20% noise, so strict regression gating is intended for dedicated perf
# hardware. The report artifact is uploaded on every run for diffing.
name: renderer-perf-gate

on:
  pull_request:
    paths:
      - "src/Harbor.Tui.**"
      - "src/Harbor.Ui.Framework.Rendering/**"
      - "src/Harbor.Terminal.Abstractions/**"
      - "tests/Harbor.Tui.PerfTests/**"
      - "tests/Harbor.Tui.RendererTests/**"
      - ".github/workflows/renderer-perf-gate.yml"
  push:
    branches: [dev, master]
  workflow_dispatch:

# Superseded runs on the same PR/branch are noise — cancel them.
concurrency:
  group: renderer-perf-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARBOR_PERF_REPORT: ${{ github.workspace }}/renderer-perf-report.txt
      # Flip to 1 (on a self-hosted perf runner) to enforce the 5% rule:
      # HARBOR_PERF_BASELINE_STRICT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build tests/Harbor.Tui.PerfTests -c Release

      # MTP-only dotnet test (opted in via global.json): VSTest-era arguments
      # such as --logger abort the session with "Zero tests ran", exit 5.
      # Per-test output (including the [perf] metric lines) comes from
      # --output Detailed instead.
      - name: Run renderer performance gate
        run: dotnet test tests/Harbor.Tui.PerfTests -c Release --no-build --output Detailed

      - name: Enforce relative 5% regression rule (strict mode only)
        if: env.HARBOR_PERF_BASELINE_STRICT == '1'
        run: |
          python3 - <<'PY'
          import os, sys
          baseline = {}
          for line in open("tests/Harbor.Tui.PerfTests/baseline.csv"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              b, _, eps, p99, mem = line.split(";")
              baseline[b] = (float(eps), float(p99), float(mem))
          failed = False
          for line in open(os.environ["HARBOR_PERF_REPORT"]):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              b, _, eps, p99, mem = line.split(";")
              eps, p99, mem = float(eps), float(p99), float(mem)
              b0 = baseline.get(b)
              if not b0:
                  print(f"{b}: no baseline entry — add one to baseline.csv"); failed = True; continue
              if eps < b0[0] * 0.95:
                  print(f"{b}: throughput regression {eps:F0} < 95% of {b0[0]:F0}"); failed = True
              if p99 > b0[1] * 1.05:
                  print(f"{b}: p99 regression {p99:F3} > 105% of {b0[1]:F3}"); failed = True
              if mem > b0[2] * 1.05:
                  print(f"{b}: allocation regression {mem:F4} > 105% of {b0[2]:F4}"); failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-perf-report
          path: renderer-perf-report.txt
