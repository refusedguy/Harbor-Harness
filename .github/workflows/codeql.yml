# CodeQL security & quality analysis for C#.
#
# Autobuild-driven (the repo's zero-warning Release gate is unrelated here —
# CodeQL builds Debug to observe the compiler). Weekly schedule + pushes to
# mainline branches + PRs targeting them. Secret scanning itself is a repo
# setting (enabled in Settings → Code security); push protection covers
# leaks in commits.
name: codeql

# WHERE THE PR SCAN RUNS, AND WHY ONLY THERE
#
# A PR's merge commit and the push to that branch carry the same content,
# so a PR-lane scan and the branch's push scan see the same code. The only
# thing the PR lane buys is TIMING: the finding arrives before the merge
# instead of after it.
#
# That matters exactly where the merge is a release, so the pull_request
# trigger is scoped to `master` (the release branch, whose push is what the
# `publish` job ships from). A PR into `dev` is covered by the push scan of
# dev, which runs minutes after the merge, and the dev tree is a working
# branch, not a release.
#
# What the unscoped PR lane cost, measured over the last 24 h: 11.5
# runner-minutes per attempt (mean of 17 runs) and an 11-minute hold on a
# runner slot, in a pool whose queueing is the actual bottleneck. At 20 open
# PRs that is 20 slots held for 11 minutes each, for advice rather than a
# check (no ruleset is enforced on dev/master).
#
# The `concurrency` group below drops a superseded run of the same branch
# (PR lane only); pushes are never cancelled, so the mainline scan always
# runs.
on:
  push:
    branches: [master, dev]
  pull_request:
    # The release gate: a PR into master is scanned before it ships.
    branches: [master]
    paths:
      - "src/**"
      - "apps/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC, off-peak

# The other PR-triggered workflows all carry a `concurrency` group with
# cancel-in-progress; this one did not, so a superseded CodeQL run kept
# a runner slot for its full ~11 minutes and none of the 3.7 runs per
# PR were ever cancelled. The group is per branch, so a push to
# dev/master still runs unconditionally -- only superseded runs of the
# same branch are dropped.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      # No `submodules: recursive`: the vendored ConsoleEx submodule left the
      # product (ADR-019); nothing in this workflow builds contrib/external/.
      - uses: actions/checkout@v7

      # build-mode: none never restores into the default global-packages
      # folder, so the NuGet cache it would save is always empty.
      # actions/setup-dotnet's post step throws
      # ("Cache folder path is retrieved for .NET CLI but doesn't exist on
      # disk") when that folder was never created — keep the SDK install,
      # drop the cache (it guards nothing: queries and SARIF upload below
      # are unchanged).
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-sharp"
