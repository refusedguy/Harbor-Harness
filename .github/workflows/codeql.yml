# CodeQL security & quality analysis for C#.
#
# Autobuild-driven (the repo's zero-warning Release gate is unrelated here —
# CodeQL builds Debug to observe the compiler). Weekly schedule + pushes to
# mainline branches + PRs targeting them. Secret scanning itself is a repo
# setting (enabled in Settings → Code security); push protection covers
# leaks in commits.
name: codeql

# The pull_request trigger was removed (owner decision, 2026-10-20).
#
# A PR's merge commit and the push to dev carry the same content, so the
# mainline scan sees exactly what a PR-lane scan would have seen, one step
# later. What the PR lane cost, measured over the last 24 h: 11.5
# runner-minutes per attempt (mean of 17 runs) and an 11-minute hold on a
# runner slot, in a pool whose queueing is our real bottleneck. At 20 open
# PRs that is 20 slots held for 11 minutes each. No ruleset is enforced on
# dev/master, so the PR-lane result gated nothing: it was advice, not a
# check.
#
# The mainline scan is therefore the security gate: every push to dev and
# to master is scanned, and the weekly cron covers the branches that did
# not move.
#
# To restore the early warning, re-add exactly this block:
#   pull_request:
#     branches: [master, dev]
#     paths:
#       - "src/**"
#       - "apps/**"
#       - ".github/workflows/codeql.yml"
on:
  push:
    branches: [master, dev]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC, off-peak

# The other PR-triggered workflows all carry a `concurrency` group with
# cancel-in-progress; this one did not, so a superseded CodeQL run kept
# a runner slot for its full ~11 minutes and none of the 3.7 runs per
# PR were ever cancelled. The group is per branch, so a push to
# dev/master still runs unconditionally -- only superseded runs of the
# same branch are dropped.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # build-mode: none never restores into the default global-packages
      # folder, so the NuGet cache it would save is always empty.
      # actions/setup-dotnet's post step throws
      # ("Cache folder path is retrieved for .NET CLI but doesn't exist on
      # disk") when that folder was never created — keep the SDK install,
      # drop the cache (it guards nothing: queries and SARIF upload below
      # are unchanged).
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-sharp"
