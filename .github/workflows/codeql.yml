# CodeQL security & quality analysis for C#.
#
# Autobuild-driven (the repo's zero-warning Release gate is unrelated here —
# CodeQL builds Debug to observe the compiler). Weekly schedule + pushes to
# mainline branches + PRs targeting them. Secret scanning itself is a repo
# setting (enabled in Settings → Code security); push protection covers
# leaks in commits.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "apps/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC — off-peak

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-sharp"
