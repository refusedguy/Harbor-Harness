# CodeQL security & quality analysis for C#.
#
# Autobuild-driven (the repo's zero-warning Release gate is unrelated here —
# CodeQL builds Debug to observe the compiler). Weekly schedule + pushes to
# mainline branches + PRs into the release branch. Secret scanning itself is a
# repo setting (enabled in Settings → Code security); push protection covers
# leaks in commits.
name: codeql

# WHERE THE SCAN RUNS, AND WHY ONLY THERE
#
# Three lanes, one job (`analyze`), three purposes:
#
#   push on dev        the working line. Every merge that changes the C#
#                      surface is analysed, and a scan that a newer tree
#                      supersedes is dropped (see `concurrency` below).
#   push on master     the release line. Its push is what the `publish` job
#                      ships from, so the shipped tree is the analysed tree.
#   pull_request on    the release gate: a PR into master is scanned BEFORE
#     master            it ships. A PR into dev is covered by the dev push
#                      scan, minutes after the merge, because dev is a
#                      working branch and not a release.
#   schedule (Mondays) the query-base update: the only thing that changes
#                      without a code change. It analyses the default branch
#                      (master today).
#
# THE `paths` FILTER, ON EVERY LANE
#
# The analysis output can only change when the C# surface (`src/`, `apps/`) or
# this workflow changes. A commit that touches neither has the tree of the last
# analysed commit, so scanning it re-derives the same answer for another
# ~11.7 runner-minutes. The filter is the same on the push and the PR trigger,
# so the lanes agree on what "a change that can move the analysis" is.
#
# MEASURED (GitHub API, workflow `codeql`, job `analyze`, 2026-10-20)
#
#   PR lane, before it was narrowed to master:
#     100 runs, 1150.3 runner-minutes, mean 11.5 min per run.
#   dev push lane, in the 11.6 h after that change:
#     100 push events, 38 of which changed the C# surface, 37 scans that ran
#     (63 runs were cancelled while queued and cost nothing), 433.0
#     runner-minutes spent, 11.7 min per scan, plus 243 minutes of queue
#     wait.
#     26 of the 37 scans were superseded by a newer push before they finished,
#     and the newer tree contains the older one, so those scans answered a
#     question nobody asked any more.
#     62 of the 100 dev pushes changed no `src/**`, no `apps/**` and not this
#     file: 62% of the lane re-analysed a tree that had not changed.
#
# THE `concurrency` GROUP
#
# A superseded run of the same branch is dropped: the newer tree's scan
# supersedes the older one's, and the newer scan is the one that matters. Two
# lanes are never dropped:
#   - the release lane (push on master): a release scan has to finish;
#   - the weekly schedule: it is the query-base update, and it is the only
#     scan that does not depend on a code change.
# The event name is part of the group, so the weekly schedule and a master push
# (both on `refs/heads/master`) do not cancel each other.
on:
  push:
    branches: [master, dev]
    paths:
      - "src/**"
      - "apps/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    # The release gate: a PR into master is scanned before it ships.
    branches: [master]
    paths:
      - "src/**"
      - "apps/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC, off-peak
  workflow_dispatch: # re-run on demand, e.g. after a CodeQL query-base bump

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      # No `submodules: recursive`: the vendored ConsoleEx submodule left the
      # product (ADR-019); nothing in this workflow builds contrib/external/.
      - uses: actions/checkout@v7

      # build-mode: none never restores into the default global-packages
      # folder, so the NuGet cache it would save is always empty.
      # actions/setup-dotnet's post step throws
      # ("Cache folder path is retrieved for .NET CLI but doesn't exist on
      # disk") when that folder was never created — keep the SDK install,
      # drop the cache (it guards nothing: queries and SARIF upload below
      # are unchanged).
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-sharp"
