# Harbor docs gate — markdown only, no dotnet.
#
# WHY THIS FILE EXISTS (issue #509)
#
#   `tools/check-md-links.py` has been in the repo since #39 hygiene and has
#   never run in CI. ci.yml lists `**.md` and `docs/**` in `paths-ignore` for
#   both `push` and `pull_request`, so a docs-only PR never starts a build and
#   therefore never reached the checker. A gate in a workflow that cannot
#   trigger is worse than no gate: it looks like the links are checked.
#
#   That is the third instance of the same failure in this repo — the other
#   two were three test projects missing from Harbor.slnx and the CI matrix
#   (#519), and NetArchTest rules naming a deleted assembly, where a
#   non-existent name reads as a *satisfied* constraint (#450).
#
#   So the fix is a second, cheap workflow rather than a change to ci.yml:
#   docs-only PRs get a real signal in ~30s instead of a full .NET build, and
#   ci.yml keeps its paths-ignore. Do not "fix" this by deleting those entries
#   from ci.yml — that would rebuild the entire solution for a typo in a
#   paragraph, and this file would still be the only thing that lints markdown.
#
# WHAT RUNS HERE
#
#   selftest  all four gates against fixtures that are known-broken. A checker
#             that has quietly stopped finding anything is still green on every
#             PR, so the failure path is tested on every docs change.
#   links     internal link + GitHub anchor resolution, with a file/ref floor.
#   cites     `file:line` in a normative document resolves, and a type it names
#             is constructed by something (#664).
#   facts     a COUNT the onboarding documents state still equals the count of
#             tracked files it is counting (#933). This is the only one of the
#             four that asks a numeric question, and it is deliberately not a
#             cross-check between the copies of a prose fact: measured, that
#             gate is red on dated records and green on the live defect. The
#             `facts` job's comment carries the measurement.
#   lint      markdown structural invariants, with a file/line floor.
#   testdup   duplicated test bodies in tests/ (#1778), with a scan-size floor.
#             It lives here rather than in ci.yml because it needs no .NET
#             SDK and because ci.yml is the workflow the dotnet matrix owns.
#
#   merge-loss  the local squash-merges: a pull request that touches
#             `.github/workflows/` cannot be merged through the GitHub API with
#             this repository's token (no `workflow` scope), so it is merged
#             LOCALLY with `git merge --squash`, and the resolution dropped
#             whole sections of files. The job walks those merges and asks
#             whether what they dropped is still missing. No dotnet, no

# THE FLOORS ARE THE POINT
#
#   `--min-files` / `--min-refs` / `--min-lines` make a narrowed scan fail
#   instead of passing quietly. They are set ~20% below today's numbers (310
#   markdown files, 770 link refs, 74109 lines) and are a ratchet: a PR that
#   legitimately removes documents lowers them in the same diff, where a
#   reviewer can see it. A script that scans zero paths and exits 0 is the
#   same failure mode this gate exists to end.
#
#   There is no allow-list of files to skip, and no `continue-on-error`: a
#   broken link in a docs-only PR must be red, not a note in the log.
#
# NOT a dotnet job: nothing here needs the SDK, the solution, or a submodule
# (no tracked markdown lives in contrib/external/ConsoleEx, the vendored tree
# that moved out of the product in ADR-019). If that changes, add
# `submodules: recursive` to the checkout below.
name: docs

on:
  push:
    branches: [dev, master]
    paths:
      - '**.md'
      - 'tests/**/*.cs'
      - 'src/**/*.cs'
      - 'apps/**/*.cs'
      # #428. `check-abstractions-contract.py` reads four guarded projects'
      # .csproj files and the .cs they compile. A csproj is how a dependency
      # enters this repository, so a workflow that watched only .cs could not
      # trigger on the change the gate exists to catch — the #509 failure (a
      # gate made green by never running) wearing a different hat. Same for
      # Directory.Packages.props, which is where a version is pinned.
      - 'src/**/*.csproj'
      - 'Directory.Packages.props'
      - 'tools/check-md-links.py'
      - 'tools/md-lint.py'
      - 'tools/check-doc-cites.py'
      - 'tools/md_gate.py'
      - 'tools/gates/check-abstractions-contract/**'
      # #1728. The arch-anchor gate reads the architecture rule tree and its own
      # exceptions file, so a PR that edits the gate itself has to run it.
      - 'tools/check-arch-anchors.py'
      - 'tools/arch-anchor-exceptions.txt'
      # #1726. The guard triage reads the TRX of the `test` job, and its
      # self-test runs here with the other python tools. A PR that edits the
      # tool, or the registry that says what a firing MEANT, must run the
      # self-test, or the edit lands unvalidated.
      - 'tools/guard-triage.py'
      - 'tools/guard-triage-classes.json'
      # #1722. The plugin-inventory gate reads the two plugin registries, the
      # sample plugins and the product's own JSON writer, and compares the
      # result with the committed snapshot. A PR that edits any of them has to
      # run it, or the snapshot drifts from the tree it describes.
      - 'tools/gen-plugin-inventory.py'
      - 'docs/PLUGIN_INVENTORY.json'
      # #1778. `check-test-dup.py` scans `tests/**/*.cs` and compares the
      # result against its committed baseline, so a PR that edits the gate or
      # the baseline must run it — and so must a PR that edits the tree it
      # measures.
      - 'tools/check-test-dup.py'
      - 'tools/test-dup-baseline.json'
      # #1847. `check-dup-jscpd.py` scans `src/`, `apps/` and `tests/` and
      # compares the result against its committed baseline, so a PR that
      # edits the gate, the config or the baseline must run it — and so must
      # a PR that edits the tree it measures.
      - 'tools/check-dup-jscpd.py'
      - 'tools/jscpd-baseline.json'
      - '.jscpd.json'
      # #1822. `check-test-json-reflection.py` scans `tests/**/*.cs` and
      # compares the result against its committed exceptions file, so a PR
      # that edits the gate or the exceptions must run it — and so must a PR
      # that edits the tree it measures.
      - 'tools/check-test-json-reflection.py'
      - 'tools/test-json-reflection-exceptions.txt'
      # #1823. `check-test-projects.py` reads the test projects, the solution
      # that carries them and the CI lists that name them, so a PR that
      # touches any of the three has to run it: a new test project (its
      # .csproj and the solution entry that goes with it), a change to a CI
      # list, a change to the gate or to its baseline, and the NUKE `Test`
      # target whose exclusions the census reads.
      - 'tests/**/*.csproj'
      - 'Harbor.slnx'
      # #1780. The tool-schema pin is read by a gate and by the compiler
      # (Harbor.CodeGen.ToolSchemaGenerator), so a PR that edits the pin, the
      # gate or the model it reads has to run it — and so must a PR that edits
      # the tool declarations the pin describes.
      - 'tools/check-tool-schema-pin.py'
      - 'tools/tool_schema_model.py'
      - 'src/Harbor.Tools.Builtin/Schemas/*.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/test-os.yml'
      - 'tools/check-test-projects.py'
      - 'tools/test-project-baseline.txt'
      - 'build/_build/Targets/TestTarget.cs'
      # #1575. The string-switch gate reads `src/` and `apps/`, and compares
      # the result against its committed exceptions file, so a PR that edits
      # the gate or the exceptions must run it, and so must a PR that edits
      # the tree it measures. The rewrites file is the reviewed record of what
      # the gate's own `--apply` mode replays, so it is a trigger too.
      - 'tools/check-string-switch.py'
      - 'tools/string-switch-exceptions.txt'
      - 'tools/string-switch-rewrites.py'
      # #1884. The two reporters (the measurement table and the wall census)
      # and their self-tests: a PR that edits either must run them, for the
      # same reason the gates above are triggered by their own sources.
      - 'tools/gates/test-measurements/**'
      - 'tools/gates/test-census/**'
      # #1795. The third reporter (the skipped tests, with their reasons) and
      # its self-test — same trigger as the two above.
      - 'tools/gates/test-skips/**'
      # #431 (slice D3). `check-xml-doc-coverage.py` gates the XML-doc surface
      # of the frozen contract assembly: a PR that edits the gate must run it.
      - 'tools/gates/check-xml-doc-coverage/**'
      # #1845. `check-public-api-resign.py` is the surviving half of the
      # public-API freeze: it reads the PR's commit history, so a PR that
      # edits the gate itself must run it. The other half — the freeze
      # itself — is a compile-time gate in the ci.yml build job and needs no
      # trigger here.
      - 'tools/gates/check-public-api-resign/**'
      # The merge-loss gate. A pull request that touches a workflow file is
      # merged LOCALLY (the token has no `workflow` scope), and the local
      # squash-merge dropped content. The gate has to run on every such pull
      # request, and on the push that lands it — so the trigger is the
      # workflow files themselves, not the gate's own sources alone.
      - '.github/workflows/**'
      - 'tools/merge-loss-exceptions.txt'
      # #1731. The `gen-seam-graph` gate generates docs/SEAM_GRAPH.md from the C#
      # sources, and `--check` fails when the committed document no longer
      # matches the tree. The gate reads src/ and apps/, so a PR that edits
      # either has to run it - and a PR that edits the generator or the
      # document it writes has to run it too.
      - 'tools/gates/**'
      - 'tools/bin/**'
      - 'docs/SEAM_GRAPH.md'
      # #1888. The gate policy's own checker, and the three tools whose
      # self-test no workflow ran until the policy asked for one. A PR that
      # edits any of them must run the checker, because the checker's
      # verdict about the tree depends on what those files say.
      - 'tools/check-gate-policy.py'
      - 'tools/gates/test-skips/**'
      # #1558. `check-result-chains.py` scans `src/` and `apps/` for the
      # `if (x.IsFailure)` guard sites and ratchets the count of chain
      # candidates, so a PR that edits the gate or the baseline must run it —
      # and so must a PR that edits the tree it measures (the .cs paths above).
      - 'tools/check-result-chains.py'
      - 'tools/result-chains-baseline.json'
      # #1781. The shard-balance gate reads the shard lists in ci.yml and the
      # recorded cost of every project, so a PR that edits the gate, the
      # measurement or the workflow's shard lists has to run it — and so must
      # a PR that edits the tree it measures.
      - 'tools/shard-costs.json'
      # #431. docfx.json is the docs-site manifest and docs/toc.yml is its nav:
      # a PR that touches either must run the assembly + link gates below.
      # api/** is the tracked API landing (api/index.md is .md and already
      # covered, but future generated-source entries would not be).
      - 'docfx.json'
      - 'docs/toc.yml'
      - 'api/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      # #947. TEST-CITE-DRIFT reads `tests/**/*.cs`, so a PR that inserts a
      # line above a cited one — the only way this defect is ever created —
      # touches none of the paths above unless .cs is here. Without these three
      # the rule is unreachable on exactly the PRs it exists for, which is the
      # #509 failure (a `paths-ignore` that made a gate green by never running)
      # wearing a different hat.
      - 'tests/**/*.cs'
      - 'src/**/*.cs'
      - 'apps/**/*.cs'
      # #428. `check-abstractions-contract.py` reads four guarded projects'
      # .csproj files and the .cs they compile. A csproj is how a dependency
      # enters this repository, so a workflow that watched only .cs could not
      # trigger on the change the gate exists to catch — the #509 failure (a
      # gate made green by never running) wearing a different hat. Same for
      # Directory.Packages.props, which is where a version is pinned.
      - 'src/**/*.csproj'
      - 'Directory.Packages.props'
      - 'tools/check-md-links.py'
      - 'tools/md-lint.py'
      - 'tools/check-doc-cites.py'
      - 'tools/md_gate.py'
      - 'tools/gates/check-abstractions-contract/**'
      # #1728. The arch-anchor gate reads the architecture rule tree and its own
      # exceptions file, so a PR that edits the gate itself has to run it.
      - 'tools/check-arch-anchors.py'
      - 'tools/arch-anchor-exceptions.txt'
      # #1726. The guard triage reads the TRX of the `test` job, and its
      # self-test runs here with the other python tools. A PR that edits the
      # tool, or the registry that says what a firing MEANT, must run the
      # self-test, or the edit lands unvalidated.
      - 'tools/guard-triage.py'
      - 'tools/guard-triage-classes.json'
      # #1778. Same trigger as above: the duplicate-body gate measures
      # `tests/**/*.cs` and compares the result against its committed
      # baseline, so a PR that edits the tree it measures — or the gate, or
      # the baseline — must run it.
      - 'tools/check-test-dup.py'
      - 'tools/test-dup-baseline.json'
      # #1847. Same trigger as above: the second duplication gate measures
      # `src/`, `apps/` and `tests/` and compares the result against its
      # committed baseline, so a PR that edits the tree it measures — or the
      # gate, the config, or the baseline — must run it.
      - 'tools/check-dup-jscpd.py'
      - 'tools/jscpd-baseline.json'
      - '.jscpd.json'
      # #1822. `check-test-json-reflection.py` scans `tests/**/*.cs` and
      # compares the result against its committed exceptions file, so a PR
      # that edits the gate or the exceptions must run it — and so must a PR
      # that edits the tree it measures.
      - 'tools/check-test-json-reflection.py'
      - 'tools/test-json-reflection-exceptions.txt'
      # #1823. Same trigger as above: the completeness gate reads the test
      # projects, the solution and the CI lists, so a PR that edits any of
      # the three must run it.
      - 'tests/**/*.csproj'
      - 'Harbor.slnx'
      - '.github/workflows/ci.yml'
      - '.github/workflows/test-os.yml'
      - 'tools/check-test-projects.py'
      - 'tools/test-project-baseline.txt'
      - 'build/_build/Targets/TestTarget.cs'
      # #1575. Same trigger as above: the string-switch gate reads `src/` and
      # `apps/` and compares the result against its committed exceptions
      # file, so a PR that edits the gate or the exceptions must run it.
      - 'tools/check-string-switch.py'
      - 'tools/string-switch-exceptions.txt'
      - 'tools/string-switch-rewrites.py'
      # #1884. Same trigger as above: the two reporters and their self-tests.
      - 'tools/gates/test-measurements/**'
      - 'tools/gates/test-census/**'
      # #1795. The third reporter (the skipped tests, with their reasons) and
      # its self-test — same trigger as the two above.
      - 'tools/gates/test-skips/**'
      # #431 (slice D3). Same trigger as above: the XML-doc coverage gate
      # reads the frozen contract sources, so a PR touching the gate runs it.
      - 'tools/gates/check-xml-doc-coverage/**'
      # #1845. Same trigger as above: the re-signing gate reads the commit
      # history, so a PR that edits the gate runs its self-test.
      - 'tools/gates/check-public-api-resign/**'
      # The merge-loss gate. Same trigger as above: a pull request that
      # touches a workflow file is the one that gets merged LOCALLY, so the
      # gate has to run on it.
      - '.github/workflows/**'
      - 'tools/merge-loss-exceptions.txt'
      # #1731. Same trigger as above: the seam-graph gate reads the C# tree
      # and compares the result with the committed document.
      - 'tools/gates/**'
      - 'tools/bin/**'
      - 'docs/SEAM_GRAPH.md'
      # #1888. Same trigger as above: the policy checker, and the three tools
      # whose self-test no workflow ran until the policy asked for one.
      - 'tools/check-gate-policy.py'
      - 'tools/gates/test-skips/**'
      # #1558. Same trigger as above: the chain census measures `src/` and
      # `apps/` (the .cs paths above), so a PR that edits the gate or the
      # baseline must run it.
      - 'tools/check-result-chains.py'
      - 'tools/result-chains-baseline.json'
      # #1781. Same trigger as above: the shard-balance gate reads the shard
      # lists in ci.yml and the recorded cost of every project, so a PR that
      # edits the gate, the measurement or the workflow's shard lists must run
      # it.
      - 'tools/shard-costs.json'
      # #431. Same trigger as above: the site manifest and its nav.
      # api/** mirrors the push block for the same reason.
      - 'docfx.json'
      - 'docs/toc.yml'
      - 'api/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Anti-vacuity. Runs the gates against a throwaway git repo containing
  # documents that are deliberately broken, and asserts the specific
  # diagnostics. If someone edits a rule until it matches nothing, this is the
  # job that goes red — not the "everything is fine" jobs below.
  selftest:
    name: checker self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Link checker fails on a broken link
        run: python3 tools/check-md-links.py --self-test
      - name: Markdown lint fails on a malformed document
        run: python3 tools/md-lint.py --self-test
      # The changelog assembler glues the per-pull-request fragments into
      # CHANGELOG.md. Its failure path is tested here for the same reason as
      # the others: a script edited until it assembles nothing is
      # indistinguishable from a script that assembles nothing.
      - name: Changelog assembler fails on a diverged CHANGELOG.md
        run: tools/bin/harbor-gates-linux-x64 changelog-assemble --self-test
      # #664. The third gate is the only one that asks whether a `file:line`
      # in a normative document still points at a line, and whether a backticked
      # type is constructed by anything. Its failure path is tested here for
      # the same reason the other two are: a rule edited until it matches
      # nothing is indistinguishable from a rule that found nothing.
      - name: Citation checker fails on a stale file:line and an unwired type
        run: python3 tools/check-doc-cites.py --self-test
      # #1728. The eleventh gate is the only one that asks whether an
      # architecture rule may anchor on a line number AT ALL. Its failure path
      # is tested here for the same reason as the others: a rule edited until it
      # matches nothing is indistinguishable from a rule that found nothing.
      - name: Architecture-anchor gate fails on a planted line-number anchor
        run: python3 tools/check-arch-anchors.py --self-test
      # #933. The fourth gate is the only one that asks whether a COUNT the
      # onboarding documents state still equals the count of tracked files.
      # Its failure path is tested for the same reason as the other three: the
      # fixtures here include the two shapes that made a draft of this gate
      # wrong — a rule compared against the wrong population (green on a
      # number that is not the one in the document) and a rule whose capture
      # group was edited away (reported BLIND, the one verdict CI passes).
      - name: Repo-map counter fails on a stale count and detects its own blindness
        run: tools/bin/harbor-gates-linux-x64 check-doc-facts --self-test
      # #428. The fifth gate is the only one that reads a `.csproj`, and the only
      # one that asks about a package rather than about a document: is every
      # PackageReference a guarded project declares load-bearing, and is every
      # non-BCL namespace its sources use declared. Its self-test carries fifteen
      # fixtures and six of them pin bugs this tool had while being written, so
      # its failure path is as much the point as its passing path. Every fixture
      # added after the first version was checked by mutation: it fails when its
      # own fix is reverted and the rest still pass. Two candidate mutations were
      # tried and found NOT reachable by any fixture, and the tool's comments say
      # so rather than implying coverage that is not there.
      - name: Guarded-project dependency gate fails on a phantom package
        run: tools/bin/harbor-gates-linux-x64 check-abstractions-contract --self-test
      # #431 (slice D3). The sixth gate is the only one that asks whether a
      # public member of the frozen contract assembly carries an XML doc (or
      # an explicit suppression with a reason). Its self-test carries fixtures
      # for every shape that made a draft of this gate wrong — a `record
      # struct` named "struct", a `= new(...)` tail donating the name "new",
      # parameter continuations named "1"/"default" — and the load-bearing
      # non-vacuity proof: one undocumented member fails, naming it.
      - name: XML-doc coverage gate fails on an undocumented member
        run: tools/bin/harbor-gates-linux-x64 check-xml-doc-coverage --self-test
      # #428 / #1845. The public-API freeze used to be a python text scan
      # with its own --self-test here. The scan is gone: the freeze is a
      # COMPILE-time gate now (Microsoft.CodeAnalysis.PublicApiAnalyzers,
      # RS0016/RS0017), and its non-vacuity proof is a CI job that builds a
      # throwaway project against the real analyzer — see
      # tools/public-api-nonvacuity.sh and the ci.yml `public-api` job.
      #
      # What is left in python is the re-signing half — the rule that a
      # change to the frozen surface is re-signed in the SAME COMMIT — which
      # the compiler cannot see because it sees one tree, not a history. Its
      # self-test is here, with the other gates that have one.
      - name: Re-signing gate fails on an unreviewed change
        run: tools/bin/harbor-gates-linux-x64 check-public-api-resign --self-test
      # #1778. The eighth gate is the only one that reads the TEST tree, and
      # the only one that asks whether a test body is a copy of another test
      # body. Its failure path is tested here for the same reason as the
      # others: a rule edited until it matches nothing is indistinguishable
      # from a rule that found nothing, and the load-bearing fixture is the
      # planted duplicate — the gate MUST fail on it, and MUST stay quiet on
      # a same-shape body that shares no identifiers with it.
      - name: Merge-loss checker reports a dropped line
        run: tools/bin/harbor-gates-linux-x64 check-local-merge-loss --self-test
      # The changelog assembler is a RELEASE-time tool, not a gate on the
      # pull-request path: the fragments are glued into the [Unreleased] section
      # when the release is cut, so a pull request never edits CHANGELOG.md
      # itself. Its self-test runs here for the same reason every other gate's
      # does — a tool that quietly stopped noticing a diverged CHANGELOG.md is
      # indistinguishable from one that found nothing.
      - name: Changelog assembler fails on a diverged changelog
        run: tools/bin/harbor-gates-linux-x64 changelog-assemble --self-test
      # #1778. The eighth gate is the only one that reads the TEST tree, and
      # the only one that asks whether a test body is a copy of another test

      - name: Duplicate-test-body gate fails on a planted duplicate
        run: python3 tools/check-test-dup.py --self-test
      # #1847. The second duplication detector, the one that scans the
      # PRODUCT code and the duplication that is not a method body. Its
      # failure path is tested for the same reason as the others, and its
      # load-bearing fixture is the EMPTY scan: a scan that analysed nothing
      # must not be green, because a gate that measured nothing protects
      # nothing. The second fixture is the growth: a tree that duplicated
      # more than the baseline allows must fail.
      - name: Second duplication gate fails on an empty scan and on growth
        run: python3 tools/check-dup-jscpd.py --self-test
      # #1823. The ninth gate is the only one that asks whether a test
      # project is claimed by a CI list AT ALL. The other gates read the
      # contents of the test tree; this one reads the lists that decide
      # which projects run, and the answer is a property of the workflow
      # files rather than of a test body. Its self-test carries the
      # load-bearing fixtures: a project left out of every list, a stale
      # list entry, a project claimed only behind a condition, and a
      # baseline row that no longer matches anything.
      - name: Test-project completeness gate fails on a project left out of CI
        run: python3 tools/check-test-projects.py --self-test
      # #1884. The last two are REPORTERS, not gates: they read the TRX
      # artifacts a CI run produced and print what they find (the per-test
      # measurements, the per-project wall census). They never fail a build,
      # which is exactly why their self-tests belong here: a reporter that
      # quietly stops reporting is green on every run and tells nobody
      # anything, and that is the same failure shape the gates above are
      # tested against. The census's self-test carries the load-bearing
      # fixture: a test that printed NOTHING is still counted, which is the
      # difference between a census and a measurement table.
      - name: Measurement reporter still finds the tests that printed something
        run: tools/bin/harbor-gates-linux-x64 test-measurements --self-test
      - name: Test census counts every test, printed or not
        run: tools/bin/harbor-gates-linux-x64 test-census --self-test
      # #1726. The third REPORTER: it reads what a CI run produced (a TRX or
      # a job log) and writes down what each guard firing MEANT - a defect, a
      # style rule, or noise on code the repository allows. Its failure path
      # is tested here for the same reason as the two above: a reporter that
      # stops reading a failure is green on every run and reports nothing, and
      # a reporter that GUESSES a class is worse than one that says
      # "unknown". The load-bearing fixtures are both: a failure it must
      # find, and a firing it must refuse to classify.
      - name: Guard triage finds a failure and refuses to guess its class
        run: python3 tools/guard-triage.py --self-test
      # #1822. The tenth gate is the only one that asks whether a test
      # serializes through the SOURCE-GENERATED path or the reflection one.
      # Its failure path is tested here for the same reason as the others: a
      # rule edited until it matches nothing is indistinguishable from a rule
      # that found nothing, and the load-bearing fixture is the planted
      # reflection call — the gate MUST fail on it.
      - name: Reflection-JSON gate fails on a planted reflection call
        run: python3 tools/check-test-json-reflection.py --self-test
      # #1888. The policy checker's failure path. It plants one defect per
      # rule in a synthetic tree and asserts that the rule fires, and that
      # the same tree without the defect is clean. A rule that cannot fire
      # is indistinguishable from a rule that found nothing, which is the
      # shape every other gate in this job is tested against.
      - name: Gate-policy checker fails on a planted divergence
        run: python3 tools/check-gate-policy.py --self-test
      # The changelog assembler owns CHANGELOG.md, and every pull request owns
      # a fragment instead. Its self-test proves it still notices a diverged
      # file and still glues a fragment: a PR that edits the assembler must
      # run it, or the edit lands unvalidated.
      - name: Changelog assembler glues a fragment and notices a diverged file
        run: tools/bin/harbor-gates-linux-x64 changelog-assemble --self-test
      # #1888. The three tools whose self-test no workflow ran. The policy
      # says every gate and every reporter proves its own failure path in
      # CI, and these three had a self-test that nothing called — a
      # self-test nobody reads. The pack validator's self-test is offline
      # (it builds its own fixture package), and the two reporters' and the
      # helper's self-tests are offline too, so all three cost about a
      # second.
      - name: Pack validator still fails on a package without its metadata
        run: tools/bin/harbor-gates-linux-x64 pack-validate --selftest
      # #1795. The third reporter: the SKIPPED tests of a run, with the reason
      # each one declared. Same argument as the two above — a reporter that
      # stops reporting is green on every run and tells nobody anything. Its
      # self-test carries the two shapes that matter: a skip WITH a reason
      # (the reason must survive, marker stripped) and a skip WITHOUT one
      # (the report must say so instead of inventing a reason).
      - name: Skip reporter still finds a skipped test
        run: tools/bin/harbor-gates-linux-x64 test-skips TestResults --self-test
      - name: Mtime normaliser still tells a changed file from an unchanged one
        run: tools/bin/harbor-gates-linux-x64 normalize-mtimes --self-test
      # #1558. The chain census. Its failure path is tested here for the same
      # reason as the others: a scanner edited until it matches nothing is
      # indistinguishable from a scanner that found nothing. The load-bearing
      # fixtures are the five shapes the census tells apart (a chain
      # candidate, a terminal guard, a side-effect guard, a guard that does
      # not return a Result, and the one shape the rewrite applies to), and
      # the rewrite itself — the census MUST produce the Bind call it says
      # it produces.
      - name: Chain census finds every planted guard shape and rewrites the one it promises
        run: python3 tools/check-result-chains.py --self-test
      # #1575. The string-switch gate is the only one that asks whether the
      # product dispatches on a string literal with a `case` ladder. Its
      # failure path is tested here for the same reason as the others: a rule
      # edited until it matches nothing is indistinguishable from a rule that
      # found nothing, and the load-bearing fixtures are the planted string
      # switch, the unlisted switch, the stale row and the floor.
      - name: String-switch gate fails on an unlisted string switch
        run: python3 tools/check-string-switch.py --self-test
      # #1731. The seam-graph gate is the only one that GENERATES a document
      # and then compares it with the committed one. Its failure path is the
      # whole point: a generator whose output drifts from the tree is a
      # generator that has stopped reading the tree, and the committed
      # document is then a hand-maintained document wearing a generated one's
      # name. The self-test plants a stale file and requires the check to
      # fail, and separately requires the route grader to tell a registering
      # route from a refusing one.
      - name: Seam-graph gate fails on a stale document
        run: tools/bin/harbor-gates-linux-x64 gen-seam-graph --self-test
      # #1781. The shard-balance gate is the only one that asks whether the CI
      # TEST SHARDS are laid out by cost. Its failure path is tested here for
      # the same reason as the others: a rule edited until it matches nothing
      # is indistinguishable from a rule that found nothing. The load-bearing
      # fixture is the RUNAWAY SHARD — one project's cost blown up so that the
      # shards are 20x apart — and the gate MUST fail on it.
      - name: Shard-balance gate fails on a runaway shard
        run: tools/bin/harbor-gates-linux-x64 check-shard-balance --self-test
      # #1753. The coverage tools. The reporter reads the cobertura files
      # the nightly lane produced and prints the per-file tables; the gate
      # compares the registry of accepted holes against the measurement, in
      # both directions. Their failure paths are tested here for the same
      # reason as the others: a reader edited until it matches nothing is
      # indistinguishable from a reader that found nothing. The load-bearing
      # fixtures are the three states a file can be in — covered, a hole,
      # and a file with no code to cover — and the two defects the gate
      # exists for: a file that stopped being covered, and a row that is no
      # longer needed.
      - name: Coverage reporter still tells the three states of a file apart
        run: tools/bin/harbor-gates-linux-x64 coverage-report --self-test
      - name: Coverage registry gate still fires on both sides of the ratchet
        run: tools/bin/harbor-gates-linux-x64 check-coverage-registry --self-test
      # #1780. The eleventh gate is the only one that asks whether the
      # parameter schema of a tool still is the one that was pinned. Its
      # failure path is tested here for the same reason as the others, and
      # the fixture is the one that matters: a schema that moved while the
      # pin did not. The gate MUST fail on it, or the pin protects nothing.
      - name: Tool-schema pin gate fails on a planted divergence
        run: python3 tools/check-tool-schema-pin.py --selftest
      # #1722. The plugin-inventory gate compares the committed snapshot with
      # the tree it describes, so its failure path has to be tested here for
      # the same reason as the others: a gate edited until it matches nothing
      # is indistinguishable from a gate that found nothing. The load-bearing
      # fixture is a stale snapshot AND a product writer that renamed a
      # member - the gate MUST fail on both, and MUST stay quiet on a tree
      # that matches.
      - name: Plugin-inventory gate fails on a stale snapshot
        run: python3 tools/gen-plugin-inventory.py --self-test
      # The changelog assembler glues the per-pull-request fragments into the
      # [Unreleased] section of CHANGELOG.md at release time, so a PR that
      # adds a fragment must NOT edit CHANGELOG.md itself. The gate over the
      # table in docs/CI_GATES.md asks every script with a self-test to be
      # run by some workflow; without this step the assembler is a tool whose
      # self-test nobody calls, and the table cannot say honestly that it
      # exists.
      - name: Changelog assembler notices a diverged CHANGELOG.md
        run: tools/bin/harbor-gates-linux-x64 changelog-assemble --self-test
      # The project-graph measurement: the depth, the level widths and the
      # critical path of the dependency graph. It is a tool a human runs, and
      # no workflow runs it — but its self-test is called here for the same
      # reason as the others: a measurement edited until it measures nothing
      # is indistinguishable from a measurement of an empty graph.
      - name: Project-graph measurement still measures a planted graph
        run: tools/bin/harbor-gates-linux-x64 measure-project-graph --self-test
      # #2085. The two E2E plan tools. The generator derives the class
      # universe from the source tree, and the runner reads the plan the
      # generator wrote: a generator that stops finding the classes writes a
      # plan that drops them, and a runner that stops noticing a dropped class
      # reports a green suite with fewer tests than it has. Neither had a
      # self-test before the port; both have one now, and both run it here.
      - name: E2E shard generator still finds the classes of the tree
        run: tools/bin/harbor-gates-linux-x64 gen-e2e-shards --self-test
      - name: E2E shard runner still refuses a plan it cannot run
        run: tools/bin/harbor-gates-linux-x64 run-e2e-avalonia-shards --self-test
      # The gate over the Go sources of the gates themselves. Its failure path
      # is tested here for the same reason as the others: a rule edited until
      # it matches nothing is indistinguishable from a rule that found
      # nothing. The load-bearing fixtures are the three shapes -- an
      # unformatted file, a package the registry does not name, and a package
      # without a self-test -- and the fixture that needs the Go toolchain
      # (a printf `go vet` must reject) says it did not run when the
      # toolchain is absent, which is the case HERE: this workflow installs
      # no Go. The toolchain's own fixtures run in gates-binary.yml.
      - name: Go-quality gate fails on an unformatted file and a diverged registry
        run: tools/bin/harbor-gates-linux-x64 go-quality --self-test
      # #2119. The event-topology gate is the only one that asks whether the
      # producer table of a normative document still names the tree's real
      # PublishAsync call sites. The `file:line` fence asks whether a line
      # EXISTS, and in that table the line number is the content of the row,
      # so the fence passed a table that named four sites where the file had
      # seven. Its failure path is tested here for the same reason as the
      # others: a rule edited until it matches nothing is indistinguishable
      # from a rule that found nothing.
      - name: Event-topology gate fails on a drifted producer row
        run: tools/bin/harbor-gates-linux-x64 check-event-topology --self-test
      # The workflow gate: a file with a duplicate key in a mapping is a file
      # GitHub refuses to parse, and the refusal is silent — the run is
      # created with ZERO jobs. The gate's own proof that it can fail, run
      # here because the gate itself lives in the `workflows` job below, and
      # a job that cannot start cannot prove anything.
      - name: Workflow gate fails on a duplicate key and stays quiet on a legal repeat
        run: tools/bin/harbor-gates-linux-x64 check-workflows --self-test

  # #2119. The event topology of the harness is a normative document: it
  # says which code publishes on the bus and which code subscribes, and every
  # one of those claims is a `file:line`. The citation fence that guards
  # every other normative document asks one question of a citation: does the
  # line exist? That is the right question for a linear citation and the
  # wrong one for the producer table, where the line number IS the content of
  # the row. A row that named four call sites where the file holds seven
  # passed the fence, and the document said "normative" the whole time.
  #
  # So this gate asks the question the fence cannot: the row and the file
  # must agree on the SET of call sites, in both directions, and every file
  # that publishes must have a row. The floors are the ratchet: a scan that
  # measured fewer rows than the tree holds cannot say the tree is fine.
  eventtopology:
    name: event topology
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check that the producer rows name the tree's real call sites
        run: tools/bin/harbor-gates-linux-x64 check-event-topology --min-producers 8 --min-sites 39 --min-subscribers 24

  links:
    name: internal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every internal link and anchor
        run: python3 tools/check-md-links.py --min-files 250 --min-refs 600

  # #664. Same reasoning as the two jobs above, third question: not "does the
  # link resolve" and not "is the file shaped right" but "does the `file:line`
  # this document asserts still exist, and is the type it names still built".
  #
  # The floors are ~25% below today's numbers (2 normative documents, 143 line
  # citations, 68 backticked type names) and are a ratchet, like the ones above.
  # Scope is the `Status: normative` marker rather than every .md: measured over
  # the whole tree the same rules find 85 pre-existing violations in 24
  # non-normative documents, most of them archived sprint notes under
  # docs/.kilo-docs/ and PLAN.md files that state an intention, and a gate that
  # is red on 85 unrelated findings on day one is a gate that gets switched off.
  # Deleting the marker from a document shrinks the scanned set, which the floors
  # then catch.
  #
  # --min-counts 1 is the floor for DOC-COUNT-STALE, which is NOT opt-in: it
  # asks every document that has a `| path | line |` table whether its stated
  # total matches its own rows. Measured, exactly one document in the tree is
  # in that shape, so the rule is exception-free today; the floor is what keeps
  # it that way, since a COUNT_TOTAL matcher that quietly stopped matching would
  # be indistinguishable from a tree with nothing to ask.
  cites:
    name: normative citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # #947. `fetch-depth: 0` is load-bearing for TEST-CITE-DRIFT, and the
      # first run of this gate proved it: at the default depth of 1, `git blame`
      # attributes every line to the shallow boundary commit, so the "what did
      # this citation mean when it was written" comparison compares HEAD with
      # HEAD and finds nothing. The gate went from 87 findings to 21 and said
      # nothing about it — the mechanical classes kept working, the anchored one
      # went silently blind. A rule that cannot see is worse than no rule,
      # because the build stays green.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `--min-guide-usings` and `--min-base-lists` are the #564 floors. Both are
      # counts of things that are EXPECTED to shrink — the view seam closed, the
      # `Harbor.Tui.Abstractions` facade is gone — so the day the last plugin
      # guide stops fencing a `using` there is nothing left to check, and a rule
      # that goes quiet by succeeding is indistinguishable from one that went
      # quiet by breaking. The floors are what say which happened.
      #
      # The numbers are the tree's, measured not guessed: 3 guides / 37 `using`
      # lines and 2 base lists on dev@7aff0c87.
      - name: Check every normative file:line and named type
        run: python3 tools/check-doc-cites.py --min-files 2 --min-cites 100 --min-types 50 --min-api 12 --min-counts 1 --min-test-cites 70 --min-guide-usings 30 --min-base-lists 2

  # #1728. Eleventh question, and the only one about the ANCHORS the
  # architecture rule tree uses: may an architecture rule point at a LINE
  # NUMBER?
  #
  # The `cites` job above asks whether a `file:line` a test writes still names
  # the line its author meant. This one asks the prior question: why is there a
  # `file:line` to be wrong at all. A line number is a COORDINATE, and every
  # line inserted above it moves the coordinate; the measured price of the
  # coordinate form was three "repair the citation" incidents in one shift
  # (#1701: `:549→:561`, #1658, #1502) plus the standing re-run tax.
  #
  # The architecture tree was the worst offender and has been converted to
  # SYMBOLIC anchors (`Type.Member`, plus the condition that makes the site the
  # one being talked about). This job is what keeps it converted: the seven
  # anchors that remain are the ones where the number IS the checked fact, and
  # they are listed with a reason in tools/arch-anchor-exceptions.txt.
  #
  # The floor is on the number of FILES the scan reads, not on the number of
  # anchors: the anchor count is expected to be zero, and a floor on a defect
  # is a floor on the defect. The non-vacuity proof is the gate's own
  # --self-test (a planted anchor fails, an excused one passes, a stale
  # exception row fails), run in the `selftest` job above.
  archanchors:
    name: architecture anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check that no architecture rule anchors on a line number
        run: python3 tools/check-arch-anchors.py --min-files 40

  lint:
    name: markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check markdown invariants
        run: python3 tools/md-lint.py --min-files 250 --min-lines 60000

  # #933. Fourth question, and the only one a copy-consistency gate could not
  # answer honestly: not "do the links resolve", not "is the file shaped
  # right", not "does the file:line exist" but "does a number the onboarding
  # documents state still equal the count of tracked files it is counting".
  #
  # The scope is AGENTS.md and CLAUDE.md, not every tracked markdown, and the
  # reason is the measurement rather than convenience. #933 asked for a gate
  # that cross-checks the COPIES of a fact, and measuring the tree says that
  # gate cannot be built for prose: the builtin tool count is stated 16 times
  # with six different values (4/5/7/14/20/26), and every divergent copy is a
  # document that has already declared itself historical — a CHANGELOG release
  # note, a "Historical plan (pre-sprint-2)", or docs/specs/, which #983
  # declared a dated record. A prose gate would be red on ten sites allowed to
  # be wrong and green on the live defect. A count is different: it either
  # equals the tree or it does not, and a record quoting an old count cannot
  # make the number agree.
  #
  # --min-facts is the floor. Measured today: 8 counts compared. The floor is
  # 5, so a rule that silently stops matching drives the number down and this
  # job goes red instead of reporting a clean tree — the #591 shape, which the
  # --self-test also pins from the other side.
  facts:
    name: repo-map counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every repo-map count against the tree
        run: tools/bin/harbor-gates-linux-x64 check-doc-facts --min-facts 5

  # #428. Fifth question, and the only one about a package rather than a
  # document: not "do the links resolve", not "is the file shaped right", not
  # "does the file:line exist", not "does the count match", but "is every
  # dependency the two frozen contract projects declare actually reached".
  #
  # #428 asks for v1.0 to freeze the public API of Harbor.Abstractions +
  # Harbor.Abstractions.Contracts, and those two projects are the ones every
  # other assembly points inward at — so a dependency that lands in either is one
  # every consumer inherits. Measured on the tree this landed on: `AGENTS.md`
  # described the facade as "zero-dep (only CSharpFunctionalExtensions)", which is
  # 6 packages wrong, and `CommunityToolkit.HighPerformance` was declared and
  # reached by nothing at all.
  #
  # Both sides of every comparison are files: the PackageReference elements of the
  # two .csproj against the using directives of the .cs they compile. No document
  # is read, which is the #939 lesson applied rather than restated — a gate that
  # cross-checks copies of a prose fact is red on copies that are allowed to be
  # wrong and green on the live defect. This one measures the contract.
  #
  # The floors are a ratchet, like the ones above. Measured after this change:
  # 9 packages declared, 6 distinct external namespaces, 75 .cs files. The floors
  # are set AT those values, not below: this gate was introduced by a fix that
  # removed a declaration, so a floor below the post-fix count would have been a
  # floor that a re-added phantom still cleared. Lower them only in the same diff
  # that legitimately removes a dependency, where a reviewer can see it.
  contract:
    name: guarded project dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Floors are the ratchet, and they are set AT the measured counts rather
      # than below them — a floor with slack cannot tell "the tree got smaller"
      # from "the matcher stopped matching", and only the first of those is a
      # change a reviewer should have to look at. A PR that legitimately removes
      # a dependency lowers them in the same diff. Recomputed when the perimeter
      # widened to four projects (was 9 / 6 / 75 over two), and again after
      # #1623 moved the agent loop out of the Application perimeter
      # (--report: 13 / 7 / 143), and again after #1624 moved the
      # session-context cohort out of the same perimeter (--report: 13 / 7 / 130),
      # and again after #1625 moved the configuration family out of it and the
      # new Harbor.PolicyConfig assembly into it (--report: 19 / 7 / 141).
      - name: Check the guarded projects' declared dependencies
        run: tools/bin/harbor-gates-linux-x64 check-abstractions-contract --min-packages 19 --min-namespaces 7 --min-files 141

  # #1778. Sixth question, and the only one about the TEST tree: not "do the
  # links resolve", not "is the file shaped right", not "does the file:line
  # exist", not "does the count match", not "is every dependency declared",
  # but "is this test body a copy of that test body".
  #
  # Epic #1808 removes ~21 000 lines of duplicated test code and #1778 is the
  # gate that stops it coming back: the rule 6 of the epic makes the
  # detector the condition for calling the programme closed. The gate runs in
  # BASELINE MODE — the whole `tests/` tree is scanned every time, the
  # duplication that exists today is recorded in
  # `tools/test-dup-baseline.json` and allowed to stay, and only NEW or GROWN
  # duplication fails. A gate that is red on today's tree is a gate nobody
  # lands, and a gate nobody lands protects nothing.
  #
  # The floors are a ratchet, like the ones above. Measured on this tree:
  # 938 .cs files and 10 645 method bodies. They are set ~15% below those
  # numbers, because the programme is about to REMOVE test methods: a floor
  # set AT the measured count would go red on the removal PRs themselves.
  # Lower them in the same diff as a legitimate removal, where a reviewer
  # sees it.
  #
  # The non-vacuity proof is the gate's own --self-test (a planted duplicate
  # fails, a same-shape body with unrelated identifiers does not), run in the
  # `selftest` job above.
  testdup:
    name: test duplication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # `--json-out` writes the group list (file, line range, copy count,
      # removable lines) next to the verdict, so the next duplication ticket
      # takes its work list from the artifact instead of re-measuring by
      # hand. The artifact is uploaded even when the gate is red — that is
      # exactly when somebody needs it.
      #
      # `--warn-only` keeps the measurement and stops the blocking until the
      # removal programme is over: #1808 and its children (#1810, #1815,
      # #1816, #1821, #1822, #1774, #1776, #1889) MOVE the files the
      # baseline is keyed on, and the baseline is lowered by one deliberate
      # `--update` when the last of them lands. The gate now knows a
      # relocated group (same shape, same copy count, same method names), so
      # a move is not a finding any more — but the programme is still in
      # flight, and the gate comes back to blocking with that final
      # `--update`, not before. The findings are printed as WARN and the job
      # goes green; the blocking default of the script is unchanged.
      - name: Check the test tree for duplicated bodies
        run: python3 tools/check-test-dup.py --min-files 800 --min-methods 9000 --json-out test-dup-groups.json --warn-only
      - name: Upload the duplicate-group list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-dup-groups
          path: test-dup-groups.json
          retention-days: 7

  # #1847. The SECOND duplication detector, and the one that covers the
  # ground the python gate above cannot see.
  #
  # `check-test-dup.py` matches duplicated TEST METHOD BODIES, and only
  # method bodies: it slices a body out of the file, normalises it and
  # hashes it. What it cannot see is duplication that is not a method body —
  # a duplicated record declaration, a duplicated nested class, a duplicated
  # interface implementation, a duplicated file header — and what it cannot
  # see at all is the PRODUCT code: it scans `tests/` and nothing else.
  #
  # jscpd 5.4.1 (MIT, a self-contained Rust binary) is the second detector:
  # it matches token windows, so a whole block of code that was copied is one
  # clone, and it scans the whole maintained C# surface. Measured on
  # `origin/dev`: the python gate finds 206 groups / 2987 duplicated lines
  # in `tests/`, jscpd finds 286 clones / 8353 duplicated lines over
  # `src/` + `apps/` + `tests/`, and the two overlap on 1965 lines. Neither
  # is a subset of the other: jscpd flags 94 files the python gate does
  # not, the python gate flags 113 files jscpd does not.
  #
  # WHY THE RULE IS A TOTAL AND NOT jscpd's OWN `--fail-on-new-clones`
  # jscpd ships a baseline gate, and it was measured on 13 real commits of
  # `dev` before it was ruled out. Its baseline is keyed on a CONTENT HASH
  # of each clone, so editing a duplicated body changes the hash and the
  # edit is reported as new duplication: commit 8bde0944 changed one line
  # in each of two files that already duplicated each other and jscpd
  # reported 4 new clones, 3 of them pairs that were already clones BEFORE
  # the commit. The gate was red on 1 of those 13 commits (3 with the
  # `renamed` configuration), and every one of them was ordinary work that
  # added no duplication. The python gate was written to avoid exactly
  # that: it compares the MEMBERS of a group, never the text of the bodies.
  #
  # So the rule here is the aggregate one the python gate also has
  # (DUP-GROWTH): the tree's duplicated LINES must not exceed the number
  # `tools/jscpd-baseline.json` records. Measured on the same 13 commits,
  # that number moved only when the tree really changed, and it did not
  # move at all when a duplicated body was edited — which is the property
  # the fingerprint baseline lacks.
  #
  # The floors are a ratchet, like the ones above. 1971 files are analysed
  # today; the floor is 1700, because the programme is about to REMOVE test
  # code, and a floor set AT the measured count would go red on the removal
  # PRs themselves. A PR that really removes files lowers it in the same
  # diff, where a reviewer sees it.
  #
  # The binary is downloaded from the release, sha256-pinned per platform
  # inside `tools/check-dup-jscpd.py`, and it is a build-time tool: it never
  # reaches the product, and no `PackageReference` is added, so the
  # dependency gate does not see it.
  merge-loss:
    name: local squash-merges dropped nothing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gate needs the pull request's HEAD commit to know what the pull
      # request intended, and it reads that SHA out of the merge commit's
      # body. GitHub keeps `refs/pull/<n>/head` for every pull request ever
      # merged, so one fetch per merge brings the heads in. A head that is
      # missing makes the gate ERROR rather than skip: a gate that cannot
      # see a merge is a gate that is blind to it.
      - name: Fetch the pull request heads the history names
        run: |
          set -eu
          git fetch --no-tags --quiet origin \
            "+refs/heads/dev:refs/remotes/origin/dev"
          for pr in $(git log --first-parent --format=%B origin/dev \
                      | grep -o 'Squash-merged into dev (PR #[0-9]*' \
                      | grep -o '[0-9]*' | sort -u); do
            git fetch --no-tags --quiet origin \
              "+refs/pull/$pr/head:refs/remotes/pull/$pr/head" || true
          done
      - name: The local squash-merges dropped nothing
        run: >-
          tools/bin/harbor-gates-linux-x64 check-local-merge-loss
          --range origin/dev --tip HEAD --min-merges 1
          --allow-missing-heads

  # #1823. Ninth question, and the only one about the LISTS rather than
  # about the test bodies: does every test project in the solution actually
  # run in CI?
  #
  # The shard lists in ci.yml are hand-written. There are six of them across
  # two workflow files, plus a derived list in the NUKE `Test` target, and
  # nothing compared them against the tree.
  #
  # The obvious question has the wrong answer, and the repository says so:
  # TUnit discovers a REFERENCED test project's classes in every project
  # that references it (tests/Harbor.E2E.App.Avalonia/E2eShards.cs, and the
  # TRX of run 39399653820, where 26 of Harbor.E2E.App.Avalonia's 133
  # tests are Harbor.E2E.Framework.StateTestRunnerTests). So a test project
  # reaches a CI run through its OWN list entry OR through a listed project
  # that references it, and the gate has to count both.
  #
  # What the gate finds on dev@8be16392, with 43 .csproj under tests/ and 38
  # test projects carrying tests:
  #
  #   * every one of the 38 is discovered by some CI run, so nothing is
  #     silently unrun -- the hole the issue was filed about does not
  #     exist in the shape the issue described;
  #   * Harbor.E2E.Framework's 26 tests run SIX times per CI run, in each
  #     of the six listed projects that reference it: 156 executions of 26
  #     tests, about 1.06 s of duplicated test time;
  #   * Harbor.Ipc.Tests references that framework and names none of its
  #     types, so the reference buys nothing: 13 product assemblies dragged
  #     into the IPC closure, and a sixth copy of the 26 tests;
  #   * Harbor.Terminal.Abstractions.Tests references Harbor.TestKit and
  #     names none of its types: 4 product assemblies dragged in for
  #     nothing;
  #   * Harbor.TestKit.Tests references Harbor.TestKit and names none of
  #     its types, a leftover of the TestKit split: 16 product assemblies
  #     dragged in for nothing;
  #   * Harbor.E2E.App.Avalonia defines the two-process split (E2eShards)
  #     that would put the framework's tests in one shard, and CI runs the
  #     project once without a filter, so the partition is dead code.
  #
  # WHY THIS JOB LIVES HERE AND NOT IN ci.yml: the gate is stdlib python
  # with no SDK, no restore and no build, and this workflow is the one that
  # stays SDK-free. It reads ci.yml and test-os.yml as FILES, so the lists
  # it checks living in a different workflow is not a problem. A job in
  # ci.yml would inherit ci.yml's change filter and would be skipped on the
  # PRs where a new test project is added, which is exactly the PR the gate
  # exists for.
  #
  # The floors are a ratchet, set AT the measured counts rather than below
  # them: a floor with slack cannot tell "the tree got smaller" from "the
  # matcher stopped matching". Measured on this tree: 43 .csproj under
  # tests/, 38 test projects carrying tests, 7 CI lists, 37 distinct
  # projects the lists name, 41 projects discovered by a CI run. A PR that
  # legitimately removes a project lowers them in the same diff, where a
  # reviewer sees it.
  #
  # The gate runs in BASELINE MODE: the holes the tree has today are
  # recorded in tools/test-project-baseline.txt, one row per hole with a
  # reason and an owner, and only NEW holes fail. A gate that is red on
  # today's tree is a gate nobody lands, and a gate nobody lands protects
  # nothing. The baseline is a ratchet in both directions: a row the tree
  # no longer produces fails too, so a closed hole cannot stay blessed.
  #
  # The non-vacuity proof is the gate's own --self-test, run in the
  # `selftest` job above.

  dupjscpd:
    name: duplication (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The base ref is the PR's base commit, and the new-clone delta is
          # measured against it. Depth 1 has no base commit.
          fetch-depth: 0
      - name: Measure the duplicated code with jscpd
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=""
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$base" ]; then
            python3 tools/check-dup-jscpd.py --run --report jscpd-report.json --baseline-ref "$base"
          else
            python3 tools/check-dup-jscpd.py --run --report jscpd-report.json
          fi
      # The report is the work list: every clone with its file, its line
      # range and its size, which is what the next duplication ticket needs.
      # It is uploaded even when the gate is red — that is exactly when
      # somebody needs it.
      - name: Upload the clone report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jscpd-clones
          path: jscpd-report.json
          retention-days: 7

  # #1822. Tenth question, and the only one about the SERIALIZER the test
  # tree uses: does every `JsonSerializer` call under `tests/` name a
  # source-generated type info, or does it take the reflection resolver?
  #
  # The product side of System.Text.Json already rides source generation
  # (21 contexts under `src/`). The test side did not: 62 calls were taking
  # the reflection path, and a reflection call in a test is a test that can
  # stay green while the product is broken — a misspelled member name
  # compiles, serializes to a DIFFERENT key, and the assertion checks the
  # wrong field.
  #
  # The gate is BLOCKING (unlike the duplication measurement above, which is
  # `--warn-only` while its removal programme is in flight): the exceptions
  # file is a ratchet with five rows, and it can only shrink.
  reflection-json:
    name: reflection JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check that no test serializes through the reflection resolver
        run: python3 tools/check-test-json-reflection.py

  # #1575. Eleventh question, and the only one about DISPATCH: does the
  # product answer a question by comparing a string literal in a `case`
  # ladder, and is every ladder that is still there named in the exceptions
  # file with a reason?
  #
  # The issue filed the shape as boilerplate: 152 `case "..."` labels under
  # `src/` and `apps/`, of which 47 lived in one file (the CellForge key-spec
  # parser) and answered two questions -- "which modifier?" and "which key?"
  # -- from two case ladders. The replacement is a `FrozenDictionary` table,
  # and the argument for it is not the lookup speed (the compiler already
  # hash-optimises a large string switch): it is that the vocabulary has ONE
  # owner, so a key added to one ladder and not its twin cannot happen.
  #
  # That argument only holds if nothing else is allowed to grow a second
  # ladder over the same strings, which is what this gate is for. It runs in
  # BASELINE MODE: the ladders the tree has today are recorded in
  # tools/string-switch-exceptions.txt, one row per ladder with a reason, and
  # only NEW ladders fail. The file is a ratchet in both directions: a row
  # the tree no longer produces fails too, so a closed hole cannot stay
  # blessed.
  #
  # The floors are a ratchet, like the ones above. Measured on this tree:
  # 17 statement-form switches, 84 statement labels, 46 expression-form
  # switches, 238 expression labels -- 322 string labels in all. The floor is
  # set below the measured count, because this gate's whole purpose is to
  # make that count go DOWN; a scanner that stopped matching would report a
  # clean tree, and a clean tree is the one answer this gate must never give
  # by accident.
  #
  # The non-vacuity proof is the gate's own --self-test (a planted string
  # switch is found, an unlisted switch fails, a stale row fails and the
  # floor fails), run in the `selftest` job above.
  stringswitch:
    name: string switch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check that every string-dispatched switch is listed
        run: python3 tools/check-string-switch.py --check --min-labels 280

  # #1823. Ninth question, and the only one about the LISTS rather than
  # about the test bodies: does every test project in the solution actually
  # run in CI?
  #
  # The shard lists in ci.yml are hand-written. There are six of them across
  # two workflow files, plus a derived list in the NUKE `Test` target, and
  # nothing compared them against the tree.
  #
  # The obvious question has the wrong answer, and the repository says so:
  # TUnit discovers a REFERENCED test project's classes in every project
  # that references it (tests/Harbor.E2E.App.Avalonia/E2eShards.cs, and the
  # TRX of run 39399653820, where 26 of Harbor.E2E.App.Avalonia's 133
  # tests are Harbor.E2E.Framework.StateTestRunnerTests). So a test project
  # reaches a CI run through its OWN list entry OR through a listed project
  # that references it, and the gate has to count both.
  #
  # What the gate finds on dev@8be16392, with 43 .csproj under tests/ and 38
  # test projects carrying tests:
  #
  #   * every one of the 38 is discovered by some CI run, so nothing is
  #     silently unrun -- the hole the issue was filed about does not
  #     exist in the shape the issue described;
  #   * Harbor.E2E.Framework's 26 tests run SIX times per CI run, in each
  #     of the six listed projects that reference it: 156 executions of 26
  #     tests, about 1.06 s of duplicated test time;
  #   * Harbor.Ipc.Tests references that framework and names none of its
  #     types, so the reference buys nothing: 13 product assemblies dragged
  #     into the IPC closure, and a sixth copy of the 26 tests;
  #   * Harbor.Terminal.Abstractions.Tests references Harbor.TestKit and
  #     names none of its types: 4 product assemblies dragged in for
  #     nothing;
  #   * Harbor.TestKit.Tests references Harbor.TestKit and names none of
  #     its types, a leftover of the TestKit split: 16 product assemblies
  #     dragged in for nothing;
  #   * Harbor.E2E.App.Avalonia defines the two-process split (E2eShards)
  #     that would put the framework's tests in one shard, and CI runs the
  #     project once without a filter, so the partition is dead code.
  #
  # WHY THIS JOB LIVES HERE AND NOT IN ci.yml: the gate is stdlib python
  # with no SDK, no restore and no build, and this workflow is the one that
  # stays SDK-free. It reads ci.yml and test-os.yml as FILES, so the lists
  # it checks living in a different workflow is not a problem. A job in
  # ci.yml would inherit ci.yml's change filter and would be skipped on the
  # PRs where a new test project is added, which is exactly the PR the gate
  # exists for.
  #
  # The floors are a ratchet, set AT the measured counts rather than below
  # them: a floor with slack cannot tell "the tree got smaller" from "the
  # matcher stopped matching". Measured on this tree: 43 .csproj under
  # tests/, 38 test projects carrying tests, 7 CI lists, 37 distinct
  # projects the lists name, 41 projects discovered by a CI run. A PR that
  # legitimately removes a project lowers them in the same diff, where a
  # reviewer sees it.
  #
  # The gate runs in BASELINE MODE: the holes the tree has today are
  # recorded in tools/test-project-baseline.txt, one row per hole with a
  # reason and an owner, and only NEW holes fail. A gate that is red on
  # today's tree is a gate nobody lands, and a gate nobody lands protects
  # nothing. The baseline is a ratchet in both directions: a row the tree
  # no longer produces fails too, so a closed hole cannot stay blessed.
  #
  # The non-vacuity proof is the gate's own --self-test, run in the
  # `selftest` job above.
  testprojects:
    name: test project coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every test project is discovered by a CI run
        run: python3 tools/check-test-projects.py --min-projects 43 --min-tested 38 --min-lists 7 --min-claims 37 --min-contexts 41

  # #1781. Twelfth question, and the only one about the LAYOUT of the test
  # shards rather than about the tests in them: are the shards balanced by
  # what their projects cost?
  #
  # The shard matrix was laid out by MODULE, and the layout came out 5.96x
  # skewed: on dev@b9f3c83c (run 39504714459) the `core` shard ran 143 s
  # against the `e2e` shard's 24 s, and 91 s of the `core` shard was ONE
  # project (Harbor.Architecture.Tests) next to thirteen that together cost
  # 37 s. The pull request waits for the MAXIMUM shard (issue #1929 measured
  # it), so the whole run waited for that one project.
  #
  # The gate reads the shard lists out of ci.yml and the recorded cost of
  # every project out of tools/shard-costs.json, computes what each shard
  # would cost, and fails when the heaviest and the lightest are more than
  # --max-skew apart. It does NOT measure time: the house policy says a gate
  # that measures time is a benchmark, because a threshold on a live wall
  # clock fails on a slow runner and a gate that fails on a slow runner gets
  # switched off. What it judges is the LAYOUT, by a recorded measurement.
  #
  # The floor is on how many projects the shards run between them: a gate
  # that read fewer projects than that cannot judge the layout, and a scan
  # that matches nothing must not report "balanced". Measured on this tree:
  # 37 projects across 5 shards.
  #
  # The non-vacuity proof is the gate's own --self-test (a runaway shard
  # fails, a duplicated project fails, a stale cost fails), run in the
  # `selftest` job above.
  shardbalance:
    name: shard balance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check that the CI test shards are balanced by cost
        run: tools/bin/harbor-gates-linux-x64 check-shard-balance --min-projects 37 --max-skew 4.0

  # #1780. The parameter schema of a tool is the tool's contract with the
  # model: the JSON the model may send. It is declared once, as [ToolParam]
  # attributes on the tool class, and the compiler renders it and compares
  # the result with the pin in src/Harbor.Tools.Builtin/Schemas/.
  #
  # This job asks the same question the compiler asks, in a place that needs
  # no SDK: the generator refuses to compile a tool whose schema differs
  # from its pin, and this job checks the same pin without a build — so the
  # rule has a reader on a pull request that does not compile. The
  # self-test in the `selftest` job above plants a divergence and requires
  # the analysis to find it.
  #
  # The floor is the number of tools that declare a schema: a scan that
  # measured fewer than that cannot say the tree is fine.
  tool-schema:
    name: tool-schema pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: The pinned tool schemas agree with the declarations
        run: python3 tools/check-tool-schema-pin.py --min-tools 25

  # #431 (slice D3). XML-doc coverage gate for the frozen contract assembly.
  #
  # `Directory.Build.props` keeps CS1591 in NoWarn, so the compiler never asks
  # whether a public member of Harbor.Abstractions.Contracts carries an XML
  # doc — and the D2 metadata lane turns those docs into the published API
  # reference, so a silent gap ships silently. This job asks the question
  # instead, with stdlib python only (no SDK, this workflow stays dotnet-free).
  #
  # The gate is zero-tolerance on top of an explicit suppression list, not a
  # bare percentage: every public/protected declaration, enum value, and
  # implicit interface member must carry `///` (or `<inheritdoc/>`) or an entry
  # in SUPPRESSED with a reason. Any single undocumented, unsuppressed member
  # fails the job — the first gap goes red. Every suppression must match
  # exactly one currently-undocumented member, so documenting one means
  # dropping its entry in the same diff, where a reviewer can see it.
  #
  # The floors are a ratchet, like the ones above. Measured on this tree:
  # 493 members, 478 documented (97.0%, floor 0.96), 15 suppressed (−8
  # GetEqualityComponents <inheritdoc/> rows via #1559 records). The count
  # floors are set AT those values, not below: a floor with slack cannot tell
  # "the surface got smaller" from "the matcher stopped matching". The
  # non-vacuity proof is the gate's own --self-test (one undocumented member
  # fails, naming it), run in the `selftest` job above.
  xmldoc:
    name: xml-doc coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check XML-doc coverage of the frozen contract assembly
        run: tools/bin/harbor-gates-linux-x64 check-xml-doc-coverage --min-members 493 --min-documented 478 --min-coverage 0.96

  # #1731. Twelfth question, and the only one that asks whether a GENERATED
  # document still matches the tree it was generated from.
  #
  # The `gen-seam-graph` gate reads the C# sources and writes
  # `docs/SEAM_GRAPH.md`: the seam graph — who implements a seam, who extends
  # what implements it, who consumes it, who is registered in the container,
  # and where the seam is bypassed. The point of generating it rather than
  # writing it is that the document cannot drift: this job regenerates the
  # document and fails if the committed one differs.
  #
  # The floors are a ratchet on the SCAN SIZE, like the floors above: a scan
  # that silently stopped covering the tree would produce a document that
  # agrees with itself and says nothing. Measured on this tree: the C# files
  # under src/, apps/, tests/ and samples/, and the interfaces declared under
  # src/.
  #
  # The gate reads the C# tree (and the .csproj files), so it is triggered by
  # a change to any of them as well as by a change to the generator or to the
  # document.
  #
  # The non-vacuity proof is the gate's own --self-test (a stale document
  # fails, a freshly generated one passes, and the route grader tells a
  # registering route from a refusing one), run in the `selftest` job above.
  seamgraph:
    name: seam graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check the committed seam graph matches the tree
        run: tools/bin/harbor-gates-linux-x64 gen-seam-graph --check --min-files 2523 --min-interfaces 191

  # #1888. Eleventh question, and the only one about the gates themselves:
  # not "do the links resolve" and not "is the file shaped right" and not
  # "does the count match" and not "is every dependency declared", but "does
  # the table of gates in docs/CI_GATES.md still describe the gates this
  # repository actually runs".
  #
  # A policy in prose decays: a gate is added, the table is not, and a year
  # later the table describes a repository that does not exist. #933 measured
  # that class on this repository (the builtin tool count was stated 16 times
  # with six different values), and the cure that was buildable for a count
  # is buildable for a table.
  #
  # The checker compares three sources — the table, the scripts in tools/ and
  # the workflow files — and fails when they disagree. The rules it enforces
  # are in docs/CI_GATES.md; the ones no file can answer (what a gate checks,
  # that its message names the violator) are stated there as review rules.
  #
  # The floor is a ratchet, set AT the measured row count rather than below
  # it: a table that lost rows because a gate was deleted would otherwise
  # shrink quietly, and a policy that covers fewer gates than the repository
  # runs is the #591 shape. The non-vacuity proof is the checker's own
  # --self-test, run in the `selftest` job above.
  gate-policy:
    name: gate policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check the gate table against the tools and the workflows
        run: python3 tools/check-gate-policy.py --min-gates 42

  # #1558. The chain census, and the ratchet on it.
  #
  # Issue #1558 asks for the `if (x.IsFailure) return …; var v = x.Value;`
  # shape to become a CSharpFunctionalExtensions `.Bind()` / `.Map()` chain.
  # What it must not do is leave the number that says how many are left in a
  # comment nobody can re-derive: the census is a script, and the script is
  # what CI runs.
  #
  # The gate is a RATCHET on the count of chain candidates — the guard sites a
  # chain could actually replace. A NEW candidate turns the job red; a
  # translated one lowers the count and stays green, so the ratchet only moves
  # in the direction the issue wants. The baseline records the count the tree
  # had when this landed; every site the census leaves is a site somebody read
  # and decided to keep.
  #
  # The census classifies every guard site, so it also says WHY a site is not
  # a candidate: a guard whose body logs or has a side effect, a guard that
  # does not return a Result at all, a terminal guard with nothing unwrapped
  # after it. The script's own --self-test is the non-vacuity proof and runs
  # in the `selftest` job above.
  result-chains:
    name: result-chain ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: The chain-candidate count has not gone up
        run: python3 tools/check-result-chains.py --check --baseline tools/result-chains-baseline.json

  # #428 (first slice) — GONE as a job, kept as a gate (#1845).
  #
  # The public-API freeze of the contract assembly was a python text scan
  # with its own job here. It is now a COMPILE-time gate:
  # Microsoft.CodeAnalysis.PublicApiAnalyzers reports RS0016/RS0017 while
  # Harbor.Abstractions.Contracts compiles, so the freeze fails the build
  # job in ci.yml and needs no runner of its own. The analyzer's baseline
  # lives next to the code it describes
  # (src/Harbor.Abstractions.Contracts/PublicAPI.Shipped.txt).
  #
  # What is left of the old gate is the half the compiler cannot see — the
  # re-signing pairing, which is about a commit and not about a tree — and
  # it runs in the ci.yml `public-api` job together with the compile gate's
  # non-vacuity proof.

  # #1722. The only question here that is about the PLUGIN composition:
  # does the committed snapshot still describe the tree it was generated from?
  #
  # The plugin composition was spread over three places — the axis registry,
  # the route registry and the host's log lines — and none of them could be
  # read by a program. `docs/PLUGIN_INVENTORY.json` is the one document that
  # can: the axes, the per-route verdicts, and the plugins the repository
  # ships, in the same schema the product writes at runtime for the LIVE
  # composition.
  #
  # The gate is stdlib python with no SDK, so it lives here with the other
  # document gates. It reads the two registries, the sample plugins and the
  # product's own writer as FILES.
  #
  # It checks three things: that the committed document matches the tree, that
  # the floors are met (a scan that stopped covering the tree would produce a
  # document that agrees with itself and says nothing), and that the two
  # producers agree on the SCHEMA — a member the product renamed is a member
  # a consumer of the document would not find any more.
  #
  # The non-vacuity proof is the gate's own --self-test (a stale document
  # fails, a fresh one passes, a renamed member fails), run in the `selftest`
  # job above.
  plugininventory:
    name: plugin inventory snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The floors are set AT the measured counts rather than below them: a
      # floor with slack cannot tell "the tree got smaller" from "the matcher
      # stopped matching". Measured on this tree: 7 axes, 7 route verdicts,
      # 6 shipped plugins.
      - name: Check the committed plugin inventory against the tree
        run: python3 tools/gen-plugin-inventory.py --check --min-axes 7 --min-routes 7 --min-plugins 6

  # The workflow gate. A workflow file with a DUPLICATE KEY in a mapping is a
  # file GitHub refuses to parse, and the refusal is silent from the
  # repository's point of view: the run is created, it has ZERO jobs, and it
  # closes as "failure" with the text "This run likely failed because of a
  # workflow file issue". The lane is not red — it is ABSENT — and every pull
  # request that waits for it waits forever.
  #
  # It happened here. On 2026-10-21 the `ci` workflow stopped running at all:
  # runs 39627731779 and 39627783779 had zero jobs, and the run before them
  # (39613662649) had sixteen. The commit that broke it (e7479b9a, #2115)
  # gave three shard-reporting steps an arm64 twin and wrote the twin as a
  # second `if:`/`shell:`/`run:` inside the first step's mapping.
  #
  # THIS job lives in the documentation lane on purpose: a gate that polices
  # `ci.yml` cannot live in `ci.yml`, because a broken `ci.yml` takes its own
  # gate with it. The documentation lane starts on every pull request, with or
  # without a .NET build.
  #
  # The floor is the number of workflow files the tree holds (17), so a scan
  # that stopped matching the tree drives the number down and this job goes
  # red instead of reporting a clean tree.
  workflows:
    name: workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check that no workflow file declares a key twice
        run: tools/bin/harbor-gates-linux-x64 check-workflows --min-files 17

  # #431 (slice 1). Docs-site assembly from the existing markdown tree.
  #
  # docfx.json is the manifest (metadata lane + content globs + nav); this job
  # validates it (strict JSON, every content glob resolves to >=1 tracked file,
  # every docs/toc.yml href exists, every metadata src project file exists with
  # dest api, the global GenerateDocumentationFile flag stays on) and assembles
  # a static `_site` (copied markdown + generated index) with stdlib python
  # only — no SDK, no docfx binary, so this workflow stays dotnet-free.
  # The full `docfx build` with generated API pages (api/*.yml) is a later
  # slice (ADR-017); the XML-doc coverage gate is the `xmldoc` job above.
  # Internal links inside the
  # assembled site are covered by the `links` job above, which runs on the same
  # tree and the same trigger paths — no second link checker is introduced here.
  #
  # The artifact needs no secrets and no extra permissions (upload-artifact
  # rides `contents: read`). GitHub Pages publishing lives in the `deploy` job
  # below: master-only behind the HARBOR_PAGES_ENABLED opt-in.
  site:
    name: docs site assembly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate docfx.json manifest
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys
          with open('docfx.json', encoding='utf-8') as f:
              manifest = json.load(f)
          globs = [e['files'] for e in manifest['build']['content']]
          assert manifest['build']['dest'] == '_site', 'dest must stay _site'
          pages = set()
          for group in globs:
              for pattern in group:
                  # include_hidden: docs/.kilo-docs/ holds 48 tracked md files
                  # and a glob that silently skips a dot-directory is the #509
                  # shape (green by never scanning). Measured with it: 210 pages.
                  hits = [p for p in glob.glob(pattern, recursive=True,
                                               include_hidden=True)
                          if os.path.isfile(p)]
                  assert hits, f'content glob resolves to nothing: {pattern}'
                  pages.update(hits)
          md = sorted(p for p in pages if p.endswith('.md'))
          # Floor (~20% below the 205 pages measured on dev@b7fb67c): a glob
          # that silently stops matching must go red, not quiet (the #509 shape).
          assert len(md) >= 160, f'site covers only {len(md)} md pages'
          import re
          toc = open('docs/toc.yml', encoding='utf-8').read()
          hrefs = re.findall(r'^\s+href:\s+(\S+)\s*$', toc, re.M)
          assert hrefs, 'docs/toc.yml carries no hrefs'
          top = sorted(os.path.basename(p) for p in
                       glob.glob('docs/*.md'))
          missing = [f for f in top if f not in hrefs]
          assert not missing, f'toc.yml misses {len(missing)} docs/*.md'
          # #431 (slice 2). Metadata lane: every listed project file must exist,
          # dest must stay api, the API landing page must be tracked, and the
          # global documentation flag must stay on. A moved project, a dropped
          # lane, or a removed flag must go red here — not silently shrink the
          # API reference (the #509 shape: green by never scanning).
          meta = manifest.get('metadata', [])
          assert len(meta) == 1, f'expected 1 metadata entry, got {len(meta)}'
          assert meta[0].get('dest') == 'api', 'metadata dest must stay api'
          for entry in meta[0].get('src', []):
              for proj in entry.get('files', []):
                  assert os.path.isfile(proj), f'metadata src missing: {proj}'
          assert os.path.isfile('api/index.md'), 'api/index.md is not tracked'
          props = open('Directory.Build.props', encoding='utf-8').read()
          assert '<GenerateDocumentationFile>true</GenerateDocumentationFile>' \
              in props, 'GenerateDocumentationFile must stay globally true'
          nsrc = sum(len(e.get('files', [])) for e in meta[0].get('src', []))
          print(f'OK: {len(md)} md pages, toc covers {len(top)} docs/*.md, '
                f'metadata covers {nsrc} projects')
          EOF
      - name: Assemble static _site from existing markdown
        run: |
          python3 - <<'EOF'
          import glob, html, json, os, shutil
          with open('docfx.json', encoding='utf-8') as f:
              manifest = json.load(f)
          dest = manifest['build']['dest']
          shutil.rmtree(dest, ignore_errors=True)
          pages = []
          for group in manifest['build']['content']:
              for pattern in group['files']:
                  for p in sorted(glob.glob(pattern, recursive=True,
                                            include_hidden=True)):
                      if not os.path.isfile(p):
                          continue
                      target = os.path.join(dest, p)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      shutil.copyfile(p, target)
                      if p.endswith('.md'):
                          pages.append(p)
          assert len(pages) >= 160, f'assembled only {len(pages)} pages'
          items = '\n'.join(
              f'      <li><a href="{html.escape(p)}">{html.escape(p)}</a></li>'
              for p in sorted(pages))
          index = ('<!doctype html>\n<html lang="en">\n<head>\n'
                   '<meta charset="utf-8">\n'
                   '<title>Harbor docs</title>\n</head>\n<body>\n'
                   f'<h1>Harbor docs ({len(pages)} pages)</h1>\n'
                   '<ul>\n' + items + '\n</ul>\n</body>\n</html>\n')
          with open(os.path.join(dest, 'index.html'),
                    'w', encoding='utf-8') as f:
              f.write(index)
          print(f'OK: _site holds {len(pages)} md pages + index.html')
          EOF
      - name: Upload _site artifact (no secrets)
        uses: actions/upload-artifact@v7
        with:
          name: harbor-docs-site
          path: _site
          retention-days: 7

  # #431 (slice 2). GitHub Pages publishing for the assembled static site.
  #
  # Runs ONLY on master AND only when the repo variable HARBOR_PAGES_ENABLED
  # is 'true'. Pages is not enabled on this repo yet (no Pages site exists,
  # default branch is master), and configure-pages fails when Pages is off —
  # an unconditional lane would turn the first master push red on a head
  # nobody broke. The opt-in keeps every head green: the owner enables Pages
  # (Settings -> Pages -> source "GitHub Actions") and sets the variable, and
  # the next master push publishes. PRs and dev pushes skip by the `if`.
  # `needs` is links + lint + site so a broken link or a shrunk manifest
  # blocks the publish, not just the assembly. The full `docfx build` with
  # generated api/*.yml member pages is still a later slice (ADR-017) — this
  # publishes the same static _site the job above assembles, no SDK involved.
  deploy:
    name: publish to GitHub Pages
    if: github.ref == 'refs/heads/master' && vars.HARBOR_PAGES_ENABLED == 'true'
    needs: [links, lint, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble static _site from existing markdown
        run: |
          python3 - <<'EOF'
          import glob, html, json, os, shutil
          with open('docfx.json', encoding='utf-8') as f:
              manifest = json.load(f)
          dest = manifest['build']['dest']
          shutil.rmtree(dest, ignore_errors=True)
          pages = []
          for group in manifest['build']['content']:
              for pattern in group['files']:
                  for p in sorted(glob.glob(pattern, recursive=True,
                                            include_hidden=True)):
                      if not os.path.isfile(p):
                          continue
                      target = os.path.join(dest, p)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      shutil.copyfile(p, target)
                      if p.endswith('.md'):
                          pages.append(p)
          assert len(pages) >= 160, f'assembled only {len(pages)} pages'
          items = '\n'.join(
              f'      <li><a href="{html.escape(p)}">{html.escape(p)}</a></li>'
              for p in sorted(pages))
          index = ('<!doctype html>\n<html lang="en">\n<head>\n'
                   '<meta charset="utf-8">\n'
                   '<title>Harbor docs</title>\n</head>\n<body>\n'
                   f'<h1>Harbor docs ({len(pages)} pages)</h1>\n'
                   '<ul>\n' + items + '\n</ul>\n</body>\n</html>\n')
          with open(os.path.join(dest, 'index.html'),
                    'w', encoding='utf-8') as f:
              f.write(index)
          print(f'OK: _site holds {len(pages)} md pages + index.html')
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
