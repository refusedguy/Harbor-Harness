# Harbor docs gate — markdown only, no dotnet.
#
# WHY THIS FILE EXISTS (issue #509)
#
#   `tools/check-md-links.py` has been in the repo since #39 hygiene and has
#   never run in CI. ci.yml lists `**.md` and `docs/**` in `paths-ignore` for
#   both `push` and `pull_request`, so a docs-only PR never starts a build and
#   therefore never reached the checker. A gate in a workflow that cannot
#   trigger is worse than no gate: it looks like the links are checked.
#
#   That is the third instance of the same failure in this repo — the other
#   two were three test projects missing from Harbor.slnx and the CI matrix
#   (#519), and NetArchTest rules naming a deleted assembly, where a
#   non-existent name reads as a *satisfied* constraint (#450).
#
#   So the fix is a second, cheap workflow rather than a change to ci.yml:
#   docs-only PRs get a real signal in ~30s instead of a full .NET build, and
#   ci.yml keeps its paths-ignore. Do not "fix" this by deleting those entries
#   from ci.yml — that would rebuild the entire solution for a typo in a
#   paragraph, and this file would still be the only thing that lints markdown.
#
# WHAT RUNS HERE
#
#   selftest  all four gates against fixtures that are known-broken. A checker
#             that has quietly stopped finding anything is still green on every
#             PR, so the failure path is tested on every docs change.
#   links     internal link + GitHub anchor resolution, with a file/ref floor.
#   cites     `file:line` in a normative document resolves, and a type it names
#             is constructed by something (#664).
#   facts     a COUNT the onboarding documents state still equals the count of
#             tracked files it is counting (#933). This is the only one of the
#             four that asks a numeric question, and it is deliberately not a
#             cross-check between the copies of a prose fact: measured, that
#             gate is red on dated records and green on the live defect. The
#             `facts` job's comment carries the measurement.
#   lint      markdown structural invariants, with a file/line floor.
#
# THE FLOORS ARE THE POINT
#
#   `--min-files` / `--min-refs` / `--min-lines` make a narrowed scan fail
#   instead of passing quietly. They are set ~20% below today's numbers (310
#   markdown files, 770 link refs, 74109 lines) and are a ratchet: a PR that
#   legitimately removes documents lowers them in the same diff, where a
#   reviewer can see it. A script that scans zero paths and exits 0 is the
#   same failure mode this gate exists to end.
#
#   There is no allow-list of files to skip, and no `continue-on-error`: a
#   broken link in a docs-only PR must be red, not a note in the log.
#
# NOT a dotnet job: nothing here needs the SDK, the solution, or a submodule
# (no tracked markdown lives in external/ConsoleEx). If that changes, add
# `submodules: recursive` to the checkout below.
name: docs

on:
  push:
    branches: [dev, master]
    paths:
      - '**.md'
      - 'tests/**/*.cs'
      - 'src/**/*.cs'
      - 'apps/**/*.cs'
      # #428. `check-abstractions-contract.py` reads four guarded projects'
      # .csproj files and the .cs they compile. A csproj is how a dependency
      # enters this repository, so a workflow that watched only .cs could not
      # trigger on the change the gate exists to catch — the #509 failure (a
      # gate made green by never running) wearing a different hat. Same for
      # Directory.Packages.props, which is where a version is pinned.
      - 'src/**/*.csproj'
      - 'Directory.Packages.props'
      - 'tools/check-md-links.py'
      - 'tools/md-lint.py'
      - 'tools/check-doc-cites.py'
      - 'tools/check-doc-facts.py'
      - 'tools/md_gate.py'
      - 'tools/check-abstractions-contract.py'
      # #431. docfx.json is the docs-site manifest and docs/toc.yml is its nav:
      # a PR that touches either must run the assembly + link gates below.
      - 'docfx.json'
      - 'docs/toc.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      # #947. TEST-CITE-DRIFT reads `tests/**/*.cs`, so a PR that inserts a
      # line above a cited one — the only way this defect is ever created —
      # touches none of the paths above unless .cs is here. Without these three
      # the rule is unreachable on exactly the PRs it exists for, which is the
      # #509 failure (a `paths-ignore` that made a gate green by never running)
      # wearing a different hat.
      - 'tests/**/*.cs'
      - 'src/**/*.cs'
      - 'apps/**/*.cs'
      # #428. `check-abstractions-contract.py` reads four guarded projects'
      # .csproj files and the .cs they compile. A csproj is how a dependency
      # enters this repository, so a workflow that watched only .cs could not
      # trigger on the change the gate exists to catch — the #509 failure (a
      # gate made green by never running) wearing a different hat. Same for
      # Directory.Packages.props, which is where a version is pinned.
      - 'src/**/*.csproj'
      - 'Directory.Packages.props'
      - 'tools/check-md-links.py'
      - 'tools/md-lint.py'
      - 'tools/check-doc-cites.py'
      - 'tools/check-doc-facts.py'
      - 'tools/md_gate.py'
      - 'tools/check-abstractions-contract.py'
      # #431. Same trigger as above: the site manifest and its nav.
      - 'docfx.json'
      - 'docs/toc.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Anti-vacuity. Runs the gates against a throwaway git repo containing
  # documents that are deliberately broken, and asserts the specific
  # diagnostics. If someone edits a rule until it matches nothing, this is the
  # job that goes red — not the "everything is fine" jobs below.
  selftest:
    name: checker self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Link checker fails on a broken link
        run: python3 tools/check-md-links.py --self-test
      - name: Markdown lint fails on a malformed document
        run: python3 tools/md-lint.py --self-test
      # #664. The third gate is the only one that asks whether a `file:line`
      # in a normative document still points at a line, and whether a backticked
      # type is constructed by anything. Its failure path is tested here for
      # the same reason the other two are: a rule edited until it matches
      # nothing is indistinguishable from a rule that found nothing.
      - name: Citation checker fails on a stale file:line and an unwired type
        run: python3 tools/check-doc-cites.py --self-test
      # #933. The fourth gate is the only one that asks whether a COUNT the
      # onboarding documents state still equals the count of tracked files.
      # Its failure path is tested for the same reason as the other three: the
      # fixtures here include the two shapes that made a draft of this gate
      # wrong — a rule compared against the wrong population (green on a
      # number that is not the one in the document) and a rule whose capture
      # group was edited away (reported BLIND, the one verdict CI passes).
      - name: Repo-map counter fails on a stale count and detects its own blindness
        run: python3 tools/check-doc-facts.py --self-test
      # #428. The fifth gate is the only one that reads a `.csproj`, and the only
      # one that asks about a package rather than about a document: is every
      # PackageReference a guarded project declares load-bearing, and is every
      # non-BCL namespace its sources use declared. Its self-test carries fifteen
      # fixtures and six of them pin bugs this tool had while being written, so
      # its failure path is as much the point as its passing path. Every fixture
      # added after the first version was checked by mutation: it fails when its
      # own fix is reverted and the rest still pass. Two candidate mutations were
      # tried and found NOT reachable by any fixture, and the tool's comments say
      # so rather than implying coverage that is not there.
      - name: Guarded-project dependency gate fails on a phantom package
        run: python3 tools/check-abstractions-contract.py --self-test

  links:
    name: internal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every internal link and anchor
        run: python3 tools/check-md-links.py --min-files 250 --min-refs 600

  # #664. Same reasoning as the two jobs above, third question: not "does the
  # link resolve" and not "is the file shaped right" but "does the `file:line`
  # this document asserts still exist, and is the type it names still built".
  #
  # The floors are ~25% below today's numbers (2 normative documents, 143 line
  # citations, 68 backticked type names) and are a ratchet, like the ones above.
  # Scope is the `Status: normative` marker rather than every .md: measured over
  # the whole tree the same rules find 85 pre-existing violations in 24
  # non-normative documents, most of them archived sprint notes under
  # docs/.kilo-docs/ and PLAN.md files that state an intention, and a gate that
  # is red on 85 unrelated findings on day one is a gate that gets switched off.
  # Deleting the marker from a document shrinks the scanned set, which the floors
  # then catch.
  #
  # --min-counts 1 is the floor for DOC-COUNT-STALE, which is NOT opt-in: it
  # asks every document that has a `| path | line |` table whether its stated
  # total matches its own rows. Measured, exactly one document in the tree is
  # in that shape, so the rule is exception-free today; the floor is what keeps
  # it that way, since a COUNT_TOTAL matcher that quietly stopped matching would
  # be indistinguishable from a tree with nothing to ask.
  cites:
    name: normative citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # #947. `fetch-depth: 0` is load-bearing for TEST-CITE-DRIFT, and the
      # first run of this gate proved it: at the default depth of 1, `git blame`
      # attributes every line to the shallow boundary commit, so the "what did
      # this citation mean when it was written" comparison compares HEAD with
      # HEAD and finds nothing. The gate went from 87 findings to 21 and said
      # nothing about it — the mechanical classes kept working, the anchored one
      # went silently blind. A rule that cannot see is worse than no rule,
      # because the build stays green.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `--min-guide-usings` and `--min-base-lists` are the #564 floors. Both are
      # counts of things that are EXPECTED to shrink — the view seam closed, the
      # `Harbor.Tui.Abstractions` facade is gone — so the day the last plugin
      # guide stops fencing a `using` there is nothing left to check, and a rule
      # that goes quiet by succeeding is indistinguishable from one that went
      # quiet by breaking. The floors are what say which happened.
      #
      # The numbers are the tree's, measured not guessed: 3 guides / 37 `using`
      # lines and 2 base lists on dev@7aff0c87.
      - name: Check every normative file:line and named type
        run: python3 tools/check-doc-cites.py --min-files 2 --min-cites 100 --min-types 50 --min-api 12 --min-counts 1 --min-test-cites 200 --min-guide-usings 30 --min-base-lists 2

  lint:
    name: markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check markdown invariants
        run: python3 tools/md-lint.py --min-files 250 --min-lines 60000

  # #933. Fourth question, and the only one a copy-consistency gate could not
  # answer honestly: not "do the links resolve", not "is the file shaped
  # right", not "does the file:line exist" but "does a number the onboarding
  # documents state still equal the count of tracked files it is counting".
  #
  # The scope is AGENTS.md and CLAUDE.md, not every tracked markdown, and the
  # reason is the measurement rather than convenience. #933 asked for a gate
  # that cross-checks the COPIES of a fact, and measuring the tree says that
  # gate cannot be built for prose: the builtin tool count is stated 16 times
  # with six different values (4/5/7/14/20/26), and every divergent copy is a
  # document that has already declared itself historical — a CHANGELOG release
  # note, a "Historical plan (pre-sprint-2)", or docs/specs/, which #983
  # declared a dated record. A prose gate would be red on ten sites allowed to
  # be wrong and green on the live defect. A count is different: it either
  # equals the tree or it does not, and a record quoting an old count cannot
  # make the number agree.
  #
  # --min-facts is the floor. Measured today: 6 counts compared. The floor is
  # 5, so a rule that silently stops matching drives the number down and this
  # job goes red instead of reporting a clean tree — the #591 shape, which the
  # --self-test also pins from the other side.
  facts:
    name: repo-map counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every repo-map count against the tree
        run: python3 tools/check-doc-facts.py --min-facts 5

  # #428. Fifth question, and the only one about a package rather than a
  # document: not "do the links resolve", not "is the file shaped right", not
  # "does the file:line exist", not "does the count match", but "is every
  # dependency the two frozen contract projects declare actually reached".
  #
  # #428 asks for v1.0 to freeze the public API of Harbor.Abstractions +
  # Harbor.Abstractions.Contracts, and those two projects are the ones every
  # other assembly points inward at — so a dependency that lands in either is one
  # every consumer inherits. Measured on the tree this landed on: `AGENTS.md`
  # described the facade as "zero-dep (only CSharpFunctionalExtensions)", which is
  # 6 packages wrong, and `CommunityToolkit.HighPerformance` was declared and
  # reached by nothing at all.
  #
  # Both sides of every comparison are files: the PackageReference elements of the
  # two .csproj against the using directives of the .cs they compile. No document
  # is read, which is the #939 lesson applied rather than restated — a gate that
  # cross-checks copies of a prose fact is red on copies that are allowed to be
  # wrong and green on the live defect. This one measures the contract.
  #
  # The floors are a ratchet, like the ones above. Measured after this change:
  # 9 packages declared, 6 distinct external namespaces, 75 .cs files. The floors
  # are set AT those values, not below: this gate was introduced by a fix that
  # removed a declaration, so a floor below the post-fix count would have been a
  # floor that a re-added phantom still cleared. Lower them only in the same diff
  # that legitimately removes a dependency, where a reviewer can see it.
  contract:
    name: guarded project dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Floors are the ratchet, and they are set AT the measured counts rather
      # than below them — a floor with slack cannot tell "the tree got smaller"
      # from "the matcher stopped matching", and only the first of those is a
      # change a reviewer should have to look at. A PR that legitimately removes
      # a dependency lowers them in the same diff. Recomputed when the perimeter
      # widened to four projects (was 9 / 6 / 75 over two).
      - name: Check the guarded projects' declared dependencies
        run: python3 tools/check-abstractions-contract.py --min-packages 14 --min-namespaces 7 --min-files 152

  # #431 (slice 1). Docs-site assembly from the existing markdown tree.
  #
  # docfx.json is the manifest (content globs + nav); this job validates it
  # (strict JSON, every content glob resolves to >=1 tracked file, every
  # docs/toc.yml href exists) and assembles a static `_site` (copied markdown
  # + generated index) with stdlib python only — no SDK, no docfx binary, so
  # this workflow stays dotnet-free. The full `docfx build` with API metadata
  # (GenerateDocumentationFile + XML-doc coverage gate) is a later slice.
  # Internal links inside the assembled site are covered by the `links` job
  # above, which runs on the same tree and the same trigger paths — no second
  # link checker is introduced here.
  #
  # The artifact needs no secrets and no extra permissions (upload-artifact
  # rides `contents: read`). GitHub Pages publishing is deliberately NOT wired:
  # it needs pages:write / id-token and is a separate decision for the full
  # slice, not this one.
  site:
    name: docs site assembly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate docfx.json manifest
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys
          with open('docfx.json', encoding='utf-8') as f:
              manifest = json.load(f)
          globs = [e['files'] for e in manifest['build']['content']]
          assert manifest['build']['dest'] == '_site', 'dest must stay _site'
          pages = set()
          for group in globs:
              for pattern in group:
                  # include_hidden: docs/.kilo-docs/ holds 48 tracked md files
                  # and a glob that silently skips a dot-directory is the #509
                  # shape (green by never scanning). Measured with it: 205 pages.
                  hits = [p for p in glob.glob(pattern, recursive=True,
                                               include_hidden=True)
                          if os.path.isfile(p)]
                  assert hits, f'content glob resolves to nothing: {pattern}'
                  pages.update(hits)
          md = sorted(p for p in pages if p.endswith('.md'))
          # Floor (~20% below the 205 pages measured on dev@b7fb67c): a glob
          # that silently stops matching must go red, not quiet (the #509 shape).
          assert len(md) >= 160, f'site covers only {len(md)} md pages'
          import re
          toc = open('docs/toc.yml', encoding='utf-8').read()
          hrefs = re.findall(r'^\s+href:\s+(\S+)\s*$', toc, re.M)
          assert hrefs, 'docs/toc.yml carries no hrefs'
          top = sorted(os.path.basename(p) for p in
                       glob.glob('docs/*.md'))
          missing = [f for f in top if f not in hrefs]
          assert not missing, f'toc.yml misses {len(missing)} docs/*.md'
          print(f'OK: {len(md)} md pages, toc covers {len(top)} docs/*.md')
          EOF
      - name: Assemble static _site from existing markdown
        run: |
          python3 - <<'EOF'
          import glob, html, json, os, shutil
          with open('docfx.json', encoding='utf-8') as f:
              manifest = json.load(f)
          dest = manifest['build']['dest']
          shutil.rmtree(dest, ignore_errors=True)
          pages = []
          for group in manifest['build']['content']:
              for pattern in group['files']:
                  for p in sorted(glob.glob(pattern, recursive=True,
                                            include_hidden=True)):
                      if not os.path.isfile(p):
                          continue
                      target = os.path.join(dest, p)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      shutil.copyfile(p, target)
                      if p.endswith('.md'):
                          pages.append(p)
          assert len(pages) >= 160, f'assembled only {len(pages)} pages'
          items = '\n'.join(
              f'      <li><a href="{html.escape(p)}">{html.escape(p)}</a></li>'
              for p in sorted(pages))
          index = ('<!doctype html>\n<html lang="en">\n<head>\n'
                   '<meta charset="utf-8">\n'
                   '<title>Harbor docs</title>\n</head>\n<body>\n'
                   f'<h1>Harbor docs ({len(pages)} pages)</h1>\n'
                   '<ul>\n' + items + '\n</ul>\n</body>\n</html>\n')
          with open(os.path.join(dest, 'index.html'),
                    'w', encoding='utf-8') as f:
              f.write(index)
          print(f'OK: _site holds {len(pages)} md pages + index.html')
          EOF
      - name: Upload _site artifact (no secrets)
        uses: actions/upload-artifact@v7
        with:
          name: harbor-docs-site
          path: _site
          retention-days: 7
