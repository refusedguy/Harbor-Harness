# Harbor docs gate — markdown only, no dotnet.
#
# WHY THIS FILE EXISTS (issue #509)
#
#   `tools/check-md-links.py` has been in the repo since #39 hygiene and has
#   never run in CI. ci.yml lists `**.md` and `docs/**` in `paths-ignore` for
#   both `push` and `pull_request`, so a docs-only PR never starts a build and
#   therefore never reached the checker. A gate in a workflow that cannot
#   trigger is worse than no gate: it looks like the links are checked.
#
#   That is the third instance of the same failure in this repo — the other
#   two were three test projects missing from Harbor.slnx and the CI matrix
#   (#519), and NetArchTest rules naming a deleted assembly, where a
#   non-existent name reads as a *satisfied* constraint (#450).
#
#   So the fix is a second, cheap workflow rather than a change to ci.yml:
#   docs-only PRs get a real signal in ~30s instead of a full .NET build, and
#   ci.yml keeps its paths-ignore. Do not "fix" this by deleting those entries
#   from ci.yml — that would rebuild the entire solution for a typo in a
#   paragraph, and this file would still be the only thing that lints markdown.
#
# WHAT RUNS HERE
#
#   selftest  all four gates against fixtures that are known-broken. A checker
#             that has quietly stopped finding anything is still green on every
#             PR, so the failure path is tested on every docs change.
#   links     internal link + GitHub anchor resolution, with a file/ref floor.
#   cites     `file:line` in a normative document resolves, and a type it names
#             is constructed by something (#664).
#   facts     a COUNT the onboarding documents state still equals the count of
#             tracked files it is counting (#933). This is the only one of the
#             four that asks a numeric question, and it is deliberately not a
#             cross-check between the copies of a prose fact: measured, that
#             gate is red on dated records and green on the live defect. The
#             `facts` job's comment carries the measurement.
#   lint      markdown structural invariants, with a file/line floor.
#   testdup   duplicated test bodies in tests/ (#1778), with a scan-size floor.
#             It lives here rather than in ci.yml because it needs no .NET
#             SDK and because ci.yml is the workflow the dotnet matrix owns.
#
# THE FLOORS ARE THE POINT
#
#   `--min-files` / `--min-refs` / `--min-lines` make a narrowed scan fail
#   instead of passing quietly. They are set ~20% below today's numbers (310
#   markdown files, 770 link refs, 74109 lines) and are a ratchet: a PR that
#   legitimately removes documents lowers them in the same diff, where a
#   reviewer can see it. A script that scans zero paths and exits 0 is the
#   same failure mode this gate exists to end.
#
#   There is no allow-list of files to skip, and no `continue-on-error`: a
#   broken link in a docs-only PR must be red, not a note in the log.
#
# NOT a dotnet job: nothing here needs the SDK, the solution, or a submodule
# (no tracked markdown lives in contrib/external/ConsoleEx, the vendored tree
# that moved out of the product in ADR-019). If that changes, add
# `submodules: recursive` to the checkout below.
name: docs

on:
  push:
    branches: [dev, master]
    paths:
      - '**.md'
      - 'tests/**/*.cs'
      - 'src/**/*.cs'
      - 'apps/**/*.cs'
      # #428. `check-abstractions-contract.py` reads four guarded projects'
      # .csproj files and the .cs they compile. A csproj is how a dependency
      # enters this repository, so a workflow that watched only .cs could not
      # trigger on the change the gate exists to catch — the #509 failure (a
      # gate made green by never running) wearing a different hat. Same for
      # Directory.Packages.props, which is where a version is pinned.
      - 'src/**/*.csproj'
      - 'Directory.Packages.props'
      - 'tools/check-md-links.py'
      - 'tools/md-lint.py'
      - 'tools/check-doc-cites.py'
      - 'tools/check-doc-facts.py'
      - 'tools/md_gate.py'
      - 'tools/check-abstractions-contract.py'
      # #1778. `check-test-dup.py` scans `tests/**/*.cs` and compares the
      # result against its committed baseline, so a PR that edits the gate or
      # the baseline must run it — and so must a PR that edits the tree it
      # measures.
      - 'tools/check-test-dup.py'
      - 'tools/test-dup-baseline.json'
      # #1822. `check-test-json-reflection.py` scans `tests/**/*.cs` and
      # compares the result against its committed exceptions file, so a PR
      # that edits the gate or the exceptions must run it — and so must a PR
      # that edits the tree it measures.
      - 'tools/check-test-json-reflection.py'
      - 'tools/test-json-reflection-exceptions.txt'
      # #1823. `check-test-projects.py` reads the test projects, the solution
      # that carries them and the CI lists that name them, so a PR that
      # touches any of the three has to run it: a new test project (its
      # .csproj and the solution entry that goes with it), a change to a CI
      # list, a change to the gate or to its baseline, and the NUKE `Test`
      # target whose exclusions the census reads.
      - 'tests/**/*.csproj'
      - 'Harbor.slnx'
      - '.github/workflows/ci.yml'
      - '.github/workflows/test-os.yml'
      - 'tools/check-test-projects.py'
      - 'tools/test-project-baseline.txt'
      - 'build/_build/Targets/TestTarget.cs'
      # #1884. The two reporters (the measurement table and the wall census)
      # and their self-tests: a PR that edits either must run them, for the
      # same reason the gates above are triggered by their own sources.
      - 'tools/test-measurements.py'
      - 'tools/test-census.py'
      # #431 (slice D3). `check-xml-doc-coverage.py` gates the XML-doc surface
      # of the frozen contract assembly: a PR that edits the gate must run it.
      - 'tools/check-xml-doc-coverage.py'
      # #1845. `check-public-api-resign.py` is the surviving half of the
      # public-API freeze: it reads the PR's commit history, so a PR that
      # edits the gate itself must run it. The other half — the freeze
      # itself — is a compile-time gate in the ci.yml build job and needs no
      # trigger here.
      - 'tools/check-public-api-resign.py'
      # #431. docfx.json is the docs-site manifest and docs/toc.yml is its nav:
      # a PR that touches either must run the assembly + link gates below.
      # api/** is the tracked API landing (api/index.md is .md and already
      # covered, but future generated-source entries would not be).
      - 'docfx.json'
      - 'docs/toc.yml'
      - 'api/**'
      - '.github/workflows/docs.yml'
  # NO workflow-level path filter on pull_request. #1804: a required status
  # check is satisfied only if a check run with that exact name exists on the
  # head commit. With this `paths:` filter, a PR that touched none of the
  # listed files produced NO docs.yml check run at all, so every docs gate
  # name ("checker self-test", "internal links", "normative citations",
  # "markdown lint", "guarded project dependencies", "test project
  # coverage", "xml-doc coverage") would have been reported as "Expected -
  # waiting for status to be reported" and the PR would have been
  # unmergeable forever. The push block keeps its filter: a push has no
  # required-check semantics to satisfy.
  #
  # Cost of running the gates on every PR, measured on run 39426596955: the
  # eleven jobs take 5-13 s each (67 s for the citation gate), so about
  # 2.3 runner-minutes and 67 s of wall clock per PR, against a baseline of
  # 45.3 runner-minutes and 19.5 minutes of wall clock. The gates are
  # idempotent and read-only, so running them when their inputs did not
  # change costs minutes and catches nothing new.
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Anti-vacuity. Runs the gates against a throwaway git repo containing
  # documents that are deliberately broken, and asserts the specific
  # diagnostics. If someone edits a rule until it matches nothing, this is the
  # job that goes red — not the "everything is fine" jobs below.
  selftest:
    name: checker self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Link checker fails on a broken link
        run: python3 tools/check-md-links.py --self-test
      - name: Markdown lint fails on a malformed document
        run: python3 tools/md-lint.py --self-test
      # #664. The third gate is the only one that asks whether a `file:line`
      # in a normative document still points at a line, and whether a backticked
      # type is constructed by anything. Its failure path is tested here for
      # the same reason the other two are: a rule edited until it matches
      # nothing is indistinguishable from a rule that found nothing.
      - name: Citation checker fails on a stale file:line and an unwired type
        run: python3 tools/check-doc-cites.py --self-test
      # #933. The fourth gate is the only one that asks whether a COUNT the
      # onboarding documents state still equals the count of tracked files.
      # Its failure path is tested for the same reason as the other three: the
      # fixtures here include the two shapes that made a draft of this gate
      # wrong — a rule compared against the wrong population (green on a
      # number that is not the one in the document) and a rule whose capture
      # group was edited away (reported BLIND, the one verdict CI passes).
      - name: Repo-map counter fails on a stale count and detects its own blindness
        run: python3 tools/check-doc-facts.py --self-test
      # #428. The fifth gate is the only one that reads a `.csproj`, and the only
      # one that asks about a package rather than about a document: is every
      # PackageReference a guarded project declares load-bearing, and is every
      # non-BCL namespace its sources use declared. Its self-test carries fifteen
      # fixtures and six of them pin bugs this tool had while being written, so
      # its failure path is as much the point as its passing path. Every fixture
      # added after the first version was checked by mutation: it fails when its
      # own fix is reverted and the rest still pass. Two candidate mutations were
      # tried and found NOT reachable by any fixture, and the tool's comments say
      # so rather than implying coverage that is not there.
      - name: Guarded-project dependency gate fails on a phantom package
        run: python3 tools/check-abstractions-contract.py --self-test
      # #431 (slice D3). The sixth gate is the only one that asks whether a
      # public member of the frozen contract assembly carries an XML doc (or
      # an explicit suppression with a reason). Its self-test carries fixtures
      # for every shape that made a draft of this gate wrong — a `record
      # struct` named "struct", a `= new(...)` tail donating the name "new",
      # parameter continuations named "1"/"default" — and the load-bearing
      # non-vacuity proof: one undocumented member fails, naming it.
      - name: XML-doc coverage gate fails on an undocumented member
        run: python3 tools/check-xml-doc-coverage.py --self-test
      # #428 / #1845. The public-API freeze used to be a python text scan
      # with its own --self-test here. The scan is gone: the freeze is a
      # COMPILE-time gate now (Microsoft.CodeAnalysis.PublicApiAnalyzers,
      # RS0016/RS0017), and its non-vacuity proof is a CI job that builds a
      # throwaway project against the real analyzer — see
      # tools/public-api-nonvacuity.sh and the ci.yml `public-api` job.
      #
      # What is left in python is the re-signing half — the rule that a
      # change to the frozen surface is re-signed in the SAME COMMIT — which
      # the compiler cannot see because it sees one tree, not a history. Its
      # self-test is here, with the other gates that have one.
      - name: Re-signing gate fails on an unreviewed change
        run: python3 tools/check-public-api-resign.py --self-test
      # #1778. The eighth gate is the only one that reads the TEST tree, and
      # the only one that asks whether a test body is a copy of another test
      # body. Its failure path is tested here for the same reason as the
      # others: a rule edited until it matches nothing is indistinguishable
      # from a rule that found nothing, and the load-bearing fixture is the
      # planted duplicate — the gate MUST fail on it, and MUST stay quiet on
      # a same-shape body that shares no identifiers with it.
      - name: Duplicate-test-body gate fails on a planted duplicate
        run: python3 tools/check-test-dup.py --self-test
      # #1823. The ninth gate is the only one that asks whether a test
      # project is claimed by a CI list AT ALL. The other gates read the
      # contents of the test tree; this one reads the lists that decide
      # which projects run, and the answer is a property of the workflow
      # files rather than of a test body. Its self-test carries the
      # load-bearing fixtures: a project left out of every list, a stale
      # list entry, a project claimed only behind a condition, and a
      # baseline row that no longer matches anything.
      - name: Test-project completeness gate fails on a project left out of CI
        run: python3 tools/check-test-projects.py --self-test
      # #1884. The last two are REPORTERS, not gates: they read the TRX
      # artifacts a CI run produced and print what they find (the per-test
      # measurements, the per-project wall census). They never fail a build,
      # which is exactly why their self-tests belong here: a reporter that
      # quietly stops reporting is green on every run and tells nobody
      # anything, and that is the same failure shape the gates above are
      # tested against. The census's self-test carries the load-bearing
      # fixture: a test that printed NOTHING is still counted, which is the
      # difference between a census and a measurement table.
      - name: Measurement reporter still finds the tests that printed something
        run: python3 tools/test-measurements.py --self-test
      - name: Skipped-test report finds the skips and their reasons
        run: python3 tools/test-skips.py --self-test
      - name: Test census counts every test, printed or not
        run: python3 tools/test-census.py --self-test
      # #1822. The tenth gate is the only one that asks whether a test
      # serializes through the SOURCE-GENERATED path or the reflection one.
      # Its failure path is tested here for the same reason as the others: a
      # rule edited until it matches nothing is indistinguishable from a rule
      # that found nothing, and the load-bearing fixture is the planted
      # reflection call — the gate MUST fail on it.
      - name: Reflection-JSON gate fails on a planted reflection call
        run: python3 tools/check-test-json-reflection.py --self-test

  links:
    name: internal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every internal link and anchor
        run: python3 tools/check-md-links.py --min-files 250 --min-refs 600

  # #664. Same reasoning as the two jobs above, third question: not "does the
  # link resolve" and not "is the file shaped right" but "does the `file:line`
  # this document asserts still exist, and is the type it names still built".
  #
  # The floors are ~25% below today's numbers (2 normative documents, 143 line
  # citations, 68 backticked type names) and are a ratchet, like the ones above.
  # Scope is the `Status: normative` marker rather than every .md: measured over
  # the whole tree the same rules find 85 pre-existing violations in 24
  # non-normative documents, most of them archived sprint notes under
  # docs/.kilo-docs/ and PLAN.md files that state an intention, and a gate that
  # is red on 85 unrelated findings on day one is a gate that gets switched off.
  # Deleting the marker from a document shrinks the scanned set, which the floors
  # then catch.
  #
  # --min-counts 1 is the floor for DOC-COUNT-STALE, which is NOT opt-in: it
  # asks every document that has a `| path | line |` table whether its stated
  # total matches its own rows. Measured, exactly one document in the tree is
  # in that shape, so the rule is exception-free today; the floor is what keeps
  # it that way, since a COUNT_TOTAL matcher that quietly stopped matching would
  # be indistinguishable from a tree with nothing to ask.
  cites:
    name: normative citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # #947. `fetch-depth: 0` is load-bearing for TEST-CITE-DRIFT, and the
      # first run of this gate proved it: at the default depth of 1, `git blame`
      # attributes every line to the shallow boundary commit, so the "what did
      # this citation mean when it was written" comparison compares HEAD with
      # HEAD and finds nothing. The gate went from 87 findings to 21 and said
      # nothing about it — the mechanical classes kept working, the anchored one
      # went silently blind. A rule that cannot see is worse than no rule,
      # because the build stays green.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `--min-guide-usings` and `--min-base-lists` are the #564 floors. Both are
      # counts of things that are EXPECTED to shrink — the view seam closed, the
      # `Harbor.Tui.Abstractions` facade is gone — so the day the last plugin
      # guide stops fencing a `using` there is nothing left to check, and a rule
      # that goes quiet by succeeding is indistinguishable from one that went
      # quiet by breaking. The floors are what say which happened.
      #
      # The numbers are the tree's, measured not guessed: 3 guides / 37 `using`
      # lines and 2 base lists on dev@7aff0c87.
      #
      # `--min-test-cites` is the same kind of floor, and its number comes from
      # the table in `docs/CI_GATES.md` — the repository's own measured
      # picture of the gates — so the workflow and the table agree on it. The
      # tree shrank under the old value (whole test suites were deleted or
      # merged away), so a test file could no longer carry that many
      # `file:line` citations and the job went red for a number nobody
      # re-measured. The floor stays a floor: a scan that stops matching still
      # fails the job.
      - name: Check every normative file:line and named type
        run: python3 tools/check-doc-cites.py --min-files 2 --min-cites 100 --min-types 50 --min-api 12 --min-counts 1 --min-test-cites 70 --min-guide-usings 30 --min-base-lists 2

  lint:
    name: markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check markdown invariants
        run: python3 tools/md-lint.py --min-files 250 --min-lines 60000

  # #933. Fourth question, and the only one a copy-consistency gate could not
  # answer honestly: not "do the links resolve", not "is the file shaped
  # right", not "does the file:line exist" but "does a number the onboarding
  # documents state still equal the count of tracked files it is counting".
  #
  # The scope is AGENTS.md and CLAUDE.md, not every tracked markdown, and the
  # reason is the measurement rather than convenience. #933 asked for a gate
  # that cross-checks the COPIES of a fact, and measuring the tree says that
  # gate cannot be built for prose: the builtin tool count is stated 16 times
  # with six different values (4/5/7/14/20/26), and every divergent copy is a
  # document that has already declared itself historical — a CHANGELOG release
  # note, a "Historical plan (pre-sprint-2)", or docs/specs/, which #983
  # declared a dated record. A prose gate would be red on ten sites allowed to
  # be wrong and green on the live defect. A count is different: it either
  # equals the tree or it does not, and a record quoting an old count cannot
  # make the number agree.
  #
  # --min-facts is the floor. Measured today: 6 counts compared. The floor is
  # 5, so a rule that silently stops matching drives the number down and this
  # job goes red instead of reporting a clean tree — the #591 shape, which the
  # --self-test also pins from the other side.
  facts:
    name: repo-map counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every repo-map count against the tree
        run: python3 tools/check-doc-facts.py --min-facts 5

  # #428. Fifth question, and the only one about a package rather than a
  # document: not "do the links resolve", not "is the file shaped right", not
  # "does the file:line exist", not "does the count match", but "is every
  # dependency the two frozen contract projects declare actually reached".
  #
  # #428 asks for v1.0 to freeze the public API of Harbor.Abstractions +
  # Harbor.Abstractions.Contracts, and those two projects are the ones every
  # other assembly points inward at — so a dependency that lands in either is one
  # every consumer inherits. Measured on the tree this landed on: `AGENTS.md`
  # described the facade as "zero-dep (only CSharpFunctionalExtensions)", which is
  # 6 packages wrong, and `CommunityToolkit.HighPerformance` was declared and
  # reached by nothing at all.
  #
  # Both sides of every comparison are files: the PackageReference elements of the
  # two .csproj against the using directives of the .cs they compile. No document
  # is read, which is the #939 lesson applied rather than restated — a gate that
  # cross-checks copies of a prose fact is red on copies that are allowed to be
  # wrong and green on the live defect. This one measures the contract.
  #
  # The floors are a ratchet, like the ones above. Measured after this change:
  # 9 packages declared, 6 distinct external namespaces, 75 .cs files. The floors
  # are set AT those values, not below: this gate was introduced by a fix that
  # removed a declaration, so a floor below the post-fix count would have been a
  # floor that a re-added phantom still cleared. Lower them only in the same diff
  # that legitimately removes a dependency, where a reviewer can see it.
  contract:
    name: guarded project dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Floors are the ratchet, and they are set AT the measured counts rather
      # than below them — a floor with slack cannot tell "the tree got smaller"
      # from "the matcher stopped matching", and only the first of those is a
      # change a reviewer should have to look at. A PR that legitimately removes
      # a dependency lowers them in the same diff. Recomputed when the perimeter
      # widened to four projects (was 9 / 6 / 75 over two), and again after
      # #1623 moved the agent loop out of the Application perimeter
      # (--report: 13 / 7 / 143), and again after #1624 moved the
      # session-context cohort out of the same perimeter (--report: 13 / 7 / 130).
      - name: Check the guarded projects' declared dependencies
        run: python3 tools/check-abstractions-contract.py --min-packages 13 --min-namespaces 7 --min-files 130

  # #1778. Sixth question, and the only one about the TEST tree: not "do the
  # links resolve", not "is the file shaped right", not "does the file:line
  # exist", not "does the count match", not "is every dependency declared",
  # but "is this test body a copy of that test body".
  #
  # Epic #1808 removes ~21 000 lines of duplicated test code and #1778 is the
  # gate that stops it coming back: the rule 6 of the epic makes the
  # detector the condition for calling the programme closed. The gate runs in
  # BASELINE MODE — the whole `tests/` tree is scanned every time, the
  # duplication that exists today is recorded in
  # `tools/test-dup-baseline.json` and allowed to stay, and only NEW or GROWN
  # duplication fails. A gate that is red on today's tree is a gate nobody
  # lands, and a gate nobody lands protects nothing.
  #
  # The floors are a ratchet, like the ones above. Measured on this tree:
  # 938 .cs files and 10 645 method bodies. They are set ~15% below those
  # numbers, because the programme is about to REMOVE test methods: a floor
  # set AT the measured count would go red on the removal PRs themselves.
  # Lower them in the same diff as a legitimate removal, where a reviewer
  # sees it.
  #
  # The non-vacuity proof is the gate's own --self-test (a planted duplicate
  # fails, a same-shape body with unrelated identifiers does not), run in the
  # `selftest` job above.
  testdup:
    name: test duplication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # `--json-out` writes the group list (file, line range, copy count,
      # removable lines) next to the verdict, so the next duplication ticket
      # takes its work list from the artifact instead of re-measuring by
      # hand. The artifact is uploaded even when the gate is red — that is
      # exactly when somebody needs it.
      #
      # `--warn-only` keeps the measurement and stops the blocking until the
      # removal programme is over: #1808 and its children (#1810, #1815,
      # #1816, #1821, #1822, #1774, #1776, #1889) MOVE the files the
      # baseline is keyed on, and the baseline is lowered by one deliberate
      # `--update` when the last of them lands. The gate now knows a
      # relocated group (same shape, same copy count, same method names), so
      # a move is not a finding any more — but the programme is still in
      # flight, and the gate comes back to blocking with that final
      # `--update`, not before. The findings are printed as WARN and the job
      # goes green; the blocking default of the script is unchanged.
      - name: Check the test tree for duplicated bodies
        run: python3 tools/check-test-dup.py --min-files 800 --min-methods 9000 --json-out test-dup-groups.json --warn-only
      - name: Upload the duplicate-group list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-dup-groups
          path: test-dup-groups.json
          retention-days: 7

  # #1822. Tenth question, and the only one about the SERIALIZER the test
  # tree uses: does every `JsonSerializer` call under `tests/` name a
  # source-generated type info, or does it take the reflection resolver?
  #
  # The product side of System.Text.Json already rides source generation
  # (21 contexts under `src/`). The test side did not: 62 calls were taking
  # the reflection path, and a reflection call in a test is a test that can
  # stay green while the product is broken — a misspelled member name
  # compiles, serializes to a DIFFERENT key, and the assertion checks the
  # wrong field.
  #
  # The gate is BLOCKING (unlike the duplication measurement above, which is
  # `--warn-only` while its removal programme is in flight): the exceptions
  # file is a ratchet with five rows, and it can only shrink.
  reflection-json:
    name: reflection JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check that no test serializes through the reflection resolver
        run: python3 tools/check-test-json-reflection.py

  # #1823. Ninth question, and the only one about the LISTS rather than
  # about the test bodies: does every test project in the solution actually
  # run in CI?
  #
  # The shard lists in ci.yml are hand-written. There are six of them across
  # two workflow files, plus a derived list in the NUKE `Test` target, and
  # nothing compared them against the tree.
  #
  # The obvious question has the wrong answer, and the repository says so:
  # TUnit discovers a REFERENCED test project's classes in every project
  # that references it (tests/Harbor.E2E.App.Avalonia/E2eShards.cs, and the
  # TRX of run 39399653820, where 26 of Harbor.E2E.App.Avalonia's 133
  # tests are Harbor.E2E.Framework.StateTestRunnerTests). So a test project
  # reaches a CI run through its OWN list entry OR through a listed project
  # that references it, and the gate has to count both.
  #
  # What the gate finds on dev@8be16392, with 43 .csproj under tests/ and 38
  # test projects carrying tests:
  #
  #   * every one of the 38 is discovered by some CI run, so nothing is
  #     silently unrun -- the hole the issue was filed about does not
  #     exist in the shape the issue described;
  #   * Harbor.E2E.Framework's 26 tests run SIX times per CI run, in each
  #     of the six listed projects that reference it: 156 executions of 26
  #     tests, about 1.06 s of duplicated test time;
  #   * Harbor.Ipc.Tests references that framework and names none of its
  #     types, so the reference buys nothing: 13 product assemblies dragged
  #     into the IPC closure, and a sixth copy of the 26 tests;
  #   * Harbor.Terminal.Abstractions.Tests references Harbor.TestKit and
  #     names none of its types: 4 product assemblies dragged in for
  #     nothing;
  #   * Harbor.TestKit.Tests references Harbor.TestKit and names none of
  #     its types, a leftover of the TestKit split: 16 product assemblies
  #     dragged in for nothing;
  #   * Harbor.E2E.App.Avalonia defines the two-process split (E2eShards)
  #     that would put the framework's tests in one shard, and CI runs the
  #     project once without a filter, so the partition is dead code.
  #
  # WHY THIS JOB LIVES HERE AND NOT IN ci.yml: the gate is stdlib python
  # with no SDK, no restore and no build, and this workflow is the one that
  # stays SDK-free. It reads ci.yml and test-os.yml as FILES, so the lists
  # it checks living in a different workflow is not a problem. A job in
  # ci.yml would inherit ci.yml's change filter and would be skipped on the
  # PRs where a new test project is added, which is exactly the PR the gate
  # exists for.
  #
  # The floors are a ratchet, set AT the measured counts rather than below
  # them: a floor with slack cannot tell "the tree got smaller" from "the
  # matcher stopped matching". Measured on this tree: 43 .csproj under
  # tests/, 38 test projects carrying tests, 7 CI lists, 37 distinct
  # projects the lists name, 41 projects discovered by a CI run. A PR that
  # legitimately removes a project lowers them in the same diff, where a
  # reviewer sees it.
  #
  # The gate runs in BASELINE MODE: the holes the tree has today are
  # recorded in tools/test-project-baseline.txt, one row per hole with a
  # reason and an owner, and only NEW holes fail. A gate that is red on
  # today's tree is a gate nobody lands, and a gate nobody lands protects
  # nothing. The baseline is a ratchet in both directions: a row the tree
  # no longer produces fails too, so a closed hole cannot stay blessed.
  #
  # The non-vacuity proof is the gate's own --self-test, run in the
  # `selftest` job above.
  testprojects:
    name: test project coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every test project is discovered by a CI run
        run: python3 tools/check-test-projects.py --min-projects 43 --min-tested 38 --min-lists 7 --min-claims 37 --min-contexts 41

  # #431 (slice D3). XML-doc coverage gate for the frozen contract assembly.
  #
  # `Directory.Build.props` keeps CS1591 in NoWarn, so the compiler never asks
  # whether a public member of Harbor.Abstractions.Contracts carries an XML
  # doc — and the D2 metadata lane turns those docs into the published API
  # reference, so a silent gap ships silently. This job asks the question
  # instead, with stdlib python only (no SDK, this workflow stays dotnet-free).
  #
  # The gate is zero-tolerance on top of an explicit suppression list, not a
  # bare percentage: every public/protected declaration, enum value, and
  # implicit interface member must carry `///` (or `<inheritdoc/>`) or an entry
  # in SUPPRESSED with a reason. Any single undocumented, unsuppressed member
  # fails the job — the first gap goes red. Every suppression must match
  # exactly one currently-undocumented member, so documenting one means
  # dropping its entry in the same diff, where a reviewer can see it.
  #
  # The floors are a ratchet, like the ones above. Measured on this tree:
  # 493 members, 478 documented (97.0%, floor 0.96), 15 suppressed (−8
  # GetEqualityComponents <inheritdoc/> rows via #1559 records). The count
  # floors are set AT those values, not below: a floor with slack cannot tell
  # "the surface got smaller" from "the matcher stopped matching". The
  # non-vacuity proof is the gate's own --self-test (one undocumented member
  # fails, naming it), run in the `selftest` job above.
  xmldoc:
    name: xml-doc coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check XML-doc coverage of the frozen contract assembly
        run: python3 tools/check-xml-doc-coverage.py --min-members 493 --min-documented 478 --min-coverage 0.96

  # #428 (first slice) — GONE as a job, kept as a gate (#1845).
  #
  # The public-API freeze of the contract assembly was a python text scan
  # with its own job here. It is now a COMPILE-time gate:
  # Microsoft.CodeAnalysis.PublicApiAnalyzers reports RS0016/RS0017 while
  # Harbor.Abstractions.Contracts compiles, so the freeze fails the build
  # job in ci.yml and needs no runner of its own. The analyzer's baseline
  # lives next to the code it describes
  # (src/Harbor.Abstractions.Contracts/PublicAPI.Shipped.txt).
  #
  # What is left of the old gate is the half the compiler cannot see — the
  # re-signing pairing, which is about a commit and not about a tree — and
  # it runs in the ci.yml `public-api` job together with the compile gate's
  # non-vacuity proof.

  # #431 (slice 1). Docs-site assembly from the existing markdown tree.
  #
  # docfx.json is the manifest (metadata lane + content globs + nav); this job
  # validates it (strict JSON, every content glob resolves to >=1 tracked file,
  # every docs/toc.yml href exists, every metadata src project file exists with
  # dest api, the global GenerateDocumentationFile flag stays on) and assembles
  # a static `_site` (copied markdown + generated index) with stdlib python
  # only — no SDK, no docfx binary, so this workflow stays dotnet-free.
  # The full `docfx build` with generated API pages (api/*.yml) is a later
  # slice (ADR-017); the XML-doc coverage gate is the `xmldoc` job above.
  # Internal links inside the
  # assembled site are covered by the `links` job above, which runs on the same
  # tree and the same trigger paths — no second link checker is introduced here.
  #
  # The artifact needs no secrets and no extra permissions (upload-artifact
  # rides `contents: read`). GitHub Pages publishing lives in the `deploy` job
  # below: master-only behind the HARBOR_PAGES_ENABLED opt-in.
  site:
    name: docs site assembly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate docfx.json manifest
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys
          with open('docfx.json', encoding='utf-8') as f:
              manifest = json.load(f)
          globs = [e['files'] for e in manifest['build']['content']]
          assert manifest['build']['dest'] == '_site', 'dest must stay _site'
          pages = set()
          for group in globs:
              for pattern in group:
                  # include_hidden: docs/.kilo-docs/ holds 48 tracked md files
                  # and a glob that silently skips a dot-directory is the #509
                  # shape (green by never scanning). Measured with it: 210 pages.
                  hits = [p for p in glob.glob(pattern, recursive=True,
                                               include_hidden=True)
                          if os.path.isfile(p)]
                  assert hits, f'content glob resolves to nothing: {pattern}'
                  pages.update(hits)
          md = sorted(p for p in pages if p.endswith('.md'))
          # Floor (~20% below the 205 pages measured on dev@b7fb67c): a glob
          # that silently stops matching must go red, not quiet (the #509 shape).
          assert len(md) >= 160, f'site covers only {len(md)} md pages'
          import re
          toc = open('docs/toc.yml', encoding='utf-8').read()
          hrefs = re.findall(r'^\s+href:\s+(\S+)\s*$', toc, re.M)
          assert hrefs, 'docs/toc.yml carries no hrefs'
          top = sorted(os.path.basename(p) for p in
                       glob.glob('docs/*.md'))
          missing = [f for f in top if f not in hrefs]
          assert not missing, f'toc.yml misses {len(missing)} docs/*.md'
          # #431 (slice 2). Metadata lane: every listed project file must exist,
          # dest must stay api, the API landing page must be tracked, and the
          # global documentation flag must stay on. A moved project, a dropped
          # lane, or a removed flag must go red here — not silently shrink the
          # API reference (the #509 shape: green by never scanning).
          meta = manifest.get('metadata', [])
          assert len(meta) == 1, f'expected 1 metadata entry, got {len(meta)}'
          assert meta[0].get('dest') == 'api', 'metadata dest must stay api'
          for entry in meta[0].get('src', []):
              for proj in entry.get('files', []):
                  assert os.path.isfile(proj), f'metadata src missing: {proj}'
          assert os.path.isfile('api/index.md'), 'api/index.md is not tracked'
          props = open('Directory.Build.props', encoding='utf-8').read()
          assert '<GenerateDocumentationFile>true</GenerateDocumentationFile>' \
              in props, 'GenerateDocumentationFile must stay globally true'
          nsrc = sum(len(e.get('files', [])) for e in meta[0].get('src', []))
          print(f'OK: {len(md)} md pages, toc covers {len(top)} docs/*.md, '
                f'metadata covers {nsrc} projects')
          EOF
      - name: Assemble static _site from existing markdown
        run: |
          python3 - <<'EOF'
          import glob, html, json, os, shutil
          with open('docfx.json', encoding='utf-8') as f:
              manifest = json.load(f)
          dest = manifest['build']['dest']
          shutil.rmtree(dest, ignore_errors=True)
          pages = []
          for group in manifest['build']['content']:
              for pattern in group['files']:
                  for p in sorted(glob.glob(pattern, recursive=True,
                                            include_hidden=True)):
                      if not os.path.isfile(p):
                          continue
                      target = os.path.join(dest, p)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      shutil.copyfile(p, target)
                      if p.endswith('.md'):
                          pages.append(p)
          assert len(pages) >= 160, f'assembled only {len(pages)} pages'
          items = '\n'.join(
              f'      <li><a href="{html.escape(p)}">{html.escape(p)}</a></li>'
              for p in sorted(pages))
          index = ('<!doctype html>\n<html lang="en">\n<head>\n'
                   '<meta charset="utf-8">\n'
                   '<title>Harbor docs</title>\n</head>\n<body>\n'
                   f'<h1>Harbor docs ({len(pages)} pages)</h1>\n'
                   '<ul>\n' + items + '\n</ul>\n</body>\n</html>\n')
          with open(os.path.join(dest, 'index.html'),
                    'w', encoding='utf-8') as f:
              f.write(index)
          print(f'OK: _site holds {len(pages)} md pages + index.html')
          EOF
      - name: Upload _site artifact (no secrets)
        uses: actions/upload-artifact@v7
        with:
          name: harbor-docs-site
          path: _site
          retention-days: 7

  # #431 (slice 2). GitHub Pages publishing for the assembled static site.
  #
  # Runs ONLY on master AND only when the repo variable HARBOR_PAGES_ENABLED
  # is 'true'. Pages is not enabled on this repo yet (no Pages site exists,
  # default branch is master), and configure-pages fails when Pages is off —
  # an unconditional lane would turn the first master push red on a head
  # nobody broke. The opt-in keeps every head green: the owner enables Pages
  # (Settings -> Pages -> source "GitHub Actions") and sets the variable, and
  # the next master push publishes. PRs and dev pushes skip by the `if`.
  # `needs` is links + lint + site so a broken link or a shrunk manifest
  # blocks the publish, not just the assembly. The full `docfx build` with
  # generated api/*.yml member pages is still a later slice (ADR-017) — this
  # publishes the same static _site the job above assembles, no SDK involved.
  deploy:
    name: publish to GitHub Pages
    if: github.ref == 'refs/heads/master' && vars.HARBOR_PAGES_ENABLED == 'true'
    needs: [links, lint, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble static _site from existing markdown
        run: |
          python3 - <<'EOF'
          import glob, html, json, os, shutil
          with open('docfx.json', encoding='utf-8') as f:
              manifest = json.load(f)
          dest = manifest['build']['dest']
          shutil.rmtree(dest, ignore_errors=True)
          pages = []
          for group in manifest['build']['content']:
              for pattern in group['files']:
                  for p in sorted(glob.glob(pattern, recursive=True,
                                            include_hidden=True)):
                      if not os.path.isfile(p):
                          continue
                      target = os.path.join(dest, p)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      shutil.copyfile(p, target)
                      if p.endswith('.md'):
                          pages.append(p)
          assert len(pages) >= 160, f'assembled only {len(pages)} pages'
          items = '\n'.join(
              f'      <li><a href="{html.escape(p)}">{html.escape(p)}</a></li>'
              for p in sorted(pages))
          index = ('<!doctype html>\n<html lang="en">\n<head>\n'
                   '<meta charset="utf-8">\n'
                   '<title>Harbor docs</title>\n</head>\n<body>\n'
                   f'<h1>Harbor docs ({len(pages)} pages)</h1>\n'
                   '<ul>\n' + items + '\n</ul>\n</body>\n</html>\n')
          with open(os.path.join(dest, 'index.html'),
                    'w', encoding='utf-8') as f:
              f.write(index)
          print(f'OK: _site holds {len(pages)} md pages + index.html')
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
