# Regenerate golden baselines on demand and commit them back.
#
# Golden tests (the CellForge grid dumps, the Avalonia frame snapshots,
# ScreenshotHashTests, ce3-*) fail when the painted output intentionally
# changes. Regeneration requires a full test run with HARBOR_UPDATE_GOLDENS=1
# — agents and reviewers without a local .NET setup use this workflow instead:
#
#   gh workflow run goldens.yml --ref <branch>   (-PR branch, not dev)
#   gh workflow run goldens.yml --ref <branch> -f suites="tests/Harbor.E2E.App.Avalonia"
#
# The job runs the selected golden suites with the flag set, then runs them
# AGAIN in verify mode. A baseline the code does not reproduce is a broken
# regeneration, and the job says so instead of committing it — the old
# version swallowed every failure with `|| true` and could commit nothing at
# all while reporting success.
#
# It then commits the changed baselines straight back to the same branch, so
# the PR's CI re-runs green. Only baseline files (*.golden.txt, *.verified.*)
# are committed — never source changes. Manual dispatch only; the CHECK is
# the test job in ci.yml, which compares the committed baseline on EVERY run:
# a frame that changed without its baseline changing in the same PR fails the
# build, and a baseline that changed without the frame is where the reviewer
# looks.
#
# THE SUITE LIST (#1776) — one list for every lane, mirroring the table in
# docs/DEVELOPMENT.md §Golden baselines:
#
#   tests/Harbor.Tui.CellForge.Tests   celldiff + generic-layout baselines
#   tests/Harbor.Tui.RendererTests      renderer frames (tests/fixtures/renderer-frames)
#   tests/Harbor.E2E.App.Avalonia      Avalonia component + frame snapshots
#
# The PTY lane (tests/Harbor.Tui.CellForge.PtyTests) is NOT in the list: its
# goldens are opt-in (the scenario only compares when HARBOR_ENFORCE_GOLDEN=1)
# and its test methods do not carry "Golden" in their names, so the filter
# below would discover nothing there and the verify pass would fail the job
# on an empty run.
name: goldens

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Test projects to regenerate (space-separated, empty = all golden suites)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No `submodules: recursive`: the vendored ConsoleEx submodule left the
      # product (ADR-019); nothing in this workflow builds contrib/external/.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Resolve the suites
        id: suites
        run: |
          set -uo pipefail
          if [ -z "${{ inputs.suites }}" ]; then
            suites="tests/Harbor.Tui.CellForge.Tests tests/Harbor.Tui.RendererTests tests/Harbor.E2E.App.Avalonia"
          else
            suites="${{ inputs.suites }}"
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

      - name: Regenerate goldens
        env:
          HARBOR_UPDATE_GOLDENS: 1
          DOTNET_NOLOGO: true
          DOTNET_CLI_TELEMETRY_OPTOUT: true
        run: |
          set -uo pipefail
          for p in ${{ steps.suites.outputs.suites }}; do
            echo "::group::goldens $p"
            # TUnit treenode filters are /assembly/namespace/class/method paths;
            # a bare "*Golden*" glob matches nothing and silently regenerates
            # zero baselines (see docs/BUILD.md §filtering).
            dotnet run --project "$p" -c Release -- --treenode-filter "/*/*/*Golden*/*" || true
            dotnet run --project "$p" -c Release -- --treenode-filter "/*/*/*ScreenshotHash*/*" || true
            echo "::endgroup::"
          done
          exit 0

      # The regeneration above runs in update mode, where a golden test
      # cannot fail: it writes the baseline and returns. That is what makes
      # "regenerated -> committed -> never checked" possible — the committed
      # baseline was never compared with anything. This pass compares: the
      # suites run WITHOUT the update flag, so the baseline the job is about
      # to commit has to match what the code renders right now. A failure
      # here means the regeneration produced a baseline the code does not
      # reproduce (a path bug, a half-written file), and the job fails
      # instead of committing it.
      - name: Verify the regenerated baselines
        env:
          HARBOR_UPDATE_GOLDENS: 0
          DOTNET_NOLOGO: true
          DOTNET_CLI_TELEMETRY_OPTOUT: true
        run: |
          set -uo pipefail
          rc=0
          for p in ${{ steps.suites.outputs.suites }}; do
            echo "::group::verify goldens $p"
            if ! dotnet run --project "$p" -c Release -- --treenode-filter "/*/*/*Golden*/*"; then
              echo "::error::the regenerated baselines of $p do not match what the code renders"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Commit baselines back
        run: |
          git config user.name "harbor-goldens"
          git config user.email "harbor-goldens@users.noreply.github.com"
          # `git add` aborts the WHOLE invocation when one pathspec matches
          # nothing, so a repo with no *.verified.* files staged nothing at
          # all and every dispatch reported "No baseline changes". Add each
          # pattern on its own so a missing family cannot swallow the rest.
          # The Avalonia frame snapshots (*.golden.txt) live under
          # tests/fixtures/golden and tests/fixtures/avalonia/frames — the
          # *.golden.txt pathspec covers both, at any depth.
          for pattern in '*.golden.txt' '*.verified.*'; do
            git add -A -- "$pattern" || true
          done
          if git diff --cached --quiet; then
            echo "No baseline changes."
          else
            git commit -m "chore(goldens): regenerate baselines via workflow dispatch" --no-verify
            git push origin "HEAD:${{ github.ref_name }}"
          fi
