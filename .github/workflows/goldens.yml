# Regenerate golden baselines on demand and commit them back.
#
# Golden tests (ScreenshotHashTests, GoldenGridDumpTests, ce3-*, Avalonia
# *GoldenFrame/*Frames_*) fail when painted output intentionally changes.
# Regeneration requires a full test run with HARBOR_UPDATE_GOLDENS=1 —
# agents and reviewers without a local .NET setup use this workflow instead:
#
#   gh workflow run goldens.yml --ref <branch>   (-PR branch, not dev)
#   gh workflow run goldens.yml --ref <branch> -f suites="tests/Harbor.E2E.App.Avalonia"
#
# The job runs the selected golden suites with the flag set and commits any
# changed baselines straight back to the same branch, so the PR's CI re-runs
# green. Only baseline files (*.golden.txt, *.golden.png, *.golden.sha256,
# *.verified.*, hashes manifest, Avalonia frames + sha256.json)
# are committed — never source changes. Manual dispatch only, never a gate.
name: goldens

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Test projects to regenerate (space-separated, empty = all golden suites)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Regenerate goldens
        env:
          HARBOR_UPDATE_GOLDENS: 1
          HARBOR_GOLDENS_STRICT: 1
          DOTNET_NOLOGO: true
          DOTNET_CLI_TELEMETRY_OPTOUT: true
        run: |
          set -uo pipefail
          if [ -z "${{ inputs.suites }}" ]; then
            suites="tests/Harbor.Tui.CellForge.Tests"
          else
            suites="${{ inputs.suites }}"
          fi
          for p in $suites; do
            echo "::group::goldens $p"
            # TUnit treenode filters are /assembly/namespace/class/method paths;
            # a bare "*Golden*" glob matches nothing and silently regenerates
            # zero baselines (see docs/BUILD.md §filtering).
            dotnet run --project "$p" -c Release -- --treenode-filter "/*/*/*Golden*/*" || true
            dotnet run --project "$p" -c Release -- --treenode-filter "/*/*/*ScreenshotHash*/*" || true
            echo "::endgroup::"
          done
          exit 0

      - name: Commit baselines back
        run: |
          git config user.name "harbor-goldens"
          git config user.email "harbor-goldens@users.noreply.github.com"
          # `git add` aborts the WHOLE invocation when one pathspec matches
          # nothing, so a repo with no *.verified.* files staged nothing at
          # all and every dispatch reported "No baseline changes". Add each
          # pattern on its own so a missing family cannot swallow the rest.
          # The Avalonia frames lane keeps reference PNGs under
          # tests/fixtures/avalonia/frames/ plus the sha256.json manifest —
          # those two paths are added as literal directories so the *.png
          # glob below cannot sweep up unrelated screenshots.
          for pattern in '*.golden.txt' '*.golden.png' '*.golden.sha256' '*.verified.*' '*hashes*.json' '*Hashes*.json' 'sha256.json'; do
            git add -A -- "$pattern" || true
          done
          git add -A -- tests/fixtures/avalonia/frames tests/Harbor.E2E.App.Avalonia/ComponentTests/baselines || true
          if git diff --cached --quiet; then
            echo "No baseline changes."
          else
            git commit -m "chore(goldens): regenerate baselines via workflow dispatch" --no-verify
            git push origin "HEAD:${{ github.ref_name }}"
          fi
