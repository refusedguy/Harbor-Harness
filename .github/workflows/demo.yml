# Regenerates the README demo GIFs whenever the TUI renderers, the demo
# command or the VHS tapes change. Local equivalent:  vhs demo/hero.tape
# (or HARBOR_DEMO=1 dotnet test tests/Harbor.Tui.E2E.Tests — TuiDemoRecorder).
#
# PRs: NOT run (saves 8-14 min per PR; GIF review artifacts were never
# inspected — regeneration happens on merge to dev/master instead).
name: demo-gifs

on:
  push:
    branches: [dev, master]
    paths:
      - "src/Harbor.Tui.**"
      - "src/Harbor.Terminal.Abstractions/**"
      - "apps/Harbor.App.Cli/**"
      - "demo/*.tape"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: write

# Hourly throttle: with our merge velocity every dev-push would otherwise
# regenerate GIFs. Manual dispatch always proceeds.
concurrency:
  group: demo-gifs-dev
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/demo.yml/runs?branch=dev&status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty')
          now=$(date -u +%s)
          if [ -z "$last" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            age=$(( now - $(date -u -d "$last" +%s) ))
            if [ "$age" -ge 3600 ]; then echo "proceed=true" >> "$GITHUB_OUTPUT";
            else echo "Last success $age seconds ago (<1h) — throttled."; echo "proceed=false" >> "$GITHUB_OUTPUT"; fi
          fi

  demo-gifs:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Build CLI (tapes run the Release binary)
        run: dotnet build apps/Harbor.App.Cli -c Release

      # vhs-action@v2 does NOT expand globs (fs.existsSync on the literal
      # string fails; @actions/exec never shells out) — pass concrete paths.
      - name: Record hero demo GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo/hero.tape
          install-fonts: true

      - name: Record markdown demo GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo/markdown.tape
          install-fonts: true

      - name: Record approval demo GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo/approval.tape
          install-fonts: true

      - name: Record plain demo GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo/plain.tape
          install-fonts: true

      - name: Validate GIFs (<5 MB each, all four present)
        run: |
          set -euo pipefail
          for gif in hero markdown approval plain; do
            file="assets/demo/${gif}-compressed.gif"
            if [ ! -f "$file" ]; then
              echo "::error::missing demo GIF: $file"; exit 1
            fi
            bytes=$(stat -c%s "$file")
            if [ "$bytes" -gt 5242880 ]; then
              echo "::error::$file is ${bytes} bytes (>5 MiB budget)"; exit 1
            fi
            echo "$file: $bytes bytes"
          done

      - name: Upload demo GIFs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-gifs
          path: assets/demo/*-compressed.gif
          if-no-files-found: warn

      - name: Commit regenerated GIFs (push to dev/master only)
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(demo): regenerate README GIFs [skip ci]"
          file_pattern: "assets/demo/*-compressed.gif"
