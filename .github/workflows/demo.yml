# Regenerates the README demo GIFs whenever the TUI renderers, the demo
# command or the VHS tapes change. Local equivalent:  vhs demo/hero.tape
# (or HARBOR_DEMO=1 dotnet test tests/Harbor.Tui.E2E.Tests — TuiDemoRecorder).
#
# DETERMINISM (issue #426). A re-record used to be a function of the runner image
# and of when the sampler happened to fire, so the committed GIFs were not
# reproducible and the drift gate below could not tell a real regression from a
# font bump. Three things are now pinned, and all three are asserted, not assumed:
#
#   1. TOOLCHAIN — demo/toolchain.lock pins vhs 0.11.0, ttyd 1.7.7 and
#      JetBrains Mono 2.304, each with a sha256. demo/install-toolchain.sh
#      verifies every download and fails if `fc-match "JetBrains Mono"` does not
#      resolve to the pinned family. The tapes drive `harbor --demo` only — no
#      fzf, vim or neovim is executed anywhere in the demo path, so nothing else
#      needs pinning. ffmpeg is the runner's; its exact version is printed into
#      the step summary and recorded in the baseline manifest, so a runner bump
#      shows up as visible provenance rather than as silent byte drift.
#
#   2. DATA PATH — every tape runs demo/run-scene.sh, which unsets every *_API_KEY
#      (so a tape cannot reach a live provider even by accident), scrubs the two
#      nondeterministic tokens the demo prints (the throw-away HOME's GUID and the
#      per-scene stopwatch), pins TZ/LANG/LC_ALL/PS1, hides the blinking cursor and
#      holds each output line for a fixed number of frame intervals. Two runs of
#      every scene produce byte-identical output, and the captured screens match.
#
#      The canonical CellForge backend (issue #440) cannot go through that pipe at
#      all: it owns the alternate screen and paints whole frames through one backend
#      write, so stdout must stay the tty and no scrubber may sit in the middle of a
#      frame. For those tapes the same two guarantees are met one level down instead
#      — `harbor demo --tui cellforge` never prints the nondeterministic tokens, and
#      its playback holds each painted frame for DEMO_CELLFORGE_STEP_MS (a whole
#      number of 1/GIF_FPS intervals, the same rule DEMO_LINE_HOLD follows for
#      lines). The record-twice check below is what proves it, for both kinds.
#
#   3. FRAME PACING — tools/demo_repro.py re-paces each capture onto a fixed
#      cadence (demo/toolchain.lock: GIF_STATE_FRAMES per screen, GIF_TAIL_FRAMES
#      for the settled screen, GIF_FRAMES as the hard ceiling). The frame count and
#      duration are therefore constants of the toolchain, not of the machine.
#
# The record-twice check (issue #426 AC) is `reproducibility=true`: it records
# every tape twice in the same job and fails unless the two passes agree. The
# default path records once and goes straight to the drift gate.
#
#   gh workflow run demo.yml                          # enforce (default)
#   gh workflow run demo.yml -f enforce=false         # annotate drift, do not block
#   gh workflow run demo.yml -f record_baseline=true  # re-record the manifest
#   gh workflow run demo.yml -f reproducibility=true   # record twice and compare
#
# The dispatch that relaxes or re-records the gate is itself the audit trail:
# every run logs its mode into the step summary.
#
# PRs: NOT run (saves 8-14 min per PR; GIF review artifacts were never
# inspected — regeneration happens on merge to dev/master instead).
name: demo-gifs

on:
  push:
    branches: [dev, master]
    paths:
      - "src/Harbor.Tui.**"
      - "src/Harbor.Terminal.Abstractions/**"
      - "apps/Harbor.App.Cli/**"
      - "demo/*.tape"
      - ".github/workflows/demo.yml"
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the run when a GIF drifts past its baseline (missing / oversized / lost frames / duration change). false = annotate only."
        type: boolean
        default: true
      size_threshold_pct:
        description: "Allowed size growth over baseline, in percent."
        type: string
        default: "20"
      duration_tolerance_ms:
        description: "Allowed absolute duration deviation from baseline, in milliseconds."
        type: string
        default: "500"
      record_baseline:
        description: "Rewrite assets/demo/baseline.json from this run's GIFs (report-only; the manifest is committed back by the auto-commit step on push runs)."
        type: boolean
        default: false
      reproducibility:
        description: "Record every tape twice in this job and fail unless both passes are identical (the machine-checked form of deterministic playback)."
        type: boolean
        default: false

permissions:
  contents: write

# Hourly throttle: with our merge velocity every dev-push would otherwise
# regenerate GIFs. Manual dispatch always proceeds.
concurrency:
  group: demo-gifs-dev
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/demo.yml/runs?branch=dev&status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty')
          now=$(date -u +%s)
          if [ -z "$last" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            age=$(( now - $(date -u -d "$last" +%s) ))
            if [ "$age" -ge 3600 ]; then echo "proceed=true" >> "$GITHUB_OUTPUT";
            else echo "Last success $age seconds ago (<1h) — throttled."; echo "proceed=false" >> "$GITHUB_OUTPUT"; fi
          fi

  demo-gifs:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Build CLI (tapes run the Release binary)
        run: dotnet build apps/Harbor.App.Cli -c Release

      # Pinned recorder: vhs + ttyd + the one font the tapes ask for, each
      # sha256-verified. vhs-action is not used because it always installs the
      # *latest* ttyd, the *latest* ffmpeg and the *latest* JetBrains Mono, so a
      # font bump would silently reflow every tape.
      - name: Install pinned recording toolchain
        run: |
          set -euo pipefail
          # DEMO_TOOLCHAIN_DIR is passed inline rather than through $GITHUB_ENV:
          # an env file written by a step is not visible until the *next* step, so
          # the installer would fall back to ~/.cache and the PATH line below
          # would point at a directory that does not exist.
          export DEMO_TOOLCHAIN_DIR="$RUNNER_TEMP/demo-toolchain"
          demo/install-toolchain.sh
          echo "$DEMO_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      # The tapes drive `harbor --demo` (in-process mock LLM, throw-away HOME), so
      # no API key is needed and none is set here. run-scene.sh unsets every
      # *_API_KEY before the CLI starts, so a tape that regressed into a live
      # provider call would fail rather than record a model-dependent GIF.
      - name: Prove the tapes need no credentials
        run: |
          set -euo pipefail
          for tape in hero markdown approval plain; do
            scene=$(grep -oE 'run-scene\.sh [a-z]+' "demo/$tape.tape" | head -1 | awk '{print $2}')
            if [ -z "$scene" ]; then
              echo "::error::demo/$tape.tape does not run demo/run-scene.sh"
              exit 1
            fi
            echo "demo/$tape.tape -> scene '$scene'"
          done

      # vhs-action@v2 does NOT expand globs (fs.existsSync on the literal
      # string fails; @actions/exec never shells out) — pass concrete paths.
      - name: Record hero demo GIF
        run: vhs demo/hero.tape

      - name: Record markdown demo GIF
        run: vhs demo/markdown.tape

      - name: Record approval demo GIF
        run: vhs demo/approval.tape

      - name: Record plain demo GIF
        run: vhs demo/plain.tape

      # Fixed frame pacing: re-emit each capture on the pinned cadence so the
      # frame count and duration are constants of the toolchain rather than of
      # the machine. Also verifies every GIF landed inside its frame budget.
      - name: Normalise frame pacing
        run: |
          set -euo pipefail
          for gif in hero markdown approval plain; do
            python3 tools/demo_repro.py normalize \
              --input "assets/demo/${gif}-raw.gif" \
              --output "assets/demo/${gif}-compressed.gif"
            rm -f "assets/demo/${gif}-raw.gif"
          done
          python3 tools/demo_repro.py report --dir assets/demo

      # Size/quality drift gate. Stdlib-only GIF walker (no decoder, no extra
      # package): reads block structure, per-frame delays and the raw LZW
      # payload bytes, which is all the comparison needs.
      #
      #   fail  — missing GIF, unreadable/truncated GIF, size above
      #           baseline + threshold, size above the 5 MiB absolute budget,
      #           lost frames, or duration changed outside tolerance;
      #   warn  — anything below a fail threshold (annotated, never fatal);
      #   table — per-GIF baseline -> actual size / frames / duration / delta
      #           in the step summary.
      #
      # inputs.* is empty on push runs, so the `|| '…'` defaults below make the
      # gate behave identically whether it was triggered by a push or a
      # workflow_dispatch that left the inputs alone.
      - name: Drift gate (size / frames / duration vs baseline)
        env:
          ENFORCE: ${{ inputs.enforce }}
          SIZE_THRESHOLD_PCT: ${{ inputs.size_threshold_pct || '20' }}
          DURATION_TOLERANCE_MS: ${{ inputs.duration_tolerance_ms || '500' }}
          RECORD_BASELINE: ${{ inputs.record_baseline }}
          BASELINE_STAMP: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          # Demo GIF size/quality drift gate (issue #425).
          #
          # Compares freshly recorded README demo GIFs against the committed baseline
          # manifest `assets/demo/baseline.json` and reports size / frame-count /
          # duration / content drift. Stdlib only — no GIF decoder, no new package: we
          # read block structure, per-frame delays and the raw LZW payload bytes, which
          # is all the comparison needs.
          #
          #   fail  — missing/unreadable GIF, size above baseline + threshold, size above
          #           the 5 MiB absolute budget, lost frames, duration changed outside
          #           tolerance;
          #   warn  — anything below a fail threshold (annotated, never fatal);
          #   table — per-GIF baseline -> actual size / frames / duration / delta in the
          #           GitHub Step Summary.

          GIFS = ("hero", "markdown", "approval", "plain")
          BASELINE_PATH = Path("assets/demo/baseline.json")
          ABSOLUTE_CAP_BYTES = 5 * 1024 * 1024

          GENERATOR = ".github/workflows/demo.yml (drift gate, stdlib GIF walker)"
          NOTES = (
              "Per GIF: byte size, frame count, total duration, and a content-hash summary. "
              "`framesSha256` is the sha256 over every per-frame LZW payload digest, in frame "
              "order (that rollup is the per-frame content hash summary); `uniqueFrames` counts "
              "the distinct per-frame digests. The gate fails on a missing GIF, size above "
              "baseline + threshold, lost frames, or a duration change outside tolerance, and "
              "warns on anything smaller. Re-record with: gh workflow run demo.yml "
              "-f record_baseline=true"
          )


          def _sub_blocks(buf, i):
              """Concatenate a GIF data sub-block chain."""
              out = bytearray()
              while True:
                  if i >= len(buf):
                      raise ValueError("truncated GIF: sub-block chain runs past end of file")
                  size = buf[i]
                  i += 1
                  if size == 0:
                      return bytes(out), i
                  if i + size > len(buf):
                      raise ValueError("truncated GIF: sub-block runs past end of file")
                  out += buf[i:i + size]
                  i += size


          def measure(path):
              """Walk a GIF block by block and report its size / shape."""
              buf = Path(path).read_bytes()
              if buf[:6] not in (b"GIF89a", b"GIF87a"):
                  raise ValueError(f"not a GIF (bad signature {buf[:6]!r})")

              packed = buf[10]
              i = 13 + (3 * (1 << ((packed & 0x07) + 1)) if packed & 0x80 else 0)

              frames = 0
              duration_cs = 0
              digests = []
              delay_cs = 0

              while i < len(buf) and buf[i] != 0x3B:  # 0x3B = trailer
                  marker = buf[i]
                  if marker == 0x21:  # extension
                      if i + 2 > len(buf):
                          raise ValueError("truncated GIF: extension introducer runs past end of file")
                      if buf[i + 1] == 0xF9:  # graphic control -> next frame delay
                          delay_cs = int.from_bytes(buf[i + 4:i + 6], "little")
                      _, i = _sub_blocks(buf, i + 2)
                      continue
                  if marker != 0x2C:  # 0x2C = image descriptor
                      raise ValueError(f"unexpected GIF block 0x{marker:02X} at offset {i}")
                  local = buf[i + 9]
                  i += 10 + (3 * (1 << ((local & 0x07) + 1)) if local & 0x80 else 0) + 1
                  payload, i = _sub_blocks(buf, i)
                  frames += 1
                  duration_cs += delay_cs
                  delay_cs = 0
                  digests.append(hashlib.sha256(payload).hexdigest())

              if frames == 0:
                  raise ValueError("truncated GIF: no image frames found")

              rollup = hashlib.sha256()
              for digest in digests:
                  rollup.update(digest.encode("ascii"))

              return {
                  "bytes": len(buf),
                  "width": int.from_bytes(buf[6:8], "little"),
                  "height": int.from_bytes(buf[8:10], "little"),
                  "frames": frames,
                  "durationMs": duration_cs * 10,
                  "uniqueFrames": len(set(digests)),
                  "fileSha256": hashlib.sha256(buf).hexdigest(),
                  "framesSha256": rollup.hexdigest(),
              }


          def _delta(actual, base):
              return 100.0 * (actual - base) / base if base else 0.0


          def _flag(msg):
              print(f"::error::{msg}", flush=True)


          def _note(msg):
              print(f"::warning::{msg}", flush=True)


          def _threshold(name, default, minimum=0.0):
              """Parse a free-text dispatch input, falling back to the default so a typo
              in the dispatch form degrades to the documented threshold instead of
              crashing the gate."""
              raw = (os.environ.get(name) or "").strip()
              if not raw:
                  return default
              try:
                  value = float(raw)
              except ValueError:
                  _note(f"{name}={raw!r} is not a number — falling back to the default {default:g}")
                  return default
              if value < minimum:
                  _note(f"{name}={raw} is below the floor {minimum:g} — clamped")
                  return minimum
              return value


          # inputs.* is empty on push runs, so the `or <default>` fallbacks below keep the
          # gate behaving identically whether it was triggered by a push or by a
          # workflow_dispatch that left the inputs alone.
          SIZE_PCT = _threshold("SIZE_THRESHOLD_PCT", 20)
          DURATION_TOL = _threshold("DURATION_TOLERANCE_MS", 500)
          RECORD = (os.environ.get("RECORD_BASELINE") or "").strip().lower() in ("true", "1", "yes")
          ENFORCE = (os.environ.get("ENFORCE") or "").strip().lower() not in ("false", "0", "no")
          if RECORD:
              # Re-baselining is a deliberate, reviewed act — report, never block.
              ENFORCE = False
              print("::notice::record_baseline=true — the manifest is rewritten, the gate is report-only")

          actual, errors, warnings = {}, [], []
          for name in GIFS:
              path = Path(f"assets/demo/{name}-compressed.gif")
              if not path.is_file():
                  errors.append(f"missing demo GIF: {path}")
                  continue
              try:
                  actual[name] = measure(path)
              except (OSError, ValueError, IndexError) as ex:
                  errors.append(f"unreadable demo asset: {path}: {ex}")

          baseline = {}
          if BASELINE_PATH.is_file():
              try:
                  baseline = json.loads(BASELINE_PATH.read_text()).get("gifs", {})
              except json.JSONDecodeError as ex:
                  errors.append(f"unreadable baseline manifest: {BASELINE_PATH}: {ex}")
          elif not RECORD:
              errors.append(
                  f"missing baseline manifest: {BASELINE_PATH} "
                  f"(run: gh workflow run demo.yml -f record_baseline=true)"
              )

          rows = []
          for name in GIFS:
              gif = f"assets/demo/{name}-compressed.gif"
              a = actual.get(name)
              b = baseline.get(name)
              if a is None:
                  rows.append(f"| `{name}` | — | — | — | — | — | — | — | — | ❌ missing |")
                  continue
              if b is None:
                  rows.append(
                      f"| `{name}` | — | {a['bytes']:,} | new | — | {a['frames']} | — | "
                      f"{a['durationMs']} ms | new | ⚠️ no baseline |"
                  )
                  warnings.append(f"`{gif}` has no baseline entry — treated as newly recorded")
                  continue

              failed, drifted = [], []
              growth = _delta(a["bytes"], b["bytes"])
              if a["bytes"] > b["bytes"] * (1 + SIZE_PCT / 100.0):
                  errors.append(
                      f"`{gif}` is {a['bytes']:,} bytes — +{growth:.1f}% over its baseline of "
                      f"{b['bytes']:,} (limit +{SIZE_PCT:g}%). A size blowup is the cheapest proxy "
                      f"for a broken or looping render."
                  )
                  failed.append("size")
              elif growth > 0:
                  warnings.append(
                      f"`{gif}` grew +{growth:.1f}% ({b['bytes']:,} → {a['bytes']:,} bytes), "
                      f"under the +{SIZE_PCT:g}% limit"
                  )
                  drifted.append("size")

              if a["bytes"] > ABSOLUTE_CAP_BYTES:
                  errors.append(f"`{gif}` is {a['bytes']:,} bytes (> 5 MiB absolute budget)")
                  failed.append("size")

              frame_delta = a["frames"] - b["frames"]
              if frame_delta < 0:
                  errors.append(
                      f"`{gif}` lost frames: {a['frames']} recorded vs {b['frames']} in the "
                      f"baseline ({frame_delta:+d}) — the render truncated or stalled"
                  )
                  failed.append("frames")
              elif frame_delta:
                  warnings.append(
                      f"`{gif}` frame count {b['frames']} → {a['frames']} ({frame_delta:+d})"
                  )
                  drifted.append("frames")

              d_ms = a["durationMs"] - b["durationMs"]
              if abs(d_ms) > DURATION_TOL:
                  errors.append(
                      f"`{gif}` duration {b['durationMs']} ms → {a['durationMs']} ms ({d_ms:+d} ms), "
                      f"outside the ±{DURATION_TOL:g} ms tolerance"
                  )
                  failed.append("duration")
              elif d_ms:
                  warnings.append(
                      f"`{gif}` duration {b['durationMs']} ms → {a['durationMs']} ms ({d_ms:+d} ms)"
                  )
                  drifted.append("duration")

              same = a["framesSha256"] == b.get("framesSha256")
              if failed:
                  verdict = "❌ " + ", ".join(failed)
              elif drifted:
                  verdict = "⚠️ " + ", ".join(drifted)
              elif not same:
                  verdict = "ℹ️ content"
              else:
                  verdict = "✅ ok"

              rows.append(
                  f"| `{name}` | {b['bytes']:,} | {a['bytes']:,} | {growth:+.1f}% | "
                  f"{b['frames']} | {a['frames']} | {b['durationMs']} ms | {a['durationMs']} ms | "
                  f"{'same' if same else 'changed'} | {verdict} |"
              )

          for warning in warnings:
              _note(warning)

          if ENFORCE:
              mode = "enforced"
          elif RECORD:
              mode = "report-only (re-baselining)"
          else:
              mode = "report-only (enforce=false)"

          summary = [
              "## Demo GIF drift gate",
              "",
              f"Mode **{mode}** · size budget **baseline +{SIZE_PCT:g}%** · "
              f"duration tolerance **±{DURATION_TOL:g} ms** · absolute cap **5 MiB**",
              "",
              "Baseline manifest: [`assets/demo/baseline.json`](assets/demo/baseline.json)",
              "",
              "| gif | baseline | actual | Δ size | baseline frames | actual frames "
              "| baseline dur | actual dur | content | verdict |",
              "|---|---|---|---|---|---|---|---|---|---|",
              *rows,
              "",
          ]
          if RECORD:
              summary += [
                  "**Baseline re-recorded** from this run's output — `assets/demo/baseline.json` "
                  "was rewritten and is committed back by the auto-commit step (push runs only).",
                  "",
              ]
          if errors:
              outcome = "failed the gate — the GIFs were NOT committed" if ENFORCE else "reported; gate relaxed"
              summary += [f"**{len(errors)} finding(s) {outcome}**", ""]
              summary += [f"- {e}" for e in errors]
              summary += [""]
          else:
              summary += ["**No drift beyond the configured thresholds.**", ""]

          text = "\n".join(summary) + "\n"
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a") as fh:
                  fh.write(text)
          print(text)

          exit_code = 0
          if RECORD:
              if len(actual) != len(GIFS):
                  _flag(f"refusing to re-record: only {len(actual)}/{len(GIFS)} GIFs present")
                  raise SystemExit(1)
              recorded = {
                  "version": 1,
                  "generatedAt": os.environ.get("BASELINE_STAMP", ""),
                  "generator": GENERATOR,
                  "notes": NOTES,
                  "gifs": {
                      name: {"path": f"assets/demo/{name}-compressed.gif", **actual[name]}
                      for name in GIFS
                  },
              }
              BASELINE_PATH.parent.mkdir(parents=True, exist_ok=True)
              BASELINE_PATH.write_text(json.dumps(recorded, indent=2) + "\n")
              print(f"::notice::re-recorded {BASELINE_PATH}")

          if errors and ENFORCE:
              for error in errors:
                  _flag(error)
              exit_code = 1
          elif errors:
              for error in errors:
                  _note(error)

          raise SystemExit(exit_code)
          PY

      - name: Upload demo GIFs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-gifs
          path: |
            assets/demo/*-compressed.gif
            assets/demo/baseline.json
          if-no-files-found: warn

      # Commit regenerated GIFs — explicit rather than git-auto-commit-action.
      #
      # That action commits and pushes in one shot, so when dev moves while the
      # recording is running (it takes minutes) the push is rejected and the job
      # goes red on a pure race. That is what happened on dev at 09:41.
      #
      # The obvious fix — `continue-on-error`, or a `skip` — is the wrong one,
      # and it is worth being explicit about why. If the GIFs DID change, a
      # swallowed push means the regeneration is silently dropped: the job
      # reports success, the README GIFs are stale, and nothing records that
      # anyone noticed. That is a gate that looks present and does nothing,
      # which is the failure mode this repo keeps paying for. A red that means
      # "I could not save the regenerated output" is honest; a green that means
      # "I threw the regenerated output away" is not.
      #
      # So: commit, then rebase onto the current remote and push, with retries.
      # A race resolves. A genuine problem — an unresolvable conflict, a
      # rejected permission — still fails, which is correct.
      - name: Commit regenerated GIFs (push to dev/master only)
        if: github.event_name == 'push'
        env:
          DEMO_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name  "refusedguy"
          git config user.email "refusedguy@users.noreply.github.com"

          # Nothing to do is the common case: most pushes do not touch a tape,
          # so the recording is byte-identical. Say so and leave.
          if git diff --quiet -- assets/demo/ && git diff --cached --quiet -- assets/demo/; then
            echo "no GIF drift — nothing to commit"
            exit 0
          fi

          git add assets/demo/*-compressed.gif assets/demo/baseline.json
          if git diff --cached --quiet; then
            echo "no GIF drift after staging — nothing to commit"
            exit 0
          fi

          git commit -m "chore(demo): regenerate README GIFs [skip ci]"

          # Race-tolerant push. Each attempt re-fetches and rebases onto
          # whatever dev is now, so a commit that landed while the tape was
          # recording does not block the regenerated output from landing too.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEMO_BRANCH" --quiet
            if git rebase "origin/$DEMO_BRANCH" 2>/dev/null; then
              if git push origin "HEAD:$DEMO_BRANCH"; then
                echo "pushed regenerated GIFs on attempt $attempt"
                exit 0
              fi
            else
              # A real conflict in the demo assets: abort the rebase and let the
              # job fail loudly rather than force-push over someone's work.
              git rebase --abort || true
              echo "::error::rebase onto origin/$DEMO_BRANCH conflicts; regenerated GIFs NOT committed" >&2
              exit 1
            fi
            echo "push attempt $attempt lost a race with origin/$DEMO_BRANCH; retrying"
            sleep $((attempt * 5))
          done

          echo "::error::could not push regenerated GIFs after 5 attempts; the drift gate above passed, so the recording is newer than assets/demo/ on $DEMO_BRANCH" >&2
          exit 1

  # Record-twice reproducibility check (issue #426). Records every tape twice in
  # the same job — same runner, same toolchain, same build — and fails unless the
  # two passes agree on the frame envelope, on every screen shown, and on the
  # settled final screen. This is the machine-checkable form of "deterministic
  # playback": without it, "deterministic" is a claim in a comment.
  demo-reproducibility:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true' && inputs.reproducibility == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Build CLI (tapes run the Release binary)
        run: dotnet build apps/Harbor.App.Cli -c Release

      - name: Install pinned recording toolchain
        run: |
          set -euo pipefail
          # DEMO_TOOLCHAIN_DIR is passed inline rather than through $GITHUB_ENV:
          # an env file written by a step is not visible until the *next* step, so
          # the installer would fall back to ~/.cache and the PATH line below
          # would point at a directory that does not exist.
          export DEMO_TOOLCHAIN_DIR="$RUNNER_TEMP/demo-toolchain"
          demo/install-toolchain.sh
          echo "$DEMO_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Record every tape twice
        run: |
          set -euo pipefail
          for pass in A B; do
            for tape in hero markdown approval plain; do
              # Each pass writes to its own tree so the two never overwrite
              # each other and the comparison is pass-A vs pass-B, not a file
              # compared against itself.
              mkdir -p "$RUNNER_TEMP/pass-$pass"
              sed "s#^Output \"assets/demo/$tape-raw.gif\"\$#Output \"$RUNNER_TEMP/pass-$pass/$tape-raw.gif\"#" \
                "demo/$tape.tape" > "$RUNNER_TEMP/pass-$pass/$tape.tape"
              vhs "$RUNNER_TEMP/pass-$pass/$tape.tape"
              python3 tools/demo_repro.py normalize \
                --input "$RUNNER_TEMP/pass-$pass/$tape-raw.gif" \
                --output "$RUNNER_TEMP/pass-$pass/$tape.gif"
            done
          done

      - name: Compare the two passes
        run: |
          set -euo pipefail
          failed=0
          for tape in hero markdown approval plain; do
            if ! python3 tools/demo_repro.py compare \
              --a "$RUNNER_TEMP/pass-A/$tape.gif" \
              --b "$RUNNER_TEMP/pass-B/$tape.gif" \
              --name "$tape" --summary; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::demo playback is NOT reproducible — see the per-tape findings above"
            exit 1
          fi
          echo "Every tape produced identical output in both passes."

      - name: Upload both passes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-reproducibility
          path: |
            ${{ runner.temp }}/pass-A/*.gif
            ${{ runner.temp }}/pass-B/*.gif
          if-no-files-found: warn
